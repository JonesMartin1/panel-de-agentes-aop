    e.dataTransfer.effectAllowed = 'move';
    // Firefox no arranca el arrastre si no se setea algo en el dataTransfer.
    try { e.dataTransfer.setData('text/plain', el.dataset.sid || ''); } catch (_) {}
  };
  el.ondrop = e => e.preventDefault();
  el.ondragend = () => {
    el.classList.remove('moviendo');
    arrastrando = false;
    // ⭐ Si lo que moviste fue una PASTILLA, lo que cambió es el orden de los proyectos:
    // se rehace la lista poniendo los grupos como quedaron en pantalla, cada uno con sus
    // charlas en el orden que ya tenían. De paso, un grupo cuyas pestañas estaban
    // intercaladas en la lista queda junto, que es como se ve desde que hay grupos.
    if (el.classList.contains('grupo')){
      const orden = [...document.querySelectorAll('#tabs .grupo')].map(g => g.dataset.grupo);
      const nuevo = [];
      orden.forEach(n => abiertas.forEach(t => { if (grupoDe(t) === n) nuevo.push(t); }));
      abiertas.forEach(t => { if (!nuevo.includes(t)) nuevo.push(t); });   // por las dudas
      abiertas = nuevo;
      guardar(); pintarTabs();
      return;
    }
    // El orden manda desde la pantalla: se lee cómo quedaron las pestañas y se
    // reordena la lista real con eso.
    const orden = [...document.querySelectorAll('#tabs .tab[data-i]')].map(x => x.dataset.sid);
    // ⚠ Con las pestañas agrupadas, en pantalla están SOLO las del grupo desplegado: un
    // `sort` por ese orden mandaba a las escondidas al principio (les daba -1) y te
    // reordenaba grupos que ni se veían. Se permutan únicamente las que están a la
    // vista, dejando cada una de las demás en el lugar que ya tenía (2026-08-17).
    const huecos = [];
    abiertas.forEach((t, i) => { if (orden.includes(t.sid)) huecos.push(i); });
    const movidas = orden.map(s => abiertas.find(t => t.sid === s)).filter(Boolean);
    huecos.forEach((i, k) => { if (movidas[k]) abiertas[i] = movidas[k]; });
    guardar(); pintarTabs();
  };
}

// El ＋ de la barra: una charla nueva en el proyecto donde estás parado — la carpeta
// marcada, que desde hoy sigue a la pestaña que mirás. En "Todas" no hay un proyecto,
// así que la pestaña se abre igual y adentro te pide la carpeta: preferimos preguntar
// a adivinar, que es la regla de la casa.
// ⭐ El ＋ te lleva a "Todas" — lo mismo que tocar esa carpeta a la izquierda (pedido de
// Martín, 2026-08-17, dibujado con flecha). Es la bandeja con TODAS las conversaciones,
// la más nueva arriba: de ahí entrás a cualquiera, y la primera fila arranca una nueva.
function nuevaCharla(){ irProyecto(TODAS); }

// Una pestaña nueva sin carpeta todavía: adentro se elige el proyecto (y de paso se
// puede entrar a una de las últimas cinco de cada uno).
function nuevaPestana(){
  // Apretarlo tres veces no tiene que dejar tres pestañas vacías iguales. (Al mandar el
  // primer mensaje la pestaña cambia su `sid` por el de verdad, así que una charla ya
  // empezada nunca entra acá.)
  const ya = abiertas.find(t => t.sid.startsWith('nueva-') && !t.cwd);
  if (ya) return irTab(ya.sid);
  abrirSesion('', '', 'Nueva…');
}

// --- La dirección web: una por conversación -----------------------------------------
// Pedido de Martín (2026-08-18): "quiero que cada conversación tenga su propia dirección
// web, para poder guardarla en favoritos y tener varias pestañas del navegador, cada una
// en una conversación distinta". La barra de direcciones queda siendo el reflejo de lo
// que estás mirando: `/sesiones?c=<id>` con una charla abierta, `/sesiones` en la bandeja.
// Lo mecánico (escribir la barra, el título, el historial) vive en `/estaticos/direccion.js`,
// compartido con la app del celular.

// Cómo se llama esta charla, para el título de la pestaña del navegador y del favorito.
// Vale más el nombre de la lista (viene entero y al día) que el que guardó la pestaña.
function nombreDe(t){
  if (!t) return '';
  const s = datos.proyectos.flatMap(p => p.sesiones).find(x => x.id === t.sid);
  return (s && s.nombre) || t.nombre || 'Conversación';
}

// ⚠ Las charlas todavía sin estrenar (`nueva-…`) NO van a la dirección: ese id es
// provisorio y de esta pantalla, no significa nada en otra pestaña ni mañana.
function fijarDireccion(opciones){
  if (!window.Direccion) return;
  const t = abiertas.find(x => x.sid === activa);
  const real = !!t && !t.sid.startsWith('nueva-');
  Direccion.fijar(real ? {c: t.sid} : {},
                  Object.assign({titulo: real ? nombreDe(t) : ''}, opciones || {}));
}

// Abrir una conversación te devuelve lo que habías dejado escrito, listo para seguir.
// ⚠ Se pone el borrador ENTERO, nunca el anticipo de 120 letras que trae la lista: eso
// alcanza para mostrarlo en la bandeja, pero devolverlo cortado a la caja sería comerse
// la mitad de lo que escribiste sin avisar.
function ponerBorradorEnCaja(sid){
  const c = $('#texto');
  if (!c) return;
  c.value = borradores[sid] || '';
  ajustarCaja();
}

// ⭐ El alto de la caja lo decide lo que tenés escrito: crece hasta el tope del CSS y
// vuelve sola al renglón único cuando se vacía. Va TODO por acá (escribir, abrir una
// charla con borrador, pegar una ruta, mandar) para que sea una sola regla y no cuatro
// copias que se desincronizan.
// ⚠ Se vuelve a llamar cuando cambia el ANCHO —zoom del navegador, aparece el botón
// Parar, se pliega el árbol—: el alto se guarda en píxeles y el mismo texto necesita más
// o menos renglones según lo ancha que esté la caja. Sin esto quedaba con el alto de la
// medida anterior: agrandada de cuando era angosta, o cortada de cuando era ancha.
function ajustarCaja(){
  const c = $('#texto');
  if (!c) return;
  c.style.height = 'auto';
  if (c.value) c.style.height = c.scrollHeight + 'px';
}

function irTab(sid){
  // Lo que estabas escribiendo en la otra conversación se guarda antes de soltarla.
  if (activa && activa !== sid) soltarBorrador();
  activa = sid;
  recienAbierta = true;          // que caiga en lo último dicho, no donde quedó el scroll
  // ⭐ La carpeta marcada a la izquierda SIGUE a la pestaña que estás mirando
  // (pedido de Martín, 2026-08-17): antes quedaba marcada la última que tocaste,
  // así que uno leía una charla de un proyecto con otro pintado al lado.
  const n = proyectoDe(abiertas.find(x => x.sid === sid));
  if (n) proy = n;
  perdida = '';                  // si había un aviso de dirección perdida, ya no viene al caso
  delete pendientes[sid];        // la estás mirando: ya no te espera
  delete falladas[sid];          // ya viste que falló: la marca roja cumplió su trabajo
  visto[sid] = Date.now() / 1000;
  fijarDireccion();              // la barra de direcciones sigue a la charla que abrís
  firma=''; guardar(); pintarCarpetas(); pintarTabs(); pintar();
  // Va DESPUÉS de `pintar()`: es ahí donde la caja de escribir se muestra, y con la caja
  // escondida el alto del texto mide cero y quedaba de un renglón con cinco escritos.
  ponerBorradorEnCaja(sid);
  // Las marcas de esta charla se piden al abrirla y se repinta cuando llegan: son un
  // pedido chiquito y no tiene sentido esperarlas para mostrar la conversación.
  if (window.Marcas && !sid.startsWith('nueva-'))
    Marcas.cargar(sid).then(() => { if (activa === sid){ firma=''; pintar(); } });
}

function cerrar(i){
  // Cerrar la pestaña NO tira el borrador: sigue en el servidor y la conversación queda
  // marcada en la bandeja, que es justamente para lo que sirve. Lo único que se limpia es
  // el de una charla sin estrenar: ese id se muere con la pestaña.
  soltarBorrador();
  const yendo = (abiertas[i] || {}).sid;
  if (yendo && yendo.startsWith('nueva-')){ delete borradores[yendo]; guardarBorradores(); }
  abiertas.splice(i,1);
  // ⭐ Cerrar una pestaña te deja en "Todas" (pedido de Martín, 2026-08-17): si le diste
  // la cruz es que terminaste con esa charla, y lo que se quiere ver después es la
  // bandeja con todo, no la carpeta suelta en la que estabas parado.
  activa = null; proy = TODAS; recienAbierta = true;
  fijarDireccion();
  firma=''; guardar(); pintarCarpetas(); pintarTabs(); pintar();
  cargar();
}

// ⭐ Abrir una conversación. Con `fondo` la pestaña queda arriba pero NO te lleva a ella:
// seguís en la lista. Es el botón del medio del mouse, igual que en el navegador (pedido
// de Martín, 2026-08-19): vas marcando las tres o cuatro que te interesan de un saque y
// después las recorrés, en vez de entrar y volver por cada una.
function abrirSesion(cwd, sid, nombre, fondo, cerebro){
  if (!sid) sid = 'nueva-' + Date.now();
  if (!abiertas.some(t => t.sid === sid))
    abiertas.push({sid, cwd, nombre, cerebro: cerebro || ''});
  if (!fondo) return irTab(sid);
  // ⚠ El grupo del proyecto tiene que quedar DESPLEGADO: si cae adentro de una pastilla
  // plegada no se ve nada y el clic se siente como que no hizo nada, que es exactamente
  // lo que hay que evitar cuando la pantalla por lo demás no cambia.
  const t = abiertas.find(x => x.sid === sid);
  if (t) grupoAbierto = grupoDe(t);
  recienTab = sid;
  guardar(); pintarTabs();
  // La barra puede tener veinte pestañas y la nueva caer fuera de la vista.
  const el = document.querySelector('#tabs .tab[data-sid="' + CSS.escape(sid) + '"]');
  if (el) el.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'smooth'});
  // ⚠ La marca se apaga con un repintado y no con una clase que se saca a mano: la barra
  // se redibuja sola cada pocos segundos y se la llevaría puesta antes de que la veas.
  setTimeout(() => { if (recienTab === sid){ recienTab = ''; pintarTabs(); } }, 1500);
}

let recienTab = '';      // la pestaña recién abierta en segundo plano, para que parpadee

async function pintar(){
  $('#caja').style.display = activa ? 'flex' : 'none';
  sincronizarArbol();
  // Con un archivo abierto, la derecha lo muestra a él. La caja de escribir se deja
  // igual: mirás el archivo y le escribís a la conversación sin cerrar nada.
  if (verArchivo) return pintarArchivo();
  return activa ? pintarSesion() : pintarLista();
}

const TODAS = '✉ Todas las conversaciones';

function pintarLista(){
  // "Todas" es la bandeja de entrada: las conversaciones de TODOS los proyectos
  // mezcladas y ordenadas de la más nueva a la más vieja, como el correo. Adentro
  // de una carpeta se ve solo lo de ese proyecto (pedido de Martín, 2026-08-17).
  const todas = proy === TODAS;
  const p = todas ? null : datos.proyectos.find(x => x.proyecto === proy);
  if (!todas && !p) return;
  let filas = todas
    ? datos.proyectos.flatMap(x => x.sesiones.map(s => ({...s, cwd: x.cwd, proy: x.proyecto})))
    : p.sesiones.map(s => ({...s, cwd: p.cwd, proy: p.proyecto}));
  // ⭐ Tapada = se compactó o se mudó de cerebro y su continuación está acá mismo
  // (2026-08-21). No se dibuja: abrir la continuación ya te muestra esta charla cosida
  // arriba, así que la fila vieja era la MISMA conversación repetida y muerta. El
  // servidor solo tapa cuando la nueva está a la vista; si no, la vieja sigue en la
  // lista con su chapa "⇲ sigue en otra".
  filas = filas.filter(s => !s.tapada);
  filas.sort((a, b) => (b.ts || 0) - (a.ts || 0));            // la más reciente arriba
  // Archivada = la sacaste de la bandeja. Se esconde de la lista normal y se ve
  // aparte, para poder devolverla.
  // ⭐ Las archivadas siguen la carpeta donde estás parado (pedido de Martín, 2026-08-17):
  // adentro de un proyecto se ven solo las de ese proyecto, y en "Todas" se ven todas
  // juntas. Antes eran SIEMPRE globales, justamente porque contándolas por carpeta el
  // botón desaparecía al moverte y lo guardado no tenía dónde ir a buscarse; eso lo
  // resuelve "Todas", que es el lugar fijo donde están todas y no depende de acordarte
  // de qué proyecto salió.
  const guardada = esArchivada;
  const guardadas = (todas
      ? datos.proyectos.flatMap(x => x.sesiones.map(s => ({...s, cwd: x.cwd, proy: x.proyecto})))
      : p.sesiones.map(s => ({...s, cwd: p.cwd, proy: p.proyecto})))
    // Una tapada no va tampoco acá: no la guardaste vos, la conversación siguió de largo.
    .filter(s => guardada(s) && !s.tapada).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const cuantasGuardadas = guardadas.length;
  filas = viendoArchivadas ? guardadas : filas.filter(s => !guardada(s));
  // ⚠ El filtro se lee del propio campo, salvo cuando volviste de otra pantalla y hay uno
  // pendiente de devolver: ahí manda ése, porque el campo todavía se está rehaciendo.
  const q = (filtroPendiente !== null ? filtroPendiente
             : (($('#filtro') && $('#filtro').value) || '')).toLowerCase().trim();
  if (q) filas = filas.filter(s => (s.nombre || '').toLowerCase().includes(q)
                                || (s.proy || '').toLowerCase().includes(q));
  // ⭐⭐ LOS TRES COLORES, como los eligió Martín el 2026-08-17 (y en este orden de
  // prioridad, que es el de "qué necesito saber primero"):
  //   ROJO      falló — lo último que mandaste volvió con error, se cortó, o se pasó
  //             de los 10 minutos que aguanta el panel. Es el ÚNICO que dice
  //             "algo está mal", por eso ningún estado normal usa rojo.
  //   AMARILLO  está trabajando ahora mismo: esperá.
  //   VERDE     te está esperando a VOS: la pelota es tuya, entrá y contestá.
  // ⚠ Que el último mensaje sea de Claude NO alcanza para decir que te espera:
  // mientras piensa va escribiendo, así que el archivo se llena de mensajes suyos y
  // TODO aparecía marcado. Se mira además hace cuánto se movió el archivo:
  //   se movió recién  -> está trabajando
  //   viva y quieta    -> terminó y te espera
  //   cerrada          -> depende de hace cuánto (abajo)
  // ⭐ Las que NO están vivas también pueden estar esperándote: una charla que
  // arrancaste desde el celular no deja proceso abierto (el turno termina y el proceso
  // muere), y son justo las que más esperan respuesta. Se marcan igual.
  // ⭐⭐ El verde dura HASTA QUE ENTRES, no importa cuánto pase (pedido de Martín,
  // 2026-08-17). Hubo un tope de una hora, y tenía sentido cuando la única forma de
  // apagar el verde era el reloj: sin él quedaban marcadas las 56 de la lista, porque
  // casi toda charla termina con Claude hablando. Desde que existe `visto` eso lo
  // resuelve el hecho de ABRIRLA, que es lo que de verdad significa "ya lo vi": con el
  // tope puesto, una respuesta de anoche se apagaba sola sin que nadie la leyera, que
  // es justo lo que él vino a preguntar ("aparecen como vistas y yo no abrí ninguna").
  const QUIETA = 45;                       // segundos sin escribir = ya terminó
  const ahora = Date.now() / 1000;
  const estado = s => {
    if (falladas[s.id]) return 'fallada';
    if (s.ocupada) return 'trabajando';
    const quieta = (ahora - (s.ts || 0)) > QUIETA;
    // ⭐ Un turno lanzado desde el panel o el celular VIVE SOLO MIENTRAS PIENSA: cuando
    // contesta, el proceso muere. Así que si está vivo, está trabajando — aunque haga
    // rato que no escribe, porque puede pasarse minutos adentro de una herramienta sin
    // tocar el archivo. Antes se miraba solo el reloj y a los 45 s lo daba por
    // terminado: una charla pensando hace 3 minutos figuraba "te está esperando"
    // mientras en la pestaña se la veía pensando (2026-08-17).
    // Lo único que puede estar vivo sin hacer nada es una ventana de Claude Code
    // abierta en la compu (interactiva): esa sí se juzga por el reloj.
    if (s.viva && !s.interactiva) return 'trabajando';
    if (s.viva && !quieta) return 'trabajando';
    if (s.ultimo !== 'claude') return '';
    // ⭐ Si ya entraste a leerla DESPUÉS de que contestó, deja de esperarte: seguirá
    // diciendo "te espera" cuando vos ya lo viste es ruido, y con la bandeja entera en
    // verde el color dejaba de significar algo (pedido de Martín, 2026-08-17).
    if ((visto[s.id] || 0) >= (s.ts || 0)) return '';
    return 'espera';
  };
  // ⚠ El estado VA en la firma. Antes la firma miraba solo nombre/vivo/detalle, y una
  // conversación que pasaba de "trabajando" a "te está esperando" no cambiaba ninguno
  // de esos: la lista se creía igual y no se repintaba, así que quedaba en verde
  // aunque ya te estuviera esperando (2026-08-17).
  // ⚠ El borrador VA en la firma, como el estado: escribir media frase y volver a la
  // bandeja tiene que prender la chapa, y sin esto la lista se creía igual y no repintaba.
  // Van 60 letras y no el texto entero: es una firma, no el dato.
  const f = JSON.stringify(['lista', proy, q, viendoArchivadas, cuantasGuardadas, perdida,
                            filas.map(s => s.id + s.nombre + s.viva + s.detalle + s.ultimo + estado(s)
                                           + (s.cerebro || '') + (s.sigue_en || '')
                                           + borradorDe(s.id, s.borrador).slice(0, 60)),
                            datos.proyectos.map(x => x.proyecto + x.sesiones.filter(v=>v.viva).length)]);
  if (f === firma) return;
  firma = f;
  const html = filas.map(s =>
    '<div class="correo ' + estado(s) + '" data-sid="' + s.id + '" data-nom="' + esc(s.nombre) +
      '" data-cwd="' + esc(s.cwd) + '" data-cer="' + esc(s.cerebro || '') + '">' +
      '<div class="ini ' + (s.viva?'viva':'') + '">' + esc((s.nombre||'?')[0].toUpperCase()) + '</div>' +
      '<div class="med"><div class="tit">' + esc(s.nombre) +
        // La chapita del cerebro: solo cuando NO es Claude, que es lo que hay que notar.
        (s.cerebro === 'codex' ? ' <span class="cer">Codex</span>' : '') +
        // ⭐ La charla que se compactó dice a dónde siguió: sin esto la bandeja se
        // llenaba de gemelas y no se sabía cuál era la viva (Martín, 2026-08-20).
        (s.sigue_en ? ' <span class="sigue" data-sigue="' + esc(s.sigue_en) +
          '" title="Se compactó: tocá para ir a la charla donde sigue">⇲ sigue en otra</span>' : '') +
        // La chapa del proyecto va cuando la lista mezcla carpetas, o sea en "Todas"
        // (también con las archivadas: sin ella no sabés qué estás devolviendo).
        // Adentro de una carpeta sobra: todo lo que se ve salió de ahí.
        (todas ? ' <span class="dedonde">' + esc(s.proy) + '</span>' : '') +
        // ⭐ La chapa de borrador, al lado del nombre: se ve en "Todas" y adentro de
        // cada carpeta, que es lo que pidió Martín señalando la bandeja.
        (hayBorrador(s.id, s.borrador)
          ? ' <span class="borra"><span class="plu">✎</span>Borrador</span>' : '') + '</div>' +
      '<div class="baj">' + esc(s.detalle||'') +
        (estado(s)==='fallada' ? ' · <b>falló</b> · ' + esc(falloQue(falladas[s.id]))
         : estado(s)==='espera' ? ' · <b>te está esperando</b>'
         : estado(s)==='trabajando' ? ' · <b>trabajando</b>' : '') +
        // Y lo que dejaste escrito, para no tener que entrar a ver de qué era.
        (hayBorrador(s.id, s.borrador)
          ? ' · <span class="bpre">' + esc(vistaBorrador(s.id, s.borrador)) + '</span>' : '') +
        '</div></div>' +
      // Mirando las archivadas, en vez del lápiz va el botón de devolver: es lo único
      // que se viene a hacer acá.
      (viendoArchivadas ? '<div class="devolver" data-dev="' + s.id + '">↩ Devolver</div>'
                        : '<div class="lapiz" data-ren="' + s.id + '">✎</div>') +
      '</div>').join('');
  // El botón de las archivadas solo aparece cuando hay alguna: si no, es un cartel
  // que no hace nada. Con el clic derecho se archiva y se desarchiva.
  const botonGuardadas = (cuantasGuardadas || viendoArchivadas)
    ? '<div class="op-arch" id="verArch">' + (viendoArchivadas
        ? '← volver a la bandeja' : '🗄 archivadas (' + cuantasGuardadas + ')') + '</div>'
    : '';
  // ⚠ Dos conversaciones VIVAS en el mismo proyecto es el unico caso peligroso de
  // verdad: las charlas no se pisan (cada una tiene su archivo), pero los ARCHIVOS
  // del repo si — una sobreescribe lo que hizo la otra. Paso el 2026-08-16 con el
  // panel. La regla del proyecto (skill `paralelo`) dice un dueño por proyecto;
  // esto es para que se vea, sin depender de que cada sesion la respete.
  const choque = {};
  for (const x of datos.proyectos){
    const vivas = x.sesiones.filter(v => v.viva);
    if (vivas.length > 1) choque[x.proyecto] = vivas.map(v => v.nombre);
  }
  // Entraste con la dirección de una charla que ya no está (un favorito de algo borrado).
  const avisoPerdida = perdida
    ? '<div class="choque">⚠ La dirección con la que entraste apunta a una conversación ' +
      'que ya no existe (<b>' + esc(perdida.slice(0, 8)) + '…</b>). Puede que la hayas ' +
      'borrado. Abajo está la bandeja completa.</div>' : '';
  const alerta = avisoPerdida + Object.entries(choque).map(([pr, ns]) =>
    '<div class="choque">⚠ <b>' + esc(pr) + '</b> tiene ' + ns.length +
    ' conversaciones abiertas a la vez: ' + esc(ns.join(', ')) +
    '. Si las dos tocan los mismos archivos, se pisan. Dejá una sola escribiendo.</div>').join('');

  $('#cuerpo').innerHTML = alerta +
    // Con la vista por carpeta, el título dice DE QUÉ carpeta son: si no, "Archivadas"
    // a secas parece la lista entera y faltarían la mitad.
    '<div class="cabeza"><b>' + esc(viendoArchivadas ? (todas ? 'Archivadas' : 'Archivadas de ' + p.proyecto)
                                  : todas ? 'Todas las conversaciones' : p.proyecto) + '</b>' +
      '<small>' + filas.length + (q ? ' que coinciden'
                                   : viendoArchivadas ? ' guardadas · tocá Devolver para que vuelvan'
                                   : ' conversaciones') + '</small>' +
      '<input id="filtro" placeholder="Filtrar…" autocomplete="off" value="' + esc(q) + '">' +
      botonGuardadas + '</div>' +
    // La fila de arrancar va en las DOS vistas. Adentro de una carpeta ya sabe dónde;
    // en "Todas" no hay carpeta, así que abre el elegidor con todos los proyectos.
    // En las archivadas no va: ahí se viene a rescatar algo, no a empezar de cero.
    (viendoArchivadas ? '' : todas ?
      '<div class="correo" data-nueva="1">' +
      '<div class="ini mas">✚</div>' +
      '<div class="med"><div class="tit nueva">Empezar una conversación</div>' +
      '<div class="baj">elegís la carpeta y arranca de cero</div></div></div>'
      :
      '<div class="correo" data-sid="" data-nom="Nueva" data-cwd="' + esc(p.cwd) + '">' +
      '<div class="ini mas">✚</div>' +
      '<div class="med"><div class="tit nueva">Empezar una conversación</div>' +
      '<div class="baj">arranca de cero en este proyecto</div></div></div>') +
    (html || '<div class="vacio">' + (viendoArchivadas
        ? 'No hay ninguna archivada. Clic derecho sobre una conversación para guardarla acá.'
        : 'Nada con ese filtro.') + '</div>');
  // ⭐ Volviste de otra pantalla del panel: la lista queda donde la dejaste. Le gana a
  // "arriba de todo" porque es más específico — arriba es lo que se hace al ENTRAR.
  if (scrollPendiente !== null){
    $('#cuerpo').scrollTop = scrollPendiente; scrollPendiente = null; recienAbierta = false;
  }
  // Recién entrada a la bandeja: arriba de todo, que es la conversación más nueva.
  // (Mientras la mirás no se toca: repintar y moverte el scroll es lo que molesta.)
  else if (recienAbierta){ $('#cuerpo').scrollTop = 0; recienAbierta = false; }
  const caja = $('#filtro');
  caja.oninput = () => { firma = ''; pintarLista(); caja.focus(); };
  // Ya está dibujado con el filtro devuelto: se suelta el pendiente y de acá en más
  // manda el campo, como siempre.
  if (filtroPendiente !== null){ filtroPendiente = null; }
  else if (q){ caja.focus(); caja.setSelectionRange(q.length, q.length); }
  if ($('#verArch'))
    $('#verArch').onclick = () => { viendoArchivadas = !viendoArchivadas;
                                    firma = ''; recienAbierta = true; pintarLista(); };
  document.querySelectorAll('#cuerpo .correo').forEach(el => {
    el.onclick = e => {
      const ren = e.target.dataset.ren;
      if (ren !== undefined) { renombrar(ren, el.dataset.nom); return; }
      const dev = e.target.dataset.dev;
      if (dev !== undefined) { archivar(dev, false); return; }   // ↩ vuelve a la bandeja
      // La chapa "sigue en otra" te lleva a la continuación, no a la charla vieja.
      const sig = e.target.dataset.sigue;
      if (sig){
        const d = datos.proyectos.flatMap(x => x.sesiones).find(x => x.id === sig);
        abrirSesion(el.dataset.cwd, sig, (d && d.nombre) || el.dataset.nom, false,
                    (d && d.cerebro) || '');
        return;
      }
      if (el.dataset.nueva !== undefined) return nuevaPestana();
      // Ctrl+clic hace lo mismo que el botón del medio, que es como funciona en todos
      // lados: el que no tiene rueda en el mouse igual lo tiene.
      abrirSesion(el.dataset.cwd, el.dataset.sid, el.dataset.nom,
                  (e.ctrlKey || e.metaKey) && !!el.dataset.sid, el.dataset.cer);
    };
    // ⭐ Botón del medio = abrir arriba SIN salir de la lista (pedido de Martín,
    // 2026-08-19). Van como propiedad y no con addEventListener: la lista se reengancha
    // en cada repintado y así no se apilan diez copias del mismo gesto.
    // ⚠ Hay que comerse el `mousedown`: Chrome le prende el desplazamiento automático al
    // botón del medio y te deja el iconito redondo dando vueltas por la pantalla.
    el.onmousedown = e => { if (e.button === 1) e.preventDefault(); };
    // ⚠ Sin `sid` no se abre nada: esa es la fila de "Empezar una conversación" (en una
    // carpeta viene con el sid vacío, no con `data-nueva`). Una charla nueva abierta a
    // escondidas no sirve para nada — a una charla nueva vas a escribirle.
    el.onauxclick = e => {
      if (e.button !== 1 || !el.dataset.sid) return;
      e.preventDefault();
      abrirSesion(el.dataset.cwd, el.dataset.sid, el.dataset.nom, true, el.dataset.cer);
    };
    // ⭐ Clic derecho = sacarla de la bandeja (o devolverla, si estás mirando las
    // archivadas). Se le come el menú del navegador a propósito: acá el botón derecho
    // sirve para esto (pedido de Martín, 2026-08-17).
    if (el.dataset.sid)
      el.oncontextmenu = e => { e.preventDefault();
                                archivar(el.dataset.sid, !viendoArchivadas); };
  });
}

// La pantalla del ＋: todas las carpetas, y adentro de cada una sus últimas cinco
// conversaciones. Dos caminos desde acá, que es justo lo que se hace al arrancar el
// día: tocás la carpeta y empezás una charla nueva ahí, o abrís el ▾ y entrás a una
// que ya existe sin tener que buscarla (pedido de Martín, 2026-08-17).
let desplegada = '';            // qué carpeta tiene mostradas sus últimas charlas
const ULTIMAS = 5;

function pintarElegirCarpeta(t){
  $('#caja').style.display = 'none';
  const html = '<div class="cabeza"><b>Empezar una conversación</b>' +
      '<small>tocá la carpeta para arrancar, o ▾ para entrar a una de las últimas</small></div>' +
    datos.proyectos.map(p => {
      const abierta = p.proyecto === desplegada;
      const ultimas = [...p.sesiones].sort((a,b) => (b.ts||0)-(a.ts||0)).slice(0, ULTIMAS);
      return '<div class="correo" data-cwd="' + esc(p.cwd) + '" data-proy="' + esc(p.proyecto) + '">' +
        '<div class="ini ' + (p.vivo?'viva':'') + '">' +
          esc((p.proyecto||'?')[0].toUpperCase()) + '</div>' +
        '<div class="med"><div class="tit">' + esc(p.proyecto) + '</div>' +
        '<div class="baj">' + esc(p.cwd||'') + '</div></div>' +
        (ultimas.length ? '<div class="lapiz despl" data-abrir="' + esc(p.proyecto) + '">' +
           (abierta ? '▴' : '▾ ' + ultimas.length) + '</div>' : '') + '</div>' +
        (abierta ? '<div class="ultimas">' + ultimas.map(s =>
           '<div class="ult" data-sid="' + s.id + '" data-cwd="' + esc(p.cwd) + '" ' +
             'data-nom="' + esc(s.nombre) + '" data-cer="' + esc(s.cerebro || '') + '">' +
             '<span class="pto ' + (s.viva?'viva':'') + '"></span>' +
             '<span class="nom">' + esc(s.nombre) + '</span>' +
             (s.cerebro === 'codex' ? '<span class="cer">Codex</span>' : '') +
             '<span class="cuando">' + esc(s.detalle||'') + '</span></div>').join('') +
           '</div>' : '');
    }).join('');
  if (html === firma) return;
  firma = html;
  $('#cuerpo').innerHTML = html;
  // Solo al entrar: si estás desplegando una carpeta de más abajo, no te tira arriba.
  if (recienAbierta){ $('#cuerpo').scrollTop = 0; recienAbierta = false; }
  document.querySelectorAll('#cuerpo .correo').forEach(el => {
    el.onclick = e => {
      const q = e.target.dataset.abrir;
      if (q !== undefined){                       // el ▾: mostrar u ocultar las últimas
        desplegada = (desplegada === q ? '' : q);
        firma=''; pintarSesion(); return;
      }
      t.cwd = el.dataset.cwd; t.nombre = 'Nueva'; proy = el.dataset.proy;
      firma=''; guardar(); pintarCarpetas(); pintarTabs(); pintar();
    };
  });
  document.querySelectorAll('#cuerpo .ult').forEach(el => {
    // Acá también vale el botón del medio: son conversaciones igual que las de la lista.
    // ⚠ Pero en segundo plano NO se come la pestaña vacía del ＋: seguís parado en ella
    // eligiendo, que es lo que estabas haciendo.
    el.onmousedown = e => { if (e.button === 1) e.preventDefault(); };
    el.onauxclick = e => {
      if (e.button !== 1) return;
      e.preventDefault();
      abrirSesion(el.dataset.cwd, el.dataset.sid, el.dataset.nom, true, el.dataset.cer);
    };
    el.onclick = e => {
      if (e.ctrlKey || e.metaKey)
        return abrirSesion(el.dataset.cwd, el.dataset.sid, el.dataset.nom, true, el.dataset.cer);
      // Entrar a una charla que ya existe: la pestaña vacía del ＋ no queda dando
      // vueltas, se convierte en la que abriste.
      const i = abiertas.indexOf(t);
      if (i >= 0) abiertas.splice(i, 1);
      activa = null;
      abrirSesion(el.dataset.cwd, el.dataset.sid, el.dataset.nom, false, el.dataset.cer);
    };
  });
}

async function pintarSesion(){
  // ⚠ Mientras mirás un archivo, la derecha es del archivo. Sin esta guarda, el
  // repintado de cada 3 segundos te tapaba el archivo con la conversación.
  if (verArchivo) return;
  const t = abiertas.find(x => x.sid === activa);
  if (!t) { activa = null; return pintar(); }
  // Con qué modelo corre esta pestaña. Adentro se sale solo si ya lo preguntó para
  // esta sesión, así que esto NO es un pedido cada 3 segundos: es uno por pestaña.
  refrescarModelo();
  const nueva = t.sid.startsWith('nueva-');
  // Pestaña recién abierta con el ＋ y sin carpeta: primero se elige dónde.
  if (nueva && !t.cwd) return pintarElegirCarpeta(t);
  let d = {mensajes: []};
  // ⚠ Una pestaña sin estrenar también pregunta por el chat (con sid vacío) MIENTRAS
  // su primer mensaje está en vuelo: si ese primer turno frena a preguntarte algo con
  // opciones, el servidor lo guarda bajo la carpeta ("nueva:<cwd>") y sin esto el
  // selector no aparecía nunca en una charla recién nacida.
  if (!nueva || enVuelo[t.sid]){
    try {
      d = await (await fetch('/movil/chat?cwd=' + encodeURIComponent(t.cwd) +
                             '&sid=' + (nueva ? '' : t.sid))).json();
    } catch(e){ return; }
  }
  if (activa !== t.sid) return;              // te fuiste a otra pestaña mientras cargaba
  // Solo una ventana de Claude Code abierta de verdad bloquea la escritura: un
  // turno lanzado desde acá también deja la sesión 'viva' y antes se bloqueaba sola.
  const viva = datos.proyectos.some(p => p.sesiones.some(s => s.id===t.sid && s.interactiva));
  const ev = enVuelo[t.sid];
  // ⭐ La burbuja de "pensando" no puede depender SOLO de que el turno lo hayas mandado
  // vos desde esta pantalla: si recargabas la página, o la charla la habías arrancado
  // desde el celular, se perdía y la sesión parecía muerta estando a full. Ahora también
  // se muestra cuando el servidor dice que el proceso está vivo y se movió recién.
  const ses = (datos.proyectos.flatMap(x => x.sesiones).find(x => x.id === t.sid)) || null;
  // Mismo criterio que la lista: proceso vivo lanzado desde acá = está pensando; una
  // ventana abierta en la compu, solo si se movió recién.
  let trabajando = !!(ses && (ses.ocupada || (ses.viva &&
        (!ses.interactiva || (Date.now()/1000 - (ses.ts || 0)) < 45))));
  // ⭐⭐ Apretaste Parar y el servidor contestó que no quedaba nada corriendo, pero la
  // burbuja de "pensando" seguía moviéndose (captura de Martín, 2026-08-25). El motivo
  // es que `trabajando` sale de la BANDEJA, y la bandeja puede estar vieja: cuando una
  // charla de Codex tiene un rollout gigante, `/movil/sesiones` tarda minutos en volver
  // (medido: más de 120 s) y hasta entonces la pantalla sigue creyendo lo de recién.
  // Desde que se para una charla, no se le cree a ningún dato ANTERIOR a ese momento:
  // el estado se vuelve a mirar recién cuando llega uno nuevo (`ts` posterior).
  if (paradoEn[t.sid]){
    if (ses && (ses.ts || 0) * 1000 > paradoEn[t.sid]) delete paradoEn[t.sid];
    else trabajando = false;
  }
  const pensa = ev || trabajando;
  // La pregunta viene también en cada GET: sobrevive recargas y cambio de dispositivo.
  // Hasta elegir Sí o Ahora no, Enviar queda frenado para que Claude no se adelante.
  const silencioActivo = silencioComp[t.sid] > Date.now();
  if (!silencioActivo){
    if (d.pide_compactar) pideCompactar[t.sid] = d.pide_compactar;
    else delete pideCompactar[t.sid];
  }
  const preguntaComp = silencioActivo ? '' : (pideCompactar[t.sid] || '');
  // El reloj cuenta desde tu mensaje si lo mandaste vos; si no, desde lo último que dijo.
  if (!ev) { if (pensa) arranque[t.sid] = (ses && ses.ts ? ses.ts * 1000 : Date.now());
             else delete arranque[t.sid]; }
  hiloVisto[t.sid] = d.mensajes;
  // Tu mensaje ya está en el hilo cuando aparece UNA vez más de las que había al mandarlo.
  const conFoto = (fotosVuelo[t.sid]||[]).length > 0;
  const yaLlego = ev && llegoEco(d.mensajes, ev, conFoto,
                                 vecesVuelo[t.sid], vecesFotosVuelo[t.sid]);
  // ⭐ `data-msg` es el ancla del marcador de texto: una marca se guarda como "en el
  // mensaje 7, de la letra 12 a la 40". Sin este número no habría dónde volver a pintarla
  // después del repintado de cada 3 s (ver `marcas.js`).
  const cuerpo = d.mensajes.length ? d.mensajes.map((m, iM) =>
      // ⭐ La costura de una compactada (2026-08-20): la charla anterior viene cosida
      // arriba y esta rayita es lo único que se ve del corte — el hilo sigue de largo.
      m.de==='marca'
      ? '<div class="marcaHilo" data-msg="' + iM + '">' + esc(m.texto) + '</div>'
      // ⭐ El rastro de lo que va haciendo: un renglón por herramienta. El pensamiento
      // NO se puede mostrar —Claude Code lo tapa en el archivo y en el chorro—, así que
      // esto es lo que hay para seguirlo mientras trabaja. Va apagado y sin burbuja: es
      // el detalle de abajo, no algo que dijo.
      // ⚠ Los pasos seguidos se juntan en UN bloque con fondo: sesenta renglones sueltos
      // sobre la foto de fondo eran una pared ilegible. La apertura y el cierre se
      // agregan mirando al vecino de arriba y al de abajo.
      : m.de==='paso'
      ? ((d.mensajes[iM-1]||{}).de==='paso' ? '' : '<div class="pasos">') +
        '<div class="paso" data-msg="' + iM + '">' + esc(m.texto) + '</div>' +
        ((d.mensajes[iM+1]||{}).de==='paso' ? '' : '</div>')
      : '<div class="msg ' + (m.de==='vos'?'vos':'claude') +
        ((m.imgs||[]).length ? ' con-foto' : '') + '" data-msg="' + iM + '">' +
      fotosHtml(m.imgs) +
      // Lo tuyo va tal cual lo escribiste; lo de Claude, dibujado.
      (m.de==='vos' ? esc(m.texto) : marcar(m.texto)) + '</div>').join('')
    : '<div class="vacio">Sin mensajes todavía. Escribí abajo para empezar.</div>';
  // ⭐ La pregunta de compactar, adentro del hilo y no como cartel del navegador:
  // aparece cuando el turno volvió avisando que la charla pasó el tope.
  const pedirComp = (preguntaComp && !ev && !pensa) ?
      '<div class="pideComp">' + esc(preguntaComp) +
      '<div class="botones"><button onclick="compactar(true)">⇲ Sí, compactar</button>' +
      '<button class="despues" onclick="noCompactar()">Ahora no</button></div></div>' : '';
  // ⭐ ¿La sesión frenó a preguntarte algo con opciones? Viene adentro de /movil/chat
  // (campo `pregunta`, backend `pregunta_de()`): se dibuja el selector en lugar de la
  // burbuja de "pensando". `pregRespondida` la esconde apenas contestás, sin esperar
  // a que el servidor la saque de la lista.
  const preg = (d.pregunta && ((d.pregunta.preguntas || []).length || d.pregunta.plan)) ? d.pregunta : null;
  if (preg && preg.hora !== pregHora){ pregHora = preg.hora; pregElecciones = {}; }
  pregActual = preg;
  const pregVisible = preg && preg.hora !== pregRespondida;
  // ⭐ La lista de tareas de la sesión (TodoWrite): viene adentro de /movil/chat y
  // se dibuja al final del hilo, tildándose en vivo mientras trabaja (2026-08-20).
  const tar = (d.tareas && (d.tareas.lista || []).length) ? d.tareas : null;
  // ⭐ El 🔔 lo enciende el SERVIDOR, no la memoria de este navegador (`avisando` sale
  // de la ficha del trabajo): así sobrevive a un F5 y se ve prendido también en el
  // celular. Va ANTES del corte por `firma`: mientras piensa, el html no cambia y de
  // acá para abajo no se llegaría nunca (2026-08-29).
  ocupadaSes[t.sid] = !!d.ocupada;
  avisandoSes[t.sid] = !!d.avisando;
  pintarAviso();
  const html = (viva ? '<div class="aviso">Esta sesión está abierta en una ventana de Claude Code: ' +
      'acá se puede leer en vivo, pero escribirle la partiría en dos.</div>' : '') +
    '<div id="hilo">' + cuerpo +
    (ev && !yaLlego ? '<div class="msg vos' + (conFoto ? ' con-foto' : '') + '">' + fotosHtml(fotosVuelo[t.sid]) +
      (conFoto && ev === '(imagen)' ? '' : esc(ev)) + '</div>' : '') +
    (tar ? htmlTareas(tar) : '') +
    (pregVisible ? htmlPregunta(preg) :
     pensa ? '<div class="msg claude pensa"><span class="pts"><i></i><i></i><i></i></span>' +
          'pensando<span class="reloj" id="reloj"></span></div>' : pedirComp) + '</div>';
  if (html === firma) return;
  firma = html;
  const c = $('#cuerpo');
  // Lo que ya habías marcado o tipeado en el selector no se puede perder en el
  // repintado de cada 3 s: se captura antes de rearmar el DOM y se devuelve después.
  const pregEstado = guardarPregunta(c);
  // ⭐ Al ABRIR una conversación siempre se cae al final: lo último que se dijo es lo
  // que uno viene a leer. Después, mientras la mirás, el repintado de cada 3 s solo
  // sigue el hilo si YA estabas abajo — si te fuiste a leer algo de más arriba, no te
  // tiene que arrastrar.
  const entrando = recienAbierta;
  const abajo = entrando || c.scrollHeight - c.scrollTop - c.clientHeight < 90;
  c.innerHTML = html;
  restaurarPregunta(c, pregEstado);
  // ⭐ Volviste de otra pantalla del panel: la charla queda en el renglón donde la
  // dejaste, no abajo de todo. ⚠ Con el mismo cuidado que `alFinal`: las imágenes
  // todavía no cargaron y al llegar empujan el hilo, así que se vuelve a poner.
  if (scrollPendiente !== null){
    const donde = scrollPendiente; scrollPendiente = null;
    c.scrollTop = donde;
    c.querySelectorAll('img').forEach(i => {
      if (!i.complete) i.addEventListener('load', () => { c.scrollTop = donde; }, {once:true});
    });
  }
  else if (abajo) alFinal(c);
  // Al ENTRAR a una pestaña la charla aparece con un desvanecido corto en vez de
  // aparecer de golpe. Solo al entrar: hacerlo en cada repintado de 3 s sería un
  // parpadeo permanente mientras leés.
  if (entrando && $('#hilo')) $('#hilo').classList.add('entrando');
  // ⭐ Las marcas se vuelven a pintar DESPUÉS de cada repintado: el hilo se rearma entero
  // cada 3 s, así que nada que esté pegado al DOM sobrevive. Los números están en el
  // servidor (`marcas.js` + `/marcas`), el dibujo se rehace acá.
  if (window.Marcas) Marcas.pintar($('#hilo'), t.sid);
  recienAbierta = false;
  // El botón Parar aparece solo cuando hay algo corriendo que se pueda cortar.
  $('#parar').style.display = pensa ? '' : 'none';
  const bloqueada = viva || !!d.ocupada || !!preguntaComp;
  $('#texto').disabled = bloqueada;
  $('#enviar').disabled = bloqueada;
  $('#texto').placeholder = preguntaComp ? 'Elegí si querés compactar antes de seguir'
    : viva ? 'Esta sesión está abierta en la compu: solo lectura'
    : d.ocupada ? 'Esta sesión está trabajando: esperá a que termine'
    : 'Escribile a esta sesión… (Enter manda)';
}

// --- ⭐ La pregunta con opciones (AskUserQuestion) ------------------------------------
// Pedido de Martín (2026-08-18): cuando la sesión pregunta algo con opciones, botones
// de verdad para tocar, más un campo para contestar con tus palabras — como lo hace
// Claude Code en la terminal. La pregunta llega adentro de `/movil/chat` y la elección
// vuelve por `POST /movil/responder`; el proceso `claude` queda esperando mientras
// tanto (por eso abajo sigue diciendo que está pensando: lo está, esperándote a vos).
let pregActual = null;       // la pregunta que trajo el último /movil/chat
let pregHora = 0;            // para resetear lo elegido cuando llega una pregunta NUEVA
let pregRespondida = 0;      // la hora de la que ya contestaste: se esconde al toque
let pregElecciones = {};     // iQ -> [índices de opción marcados] (multiSelect junta varios)

function htmlPregunta(p){
  // ⭐ El plan de una sesión en plan mode viaja por el mismo canal que la pregunta
  // con opciones (2026-08-20): misma tarjeta, otra decisión (aprobar o seguir).
  if (p.plan) return htmlPlan(p);
  const qs = p.preguntas;
  // Con varias preguntas, o con selección múltiple, hace falta un botón Responder;
  // con UNA pregunta simple, tocar la opción ya es la respuesta (un solo gesto).
  const junto = qs.length > 1 || qs.some(q => q.multi);
  let h = '<div class="pregunta">';
  qs.forEach((q, iQ) => {
    h += '<div class="pBloque">' +
      (q.titulo ? '<div class="pTit">' + esc(q.titulo) + '</div>' : '') +
      '<div class="pPreg">' + esc(q.pregunta) + '</div>' +
      '<div class="pOps">' + q.opciones.map((o, iO) =>
        '<button class="pOp" data-q="' + iQ + '" data-o="' + iO + '"><b>' + esc(o.etiqueta) +
        '</b>' + (o.detalle ? '<span>' + esc(o.detalle) + '</span>' : '') + '</button>'
      ).join('') + '</div>' +
      '<div class="pOtra"><input placeholder="Otra respuesta…" data-q="' + iQ + '">' +
      (junto ? '' : '<button class="pManda" data-q="' + iQ + '">Mandar</button>') +
      '</div></div>';
  });
  if (junto) h += '<button class="pMandar">Responder</button>';
  h += '<div class="pNota">La sesión está esperando esta respuesta para seguir.</div></div>';
  return h;
}

// ⭐ El plan propuesto (plan mode, 2026-08-20): la sesión trabajó solo lectura, armó
// esto y frena a esperarte. Aprobar lo ejecuta ahí mismo (y la saca de plan mode);
// "Seguir planeando" la deja planeando, con lo que escribas como pedido de cambios.
// ⭐ En Codex el plan ES la última respuesta de la charla y ya se lee justo arriba:
// repetirlo entero adentro de la tarjeta sería leer lo mismo dos veces. Por eso ahí la
// tarjeta muestra solo la decisión (2026-08-25).
function htmlPlan(p){
  return '<div class="pregunta plan"><div class="pTit">Plan propuesto</div>' +
    '<div class="pPlan">' + (p.codex ? 'Codex te dejó el plan en la respuesta de acá arriba.'
                                     : marcar(p.plan)) + '</div>' +
    '<div class="pOps">' +
    '<button class="pOp pAprueba"><b>Aprobar y ejecutar</b>' +
    '<span>Sale de plan mode y se pone a hacerlo</span></button>' +
    '<button class="pOp pSigue"><b>Seguir planeando</b>' +
    '<span>No toca nada; podés pedirle cambios abajo</span></button></div>' +
    '<div class="pOtra"><input placeholder="Cambios que le pedís al plan…" data-q="plan"></div>' +
    '<div class="pNota">La sesión está esperando tu decisión para seguir.</div></div>';
}

// ⭐ La lista de tareas de la sesión (TodoWrite, 2026-08-20): el agente se la anota
// solo y la va tildando; acá se dibuja como tarjetita que se actualiza en vivo con
// el repintado de cada 3 s. La fila en curso muestra lo que está haciendo AHORA
// (el gerundio que manda el CLI), las hechas quedan tildadas y apagadas.
function htmlTareas(ts){
  const hechas = ts.lista.filter(t => t.estado === 'completed').length;
  return '<div class="tareas"><div class="tTit">Tareas <span>' + hechas + ' de ' +
    ts.lista.length + '</span></div>' +
    ts.lista.map(t => {
      const e = t.estado === 'completed' ? 'hecha'
              : t.estado === 'in_progress' ? 'haciendo' : '';
      const ico = e === 'hecha' ? '✓' : e === 'haciendo' ? '▸' : '○';
      return '<div class="tFila ' + e + '"><span class="tIco">' + ico + '</span>' +
        esc(e === 'haciendo' && t.activo ? t.activo : t.texto) + '</div>';
    }).join('') + '</div>';
}

async function responderPlan(aprobar, comentario){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || !pregActual || !pregActual.plan) return;
  // Igual que la pregunta: se esconde al toque y vuelve "pensando".
  pregRespondida = pregActual.hora;
  firma = '';
  let r = null;
  try {
    r = await (await fetch('/movil/plan', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cwd: t.cwd,
                            sid: t.sid.startsWith('nueva-') ? '' : t.sid,
                            aprobar: !!aprobar, comentario: comentario || ''})})).json();
  } catch(e){}
  // Aprobado, la sesión ya salió de plan mode: el selector tiene que decirlo.
  if (aprobar && !t.sid.startsWith('nueva-')){ modoDe[t.sid] = ''; pintarModelo(); }
  // ⭐ Codex: el turno que dejó el plan ya terminó, así que no hay a quién contestarle
  // y la decisión viaja como el mensaje siguiente. Lo manda `mandar()` para no
  // duplicar nada de lo que ese camino ya resuelve (ocupada, Parar, hilo en vivo).
  if (r && r.ok && r.mandar){ pintarSesion(); mandar(r.mandar); return; }
  pintarSesion();
}

// El hilo se rearma entero cada 3 s: lo marcado y lo tipeado viven acá afuera y se
// vuelven a poner después de cada repintado (misma familia que las marcas de texto).
function guardarPregunta(c){
  const est = {textos: {}, foco: null};
  c.querySelectorAll('.pregunta .pOtra input').forEach(i => {
    if (i.value) est.textos[i.dataset.q] = i.value;
    if (document.activeElement === i) est.foco = i.dataset.q;
  });
  return est;
}

function restaurarPregunta(c, est){
  c.querySelectorAll('.pregunta .pOp').forEach(b => {
    if ((pregElecciones[b.dataset.q] || []).includes(+b.dataset.o)) b.classList.add('puesta');
  });
  if (!est) return;
  c.querySelectorAll('.pregunta .pOtra input').forEach(i => {
    if (est.textos[i.dataset.q]) i.value = est.textos[i.dataset.q];
    if (est.foco === i.dataset.q){
      i.focus();
      i.setSelectionRange(i.value.length, i.value.length);
    }
  });
}

// Junta lo elegido de todas las preguntas: lo tipeado a mano le gana a los botones
// (si escribiste algo es porque ninguna opción te servía). Devuelve null si falta
// contestar alguna, y avisa cuál en la notita del pie.
function juntarRespuestas(card){
  const rs = {};
  for (let iQ = 0; iQ < pregActual.preguntas.length; iQ++){
    const q = pregActual.preguntas[iQ];
    const inp = card.querySelector('.pOtra input[data-q="' + iQ + '"]');
    const tipeado = inp && inp.value.trim();
    const marcadas = (pregElecciones[iQ] || []).map(iO => q.opciones[iO].etiqueta);
    if (tipeado) rs[q.pregunta] = tipeado;
    else if (marcadas.length) rs[q.pregunta] = marcadas.join(', ');
    else {
      const nota = card.querySelector('.pNota');
      if (nota) nota.textContent = 'Falta contestar: ' + (q.titulo || q.pregunta);
      return null;
    }
  }
  return rs;
}

async function responderPregunta(rs){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || !pregActual) return;
  // Se esconde al toque y se vuelve a la burbuja de "pensando": la respuesta ya salió
  // y dejar los botones a la vista invita a tocar dos veces.
  pregRespondida = pregActual.hora;
  pregElecciones = {};
  firma = '';
  try {
    const r = await (await fetch('/movil/responder', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // Una pestaña sin estrenar manda sid vacío: el servidor guarda ese turno (y su
      // pregunta) bajo la carpeta, igual que /movil/mandar y /movil/parar.
      body: JSON.stringify({cwd: t.cwd,
                            sid: t.sid.startsWith('nueva-') ? '' : t.sid,
                            respuestas: rs})})).json();
    // Si ya no estaba esperando (la contestó otro, o el turno se cortó), no hay nada
    // que rehacer: el repintado siguiente muestra lo que haya.
  } catch(e){}
  pintarSesion();
}

// Un solo escucha delegado para los botones del selector (la lección de marcado.js:
// el hilo se rearma cada 3 s, engancharlos uno por uno obligaría a re-engancharlos).
document.getElementById('cuerpo').addEventListener('click', e => {
  if (!pregActual) return;
  const card = e.target.closest && e.target.closest('.pregunta');
  if (!card) return;
  // La tarjeta del plan tiene sus dos botones propios y ninguna opción numerada.
  if (pregActual.plan){
    if (e.target.closest('.pAprueba')) responderPlan(true);
    else if (e.target.closest('.pSigue')){
      const inp = card.querySelector('.pOtra input');
      responderPlan(false, inp && inp.value.trim());
    }
    return;
  }
  const op = e.target.closest('.pOp');
  if (op){
    const iQ = +op.dataset.q, iO = +op.dataset.o;
    const q = pregActual.preguntas[iQ];
    if (q.multi){
      const el = pregElecciones[iQ] || (pregElecciones[iQ] = []);
      const ya = el.indexOf(iO);
      if (ya >= 0) el.splice(ya, 1); else el.push(iO);
      op.classList.toggle('puesta');
    } else if (pregActual.preguntas.length === 1){
      responderPregunta({[q.pregunta]: q.opciones[iO].etiqueta});
    } else {
      pregElecciones[iQ] = [iO];
      card.querySelectorAll('.pOp[data-q="' + iQ + '"]').forEach(b =>
        b.classList.toggle('puesta', b === op));
    }
    return;
  }
  const manda = e.target.closest('.pManda');     // "Mandar" del texto libre (una pregunta)
  if (manda){
    const inp = card.querySelector('.pOtra input[data-q="' + manda.dataset.q + '"]');
    const texto = inp && inp.value.trim();
    if (texto) responderPregunta({[pregActual.preguntas[+manda.dataset.q].pregunta]: texto});
    return;
  }
  if (e.target.closest('.pMandar')){             // "Responder" de las preguntas juntas
    const rs = juntarRespuestas(card);
    if (rs) responderPregunta(rs);
  }
});

// Enter adentro de "Otra respuesta…" manda, como en la caja de abajo.
document.getElementById('cuerpo').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !pregActual) return;
  const inp = e.target.closest && e.target.closest('.pregunta .pOtra input');
  if (!inp) return;
  e.preventDefault();
  // En la tarjeta del plan, Enter con texto es "seguí planeando con estos cambios".
  if (pregActual.plan){
    const texto = inp.value.trim();
    if (texto) responderPlan(false, texto);
    return;
  }
  const card = inp.closest('.pregunta');
  if (pregActual.preguntas.length === 1){
    const texto = inp.value.trim();
    if (texto) responderPregunta({[pregActual.preguntas[0].pregunta]: texto});
  } else {
    const rs = juntarRespuestas(card);
    if (rs) responderPregunta(rs);
  }
});

// ⏹ Cortar el turno que está pensando. Mata el proceso `claude` de ese turno: lo que
// ya escribió queda escrito, la conversación no se rompe y podés escribirle de nuevo.
// No es un error, así que NO deja la marca roja (pedido de Martín, 2026-08-17).
// --- El modelo de esta sesión y compactarla ----------------------------------
// ⭐ Pedido de Martín el 2026-08-18, después de encontrar de dónde salía el drenaje de
// tokens: su configuración global tenía el modelo en `opus[1m]` (ventana de un millón),
// así que ninguna charla se compactaba nunca y cada comando releía la conversación
// entera. Ahora cada sesión elige con qué corre, y se puede compactar a mano.
// ⚠ El modelo vive en el SERVIDOR (no en el localStorage): lo usa quien lanza el
// proceso `claude`, no la pantalla, y así elegirlo en la compu vale también en el
// celular. Acá solo se guarda lo último que contestó, para no preguntar cada 3 s.
let modelos = [], modeloDe = {}, modeloPedido = '';
let esfuerzos = [], esfuerzoDe = {};
let velocidades = [], velocidadDe = {};
// ⭐ Plan mode (2026-08-20): la perilla vive en el servidor, como el modelo.
let modos = [], modoDe = {};

let contextoDe = {};

async function refrescarModelo(){
  const t = abiertas.find(x => x.sid === activa);
  const sel = $('#modelo'), selE = $('#esfuerzo'), selV = $('#velocidad'), bot = $('#compactar');
  const real = t && !t.sid.startsWith('nueva-') ? t.sid : '';
  // ⭐ El selector de cerebro (Claude/Codex) se ve SIEMPRE que haya carpeta: en una
  // charla sin estrenar elige con cuál nace, y en una nacida cambiarlo la MUDA al
  // otro CLI (resumen + sesión nueva). Compactar y Plan siguen siendo de Claude;
  // Modelo y Esfuerzo existen en los dos, y Velocidad solamente en Codex.
  const selC = $('#cerebro'), codex = t && t.cerebro === 'codex';
  if (selC){
    selC.style.display = (t && t.cwd) ? '' : 'none';
    if (t) selC.value = t.cerebro === 'auto' ? 'auto' : (codex ? 'codex' : '');
  }
  // Una charla sin estrenar no tiene nada que compactar ni un id donde guardar el
  // modelo: el turno lo va a arrancar igual con el de fábrica.
  if (bot) bot.style.display = (real && !codex) ? '' : 'none';
  if (!sel || !t) return;
  const pedido = (real || t.sid) + ':' + (codex ? 'codex' : 'claude') + ':' + (t.modelo || '');
  if (modeloPedido === pedido) { pintarModelo(); return; }
  modeloPedido = pedido;
  try {
    const r = await (await fetch('/movil/modelo?sid=' + encodeURIComponent(real) +
                                 '&cwd=' + encodeURIComponent(t.cwd || '') +
                                 '&cerebro=' + (codex ? 'codex' : '') +
                                 '&modelo=' + encodeURIComponent(t.modelo || ''))).json();
    if (r.ok){
      const clave = real || t.sid;
      modelos = r.modelos || []; modeloDe[clave] = real ? r.modelo : (t.modelo || r.modelo);
      esfuerzos = r.esfuerzos || [];
      esfuerzoDe[clave] = real ? (r.esfuerzo || '') : (t.esfuerzo || r.esfuerzo || '');
      velocidades = r.velocidades || [];
      velocidadDe[clave] = real ? (r.velocidad || '') : (t.velocidad || r.velocidad || '');
      if (real){ t.modelo=r.modelo; t.esfuerzo=r.esfuerzo||''; t.velocidad=r.velocidad||''; }
      modos = r.modos || []; modoDe[real] = r.modo || '';
      if (r.contexto) contextoDe[real] = r.contexto;
      pintarModelo();
    }
  } catch(e){}
}

function pintarModelo(){
  const t = abiertas.find(x => x.sid === activa), sel = $('#modelo'), selE = $('#esfuerzo'), selV = $('#velocidad');
  if (!sel) return;
  const grupo = $('#ajustesModelo');
  // ⚠ Vacío no se muestra: hasta que el servidor conteste la lista, un <select> sin
  // opciones es una caja en blanco al lado de Enviar (se vio así el 2026-08-18,
  // porque el panel todavía no tenía el endpoint nuevo).
  sel.style.display = (t && modelos.length) ? '' : 'none';
  if (!t){ if (grupo) grupo.style.display = 'none'; return; }
  const real = t.sid.startsWith('nueva-') ? '' : t.sid;
  if (modelos.length){
    const clave = real || t.sid;
    const puesto = t.modelo || modeloDe[clave] || modelos[0].id;
    const html = modelos.map(m => '<option value="' + m.id + '"' +
          (m.id === puesto ? ' selected' : '') + '>' + esc(m.nombre) + '</option>').join('');
    if (sel.innerHTML !== html) sel.innerHTML = html;
    sel.value = puesto;
    sel.classList.toggle('puesto', puesto !== (modelos[0] || {}).id);
  }
  if (selE){
    const clave = real || t.sid;
    const puestoE = t.esfuerzo || esfuerzoDe[clave] || '';
    const htmlE = esfuerzos.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoE ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selE.innerHTML !== htmlE) selE.innerHTML = htmlE;
    selE.style.display = esfuerzos.length ? '' : 'none';
    selE.value = puestoE;
    selE.classList.toggle('puesto', !!puestoE);
  }
  if (selV){
    const clave = real || t.sid;
    const puestoV = t.velocidad || velocidadDe[clave] || '';
    const htmlV = velocidades.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoV ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selV.innerHTML !== htmlV) selV.innerHTML = htmlV;
    selV.style.display = (t.cerebro === 'codex' && velocidades.length) ? '' : 'none';
    selV.value = puestoV;
    selV.classList.toggle('puesto', !!puestoV);
  }
  // ⭐ Plan mode: solo en charlas de Claude ya nacidas (el servidor guarda la perilla
  // por id). Pintado cuando está en "Plan primero", que es lo que hay que notar.
  const selM = $('#modo');
  if (selM){
    const puestoM = modoDe[real] || '';
    const htmlM = modos.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoM ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selM.innerHTML !== htmlM) selM.innerHTML = htmlM;
    selM.style.display = (t.cerebro !== 'codex' && real && modos.length) ? '' : 'none';
    selM.value = puestoM;
    selM.classList.toggle('puesto', !!puestoM);
  }
  pintarBotonAjustes();
  pintarContexto();
}

// ⭐ Un solo botón para TODO lo de esta charla (2026-08-25, "sería mejor que se compacten
// por categoría"): el cerebro y las acciones —Compactar, Revisar— entraron acá adentro,
// donde ya vivían modelo, esfuerzo, velocidad y modo. Antes eran cinco botones sueltos
// que empujaban la caja de escribir hasta dejarla en una rendija con el zoom puesto.
function pintarBotonAjustes(){
  const grupo = $('#ajustesModelo'), bot = $('#ajustesModeloBoton');
  if (!grupo || !bot) return;
  const todos = [$('#cerebro'), $('#modelo'), $('#esfuerzo'), $('#velocidad'), $('#modo')]
        .filter(Boolean);
  todos.forEach(s => { const label = s.closest('label'); if (label) label.style.display = s.style.display === 'none' ? 'none' : ''; });
  const activos = todos
        .filter(s => s && s.style.display !== 'none' && s.options.length);
  // La línea de acciones se esconde entera cuando no queda ninguna: una charla sin
  // estrenar no tiene nada que compactar.
  const acciones = [$('#compactar'), $('#revisar')].filter(Boolean);
  const hayAccion = acciones.some(b => b.style.display !== 'none');
  const fila = $('#menuAcciones');
  if (fila) fila.classList.toggle('vacio', !hayAccion);
  grupo.style.display = (activos.length || hayAccion) ? '' : 'none';
  if (!activos.length && !hayAccion){
    grupo.classList.remove('abierto'); bot.setAttribute('aria-expanded','false'); return;
  }
  const corto = txt => txt.replace(/^(Esfuerzo|Modo|Velocidad)\s+/i, '').trim();
  // ⚠ En el rótulo van solo las DOS primeras (cerebro y modelo): con las cinco, el
  // botón se pasaba de su tope de 250 px y quedaba cortado con puntos suspensivos,
  // que es peor que no mostrarlas. Lo demás se ve al abrirlo, y si algo está fuera
  // de fábrica el botón se pinta igual.
  const rotulo = activos.map(s => corto(s.selectedOptions[0]?.textContent || ''))
                        .filter(Boolean).slice(0, 2).join(' · ');
  bot.textContent = '⚙ ' + (rotulo || 'Ajustes');
  bot.classList.toggle('puesto', activos.some(s => s.classList.contains('puesto')));
}

$('#ajustesModeloBoton').addEventListener('click', e => {
  e.stopPropagation();
  const grupo = $('#ajustesModelo'), abierto = !grupo.classList.contains('abierto');
  grupo.classList.toggle('abierto', abierto);

});
// El menú no se cierra al tocar una perilla (podés cambiar dos seguidas). Sí se cierra
// con las acciones marcadas `data-cierra`, que son las que terminan en el hilo.
// ⚠ Compactar NO la lleva a propósito: pregunta primero y se confirma con un SEGUNDO

$('#ajustesModeloMenu').addEventListener('click', e => {

document.addEventListener('click', () => {

// ⭐ El aviso de cuánto arrastra esta charla (pedido de Martín, 2026-08-18). Lo que se
// muestra NO es lo que gastó en total: es lo que se relee en CADA mensaje, que es lo
// que se paga de nuevo con cada comando y cada archivo que abre. Va pegado al botón
// Compactar porque es justo la respuesta a "¿y qué hago con esto?".
// ⚠ El color fuerte es solo para el nivel alto: el naranja de "va cargada" es un
// aviso, no un error — el rojo acá es para lo que está mal (regla de Martín).
function pintarContexto(){
  const t = abiertas.find(x => x.sid === activa), chip = $('#contexto');
  if (!chip) return;
  const c = t ? contextoDe[t.sid] : null;
  if (!c || !c.tokens){ chip.style.display = 'none'; return; }
  chip.style.display = '';
  chip.className = 'ctx ' + (c.nivel || 'bien');
  const mil = c.tokens >= 1000000 ? (c.tokens/1000000).toFixed(1).replace('.', ',') + ' M'
                                  : Math.round(c.tokens/1000) + ' k';
  chip.textContent = mil;
  chip.title = c.aviso || ('Esta charla arrastra ' + mil + ' de contexto en cada mensaje.');
  // El botón Compactar se enciende cuando de verdad conviene: si está siempre igual,
  // deja de querer decir algo.
  const bot = $('#compactar');
  if (bot) bot.classList.toggle('conviene', c.nivel === 'mucho');
}

// El cerebro elegido queda EN LA PESTAÑA (t.cerebro) hasta el primer mensaje, que es
// el que hace nacer la charla en ese CLI. En una charla ya NACIDA, cambiarlo la muda
// al otro cerebro (2026-08-20): se la resume y sigue en una sesión nueva del otro
// lado, igual que compactar pero aterrizando enfrente.
$('#cerebro').addEventListener('change', async e => {
  const t = abiertas.find(x => x.sid === activa);
  if (!t){ pintarModelo(); return; }
  if (!t.sid.startsWith('nueva-') && e.target.value === 'auto'){
    alert('Auto se elige al empezar una conversación nueva.'); refrescarModelo(); return;
  }
  const aCodex = e.target.value === 'codex';
  if (t.sid.startsWith('nueva-')){
    t.cerebro = e.target.value === 'auto' ? 'auto' : (aCodex ? 'codex' : '');
    modeloPedido = '';
    firma = ''; guardar(); pintarTabs(); refrescarModelo();
    return;
  }
  if ((t.cerebro === 'codex') === aCodex || enVuelo[t.sid]){ refrescarModelo(); return; }
  const para = aCodex ? 'Codex' : 'Claude';
  if (!confirm('¿Pasar esta charla a ' + para + '? La resume y sigue en una nueva de '
               + para + ' con ese resumen. Tarda un rato.')){ refrescarModelo(); return; }
  const viejo = t.sid;
  enVuelo[viejo] = 'mudando la charla a ' + para; arranque[viejo] = Date.now();
  firma = ''; pintarSesion(); pintarTabs();
  try {
    const r = await (await fetch('/movil/mudar_cerebro', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sid: viejo, cwd: t.cwd})})).json();
    if (r.ok && r.sid){
      // La pestaña se muda a la charla nueva; la vieja queda entera en la bandeja.
      t.sid = r.sid; t.cerebro = r.cerebro === 'codex' ? 'codex' : '';
      if (activa === viejo) activa = r.sid;
      modeloPedido = '';
      fijarDireccion({empujar: false}); guardar();
      if (r.aviso) alert(r.aviso);
    } else alert(r.error || 'No pude mudarla.');
  } catch(err){ alert('No pude mudarla: ' + err); }
  delete enVuelo[viejo]; delete arranque[viejo];
  firma = ''; pintarTabs(); pintarSesion(); cargar(); refrescarModelo();
});

$('#modelo').addEventListener('change', async e => {
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  if (t.sid.startsWith('nueva-')){
    t.modelo = e.target.value; modeloDe[t.sid] = t.modelo;
    modeloPedido = ''; guardar(); refrescarModelo(); return;
  }
  const r = await (await fetch('/movil/modelo', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sid: t.sid, modelo: e.target.value})})).json();
  if (r.ok){ modeloDe[t.sid] = r.modelo; t.modelo = r.modelo; modeloPedido = ''; guardar(); refrescarModelo(); }
});

$('#velocidad').addEventListener('change', async e => {

$('#esfuerzo').addEventListener('change', async e => {
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  if (t.sid.startsWith('nueva-')){
    t.esfuerzo = e.target.value;
    esfuerzoDe[t.sid] = t.esfuerzo;

  }
  const r = await (await fetch('/movil/esfuerzo', {method:'POST',

// ⭐ Plan mode: vale desde el turno siguiente (el proceso se relanza con --resume).
$('#modo').addEventListener('change', async e => {
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  if (t.sid.startsWith('nueva-')){
    alert('Mandá un mensaje primero: la conversación todavía no existe.');
    pintarModelo(); return;
  }
  const r = await (await fetch('/movil/modo', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sid: t.sid, modo: e.target.value})})).json();
  if (r.ok){ modoDe[t.sid] = r.modo; pintarModelo(); }
  else { alert(r.error || 'No pude cambiar el modo.'); pintarModelo(); }
});

// "Ahora no" a la pregunta de compactar: se calla media hora para esta charla.
function noCompactar(){
  silencioComp[activa] = Date.now() + 30 * 60000;
  delete pideCompactar[activa];
  firma = ''; pintarSesion();
}

// ⚠ Dos toques, como el ▶ de los bloques de código: compactar cuesta dos turnos (el
// primero lee la charla entera) y deja la pestaña en una sesión NUEVA. Un clic de más
// no puede alcanzar. Se cae solo a los 5 s. Con `directo` (el "Sí" de la pregunta que
// hace el servidor al pasar el tope) no hay segundo toque: la pregunta ya se contestó.
let compactarPide = 0;
async function compactar(directo){
  const t = abiertas.find(x => x.sid === activa);
  const b = $('#compactar');
  if (!t || t.sid.startsWith('nueva-') || enVuelo[t.sid]) return;
  if (directo !== true && Date.now() > compactarPide){
    compactarPide = Date.now() + 5000;
    b.classList.add('pide'); b.textContent = '⇲ ¿compacto?';
    setTimeout(() => { if (Date.now() > compactarPide){
      b.classList.remove('pide'); b.textContent = '⇲ Compactar'; } }, 5100);
    return;
  }
  compactarPide = 0;
  b.classList.remove('pide'); b.disabled = true; b.textContent = '⇲ resumiendo…';
  const viejo = t.sid;
  enVuelo[viejo] = 'compactando la charla'; arranque[viejo] = Date.now();
  firma=''; pintarSesion(); pintarTabs();
  try {
    const r = await (await fetch('/movil/compactar', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sid: viejo, cwd: t.cwd})})).json();
    if (r.ok && r.sid){
      // La pestaña se muda a la sesión nueva. La vieja NO se cierra ni se borra:
      // sigue en la bandeja, entera, por si hay que volver a mirarla. En el hilo no
      // se nota el corte: la conversación viene cosida del servidor (2026-08-20).
      delete pideCompactar[viejo]; delete pideCompactar[r.sid];
      t.sid = r.sid; if (activa === viejo) activa = r.sid;
      modeloPedido = '';
      fijarDireccion({empujar: false});
      guardar();
    } else {
      alert(r.error || 'No pude compactarla.');
    }
  } catch(e){ alert('No pude compactarla: ' + e); }
  delete enVuelo[viejo]; delete arranque[viejo];
  b.disabled = false; b.textContent = '⇲ Compactar';
  firma=''; pintarTabs(); pintarSesion(); cargar(); refrescarModelo();
}

// Cuándo se cortó cada charla desde acá. Mientras la bandeja no traiga algo POSTERIOR,
// esta pantalla no vuelve a decir que esa charla está pensando (ver `pintarSesion`).
let paradoEn = {};

async function parar(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  const b = $('#parar');
  b.disabled = true; b.textContent = 'parando…';
  parados[t.sid] = true;
  paradoEn[t.sid] = Date.now();
  try {
    const r = await (await fetch('/movil/parar', {method:'POST',
          headers:{'Content-Type':'application/json'},
          // Una pestaña recién abierta todavía no tiene sid de verdad: el servidor
          // guarda ese turno bajo la carpeta, igual que al mandarlo.
          body: JSON.stringify({sid: t.sid.startsWith('nueva-') ? '' : t.sid,
                                cwd: t.cwd})})).json();
    if (!r.paro) alert('Ya había terminado: no quedaba nada corriendo.');
  } catch(e){ alert('No pude pararlo: ' + e); }
  b.disabled = false; b.textContent = '⏹ Parar';
  delete enVuelo[t.sid]; delete arranque[t.sid];
  firma=''; pintarTabs(); pintarSesion(); cargar();
}

async function renombrar(sid, actual){
  const n = prompt('¿Cómo querés que se llame esta sesión?', actual);
  if (n === null) return;
  await fetch('/movil/nombre', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sid, nombre: n.trim()})});

  if (t && n.trim()) t.nombre = n.trim();
