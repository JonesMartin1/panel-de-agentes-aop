// --- Imágenes: las que quieras, por el clip o pegando con Ctrl+V --------------
let fotos = [];

function pintarChapas(){
  const c = $('#chapas');
  c.classList.toggle('hay', fotos.length > 0);
  c.innerHTML = fotos.map((f,i) =>
    '<div class="chapa"><img src="' + URL.createObjectURL(f) + '">' +
    '<div class="x" data-i="' + i + '">✕</div></div>').join('');
  c.querySelectorAll('.x').forEach(x =>
    x.onclick = () => { fotos.splice(+x.dataset.i, 1); pintarChapas(); });
}

function sumarFotos(lista){
  for (const f of lista) if (f && f.type.startsWith('image/')) fotos.push(f);
  pintarChapas();
}

$('#archivo').addEventListener('change', e => { sumarFotos(e.target.files); e.target.value=''; });

async function buscarArchivo(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || !t.cwd){ alert('Abrí una charla dentro de una carpeta primero.'); return; }
  try {
    const r = await (await fetch('/movil/elegir_archivo?cwd=' + encodeURIComponent(t.cwd),
                                 {method:'POST'})).json();
    if (!r.ok){ if (!r.cancelado) alert(r.error || 'No pude abrir el buscador de archivos.'); return; }
    const c = $('#texto'), ruta = r.ruta || '';
    const ini = c.selectionStart ?? c.value.length, fin = c.selectionEnd ?? ini;
    const antes = c.value.slice(0, ini), despues = c.value.slice(fin);
    const separaAntes = antes && !/\s$/.test(antes) ? ' ' : '';
    const separaDespues = despues && !/^\s/.test(despues) ? ' ' : '';
    const pegado = '`' + ruta + '`';
    c.value = antes + separaAntes + pegado + separaDespues + despues;
    const pos = antes.length + separaAntes.length + pegado.length;
    c.setSelectionRange(pos, pos); c.dispatchEvent(new Event('input')); c.focus();
  } catch(e){ alert('No pude abrir el buscador de archivos. Reiniciá el panel y probá de nuevo.'); }
}
// Pegar una captura es lo natural en la compu: el listener va en toda la página,
// no en el campo, así uno pega apenas recorta sin tener que hacer clic antes.
document.addEventListener('paste', e => {
  if (!activa) return;
  const im = [...(e.clipboardData?.items || [])]
    .filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (im.length){ e.preventDefault(); sumarFotos(im); }
});

// ⭐⭐ Una charla NUEVA cambia de id UNA sola vez en su vida: nace como `nueva-…` acá en
// la pantalla y a los pocos segundos el CLI le da el de verdad. Mudar la pestaña a ese id
// es lo que la engancha con la conversación real: el hilo en vivo, el botón Parar y la
// dirección web. Antes esto pasaba recién cuando el turno ENTERO terminaba, y hasta ahí
// la pantalla mostraba "Sin mensajes todavía" con la burbuja de pensando — 7 minutos
// mirando una charla vacía que estaba trabajando (captura de Martín, 2026-08-23). Ahora
// se llama dos veces: apenas el servidor publica el id, y de nuevo al cerrar el turno.
function mudarPestana(t, clave, sidNuevo){
  if (!sidNuevo || sidNuevo === clave) return clave;
  // ⭐⭐ ¿Seguís parado en esta charla? Se pregunta ANTES de tocar nada, con el id viejo
  // todavía puesto. Antes esto hacía `activa = r.sid` a secas y el resultado era el que
  // Martín reportó el 2026-08-23: mandabas el primer mensaje de una charla nueva, te ibas
  // a otra pestaña mientras pensaba, y al llegar la respuesta la pantalla te arrastraba
  // de vuelta sola. Lo mismo ya se hacía bien al compactar y al mudar de cerebro: la
  // pestaña se muda, vos no.
  const seguisAca = activa === clave;
  for (const caja of [enVuelo, arranque, vecesVuelo, fotosVuelo, vecesFotosVuelo,
                      hiloVisto, parados]){
    if (Object.prototype.hasOwnProperty.call(caja, clave)){
      caja[sidNuevo] = caja[clave]; delete caja[clave];
    }
  }
  t.sid = sidNuevo;
  if (seguisAca) activa = sidNuevo;
  // Recién ahora esta charla existe de verdad y tiene id propio: ahí gana su dirección.
  // Va REEMPLAZANDO, no empujando: la entrada anterior del historial es la misma pantalla
  // con un id provisorio que ya no significa nada. ⚠ Solo si seguís acá: si te fuiste, la
  // barra de direcciones es de la pantalla que estás mirando ahora y no se le toca.
  if (seguisAca) fijarDireccion({empujar: false});
  guardar(); pintarTabs();
  firma = '';                       // el hilo se repinta contra la charla de verdad
  return sidNuevo;
}

// Con qué cerebro y perillas quedó la charla después del turno (una nueva las estrena acá).
function aplicarPerillas(t, r){
  if (r.cerebro) t.cerebro = r.cerebro === 'codex' ? 'codex' : '';
  if (Object.prototype.hasOwnProperty.call(r,'modelo')) t.modelo = r.modelo;
  if (Object.prototype.hasOwnProperty.call(r,'esfuerzo')) t.esfuerzo = r.esfuerzo;
  if (Object.prototype.hasOwnProperty.call(r,'velocidad')) t.velocidad = r.velocidad;
}

// ⭐ Lo que no se pudo mandar NO SE PIERDE (2026-08-23). Vuelve a ser el borrador de esa
// conversación, y si seguís parado ahí y no escribiste otra cosa mientras tanto, vuelve
// también a la caja con sus fotos. Antes se borraba apenas apretabas Enviar y, si el
// servidor lo rebotaba —"esa sesión está contestando algo"—, había que escribirlo de nuevo.
function devolverLoEscrito(sid, texto, fotosGuardadas){
  fotosGuardadas = fotosGuardadas || [];
  if (!texto && !fotosGuardadas.length) return;
  if (texto) anotarBorrador(sid, texto);
  if (activa !== sid) return;
  const caja = $('#texto');
  if (texto && caja && !caja.value.trim()){
    caja.value = texto;
    caja.dispatchEvent(new Event('input'));    // le devuelve el alto que tenía
  }
  if (fotosGuardadas.length && !fotos.length){ fotos = fotosGuardadas; pintarChapas(); }
}

/* ⭐ Revisar el código (2026-08-25). Va como un mensaje MÁS de la charla abierta, no
   como un proceso aparte: el hilo que ves se dibuja de los archivos del propio CLI,
   así que lo que no es un turno de verdad no puede aparecer ahí. Y de paso queda
   donde sirve — podés seguir con "arreglá el segundo" sin cambiar de pantalla.
   Cada cerebro con lo suyo: Claude tiene la skill /code-review; Codex no la tiene
   (su `codex review` es un comando de afuera), así que se le pide en criollo. */
const PEDIDO_REVISION = {
  claude: '/code-review',
  codex: 'Revisá los cambios que todavía no commiteé en este proyecto (mirá el git ' +
         'status y el git diff, incluido lo que está en staged y lo que no se agregó ' +
         'todavía) y decime qué está mal. Primero los errores de verdad, después lo ' +
         'que se pueda simplificar. No arregles nada todavía: quiero leer la lista.'
};

function revisarCodigo(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  if (t.sid.startsWith('nueva-')){
    alert('Abrí o empezá una charla en ese proyecto y después pedile la revisión.');
    return;
  }
  mandar(t.cerebro === 'codex' ? PEDIDO_REVISION.codex : PEDIDO_REVISION.claude);
}

// ⭐ Avisame al celular cuando termine. Vale para UN mensaje: se apaga al mandarlo,
// así no te llena el celular sin que lo pidas.
// ⭐⭐ Y desde el 2026-08-29 sirve TAMBIÉN con el turno ya corriendo, que es cuando de
// verdad lo necesitás: te das cuenta de que la cosa viene larga MIENTRAS piensa, no
// antes de mandar. Antes, apretarlo ahí no hacía nada para ese turno y encima quedaba
// armado en silencio para el mensaje siguiente. Quién manda es el SERVIDOR: él sabe si
// hay un turno vivo al que colgarle el aviso, y la pantalla no adivina.
let avisarTarea = false;
let avisandoSes = {}, ocupadaSes = {};

function pintarAviso(){
  const b = $('#avisarTarea');
  if (!b) return;
  const enCurso = !!avisandoSes[activa];
  b.classList.toggle('sel', avisarTarea || enCurso);
  b.title = enCurso ? 'Te aviso al celular cuando termine este turno (tocá para cancelar)'
    : avisarTarea ? 'Te aviso al celular cuando termine el mensaje que mandes'
    : 'Avisarme al celular cuando termine';
}

async function alternarAviso(){
  const t = abiertas.find(x => x.sid === activa);
  const sid = (t && !t.sid.startsWith('nueva-')) ? t.sid : '';
  const quiero = !(avisarTarea || avisandoSes[activa]);
  let r = null, panelViejo = false;
  if (sid){
    try {
      const resp = await fetch('/movil/avisar', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({sid, quiero})});
      panelViejo = (resp.status === 404);   // el panel corre con el módulo de antes
      r = await resp.json();
    } catch(e){}
  }
  if (r && r.ok && r.enganchado){
    // Enganchado al turno que está corriendo: el botón queda encendido hasta que
    // termine (el estado lo repone el servidor en cada refresco).
    avisandoSes[activa] = quiero;
    avisarTarea = false;
    pintarAviso();
    return;
  }
  if (r && r.ok && r.motivo === 'recien_termino'){
    // La regla es que el aviso no se pierda en silencio: si apretaste justo cuando
    // terminaba, el servidor lo manda igual y acá se dice.
    avisandoSes[activa] = false; avisarTarea = false; pintarAviso();
    alert('Ya había terminado: te mandé el aviso igual.');
    return;
  }
  // No hay ningún turno vivo al que engancharlo: vale para el mensaje que mandes.
  avisarTarea = quiero;
  avisandoSes[activa] = false;
  pintarAviso();
  if (quiero && panelViejo){
    alert('Reiniciá el panel: esta versión todavía no sabe enganchar el aviso a un turno '
        + 'que ya está corriendo. Por ahora queda pedido para el mensaje que mandes vos.');
  } else if (quiero && ocupadaSes[activa]){
    alert('Esa charla está trabajando, pero el turno no lo largó esta pantalla, así que '
        + 'no puedo engancharle el aviso. Queda pedido para el mensaje que mandes vos.');
  }
}

// `forzado` es un mensaje que manda la pantalla sola, sin pasar por la caja de
// escribir: hoy lo usa la decisión del plan de Codex. Se comprueba que sea texto y no
// un evento, porque a `mandar` también la llaman desde un onclick y desde el Enter.
async function mandar(forzado){
  const impuesto = (typeof forzado === 'string' && forzado.trim()) ? forzado.trim() : '';
  const t = abiertas.find(x => x.sid === activa);
  const txt = impuesto || $('#texto').value.trim();
  const ses = datos.proyectos.flatMap(x => x.sesiones).find(s => s.id === t?.sid);
  if (!t || (!txt && !fotos.length) || enVuelo[t.sid] || ses?.ocupada) return;
  // Mandaste un mensaje: lo que querés ver es la charla, no el archivo que estabas
  // mirando. Se cierra solo (si no, la pantalla volvía al archivo en el próximo
  // repintado y tu mensaje desaparecía de la vista).
  if (verArchivo){ verArchivo = null; arb.sel = ''; pintarArbol(); }
  // Un mensaje impuesto no vacía la caja: lo que tenías a medio escribir sigue ahí.
  if (!impuesto){
    $('#texto').value = '';
    ajustarCaja();
    // Lo mandaste: el borrador de esta conversación ya no existe. Se avisa igual aunque el
    // propio `/movil/mandar` lo borre del lado del servidor — así la chapa se apaga en el
    // acto y no dentro de veinte segundos, cuando vuelva la lista.
    anotarBorrador(t.sid, '');
    soltarBorrador();
  }
  let clave = t.sid;
  // Las chapitas se limpian para dejar la caja lista, pero su miniatura sigue viva en
  // el eco hasta que el servidor devuelve la foto real. Si no se guarda acá, durante el
  // envío solo quedaba el cartel feo "(imagen)".
  // Las fotos que tengas puestas son para TU mensaje, no para uno impuesto: la
  // decisión del plan no se lleva puesta la captura que estabas por mandar.
  const fotosParaEnviar = impuesto ? [] : fotos;
  if (!impuesto){ fotos = []; pintarChapas(); }
  if (fotosParaEnviar.length){
    fotosVuelo[clave] = fotosParaEnviar.map(foto => URL.createObjectURL(foto));
    vecesFotosVuelo[clave] = cuentaFotos(hiloVisto[clave]);
  }
  // Le mandaste algo nuevo: lo que hayas cortado antes ya no cuenta.
  delete paradoEn[clave];
  enVuelo[clave] = txt || '(imagen)'; arranque[clave] = Date.now();
  vecesVuelo[clave] = cuentaTuya(hiloVisto[clave], txt);
  firma=''; pintarSesion(); pintarTabs();
  const f = new FormData();
  f.append('cwd', t.cwd);
  f.append('sid', clave.startsWith('nueva-') ? '' : clave);
  // Con qué cerebro nace una charla NUEVA (con id, el servidor lo deduce solo).
  f.append('cerebro', t.cerebro || '');
  f.append('modelo', t.modelo || modeloDe[t.sid] || '');
  f.append('esfuerzo', t.esfuerzo || esfuerzoDe[t.sid] || '');
  f.append('velocidad', t.velocidad || velocidadDe[t.sid] || '');
  f.append('texto', txt);
  // ⭐ El turno corre en el servidor y acá solo se pregunta cómo viene (2026-08-21).
  // Antes el pedido quedaba abierto hasta que Claude terminaba: un turno largo (un
  // deploy, una revisión) se colgaba de esa conexión y si el navegador la soltaba
  // aparecía "falló · Se cortó: Failed to fetch" con el trabajo andando perfecto.
  // ⭐ Las charlas SIN estrenar también van por acá desde el 2026-08-23. Antes iban por
  // el camino directo "porque necesitábamos su id de verdad en la misma respuesta": ese
  // era justamente el problema — el id llegaba al FINAL del primer turno y hasta entonces
  // la pestaña no tenía a qué conversación mirar. Ahora el servidor lo publica en la
  // ficha del trabajo apenas nace y la pestaña se muda en el acto (ver `mudarPestana`).
  f.append('segundo_plano', '1');
  // El aviso se pide para ESTE mensaje. ⭐ Las charlas sin estrenar también, desde el
  // 2026-08-29: se las excluía "porque recién nacida no hay a qué charla nombrar en el
  // aviso", y eso no era cierto — el aviso se arma al TERMINAR, con el id que la charla
  // ya ganó. Con la exclusión el botón quedaba encendido y no avisaba nunca: la misma
  // mentira que se vino a arreglar. Y el primer turno de una charla nueva suele ser
  // justo el largo.
  if (avisarTarea){
    f.append('avisar', '1');
    avisarTarea = false;
    pintarAviso();
  }
  for (const foto of fotosParaEnviar) f.append('imagenes', foto, foto.name || 'captura.png');
  try {
    let r = await (await fetch('/movil/mandar', {method:'POST', body:f})).json();
    if (r.segundo_plano && r.trabajo){
      // El POST ya terminó: desde acá solo se mira una ficha chica. Si una consulta
      // falla (se durmió la máquina, cambió la red), se reintenta: el turno no depende
      // de esta conexión.
      while (true){
        await new Promise(ok => setTimeout(ok, 1200));
        try {
          const e = await (await fetch('/movil/trabajo/' + r.trabajo)).json();
          if (!e.ok){ r = e; break; }
          // ⭐ La charla nueva ya tiene su id: la pestaña se muda AHORA, en plena
          // pensada, y el hilo empieza a mostrar lo que la sesión va contestando.
          if (e.sid_nuevo && e.sid_nuevo !== clave && t.sid === clave){
            clave = mudarPestana(t, clave, e.sid_nuevo);
            pintarSesion();
          }
          if (e.estado === 'trabajando') continue;
          r = {...e, ok: e.estado === 'terminado', sid: e.sid_nuevo || e.sid};
          break;
        } catch(e){ continue; }
      }
    }
    if (r.sid){
      // El turno cerró: si la charla cambió de id (nació recién, o el CLI la compactó a
      // mitad de camino) la pestaña se muda ahora. Si ya se había mudado en el medio,
      // esto no hace nada y solo quedan las perillas.
      clave = mudarPestana(t, clave, r.sid);
      aplicarPerillas(t, r);
      guardar(); pintarTabs();
    }
    // Si lo cortaste vos con el botón Parar, el turno vuelve con error y eso NO es
    // una falla: no se pinta de rojo.
    if (!r.ok && !parados[clave]){
      marcarFalla(clave, r.error || 'No pude mandarlo');
      devolverLoEscrito(clave, txt, fotosParaEnviar);   // no se pierde lo que escribiste
    }
    else if (r.ok) delete falladas[clave];
    // ⭐ El tope ya no compacta solo (2026-08-20): si la charla pasó el límite, el
    // turno vuelve con la pregunta y se dibuja adentro del hilo, sin cartel del
    // navegador. "Ahora no" la silencia media hora.
    if (r.pide_compactar && !(silencioComp[clave] > Date.now()))
      pideCompactar[clave] = r.pide_compactar;
    else delete pideCompactar[clave];
  } catch(e){
    if (!parados[clave]){
      marcarFalla(clave, 'Se cortó: ' + e);
      devolverLoEscrito(clave, txt, fotosParaEnviar);
    }
  }
  delete enVuelo[clave]; delete arranque[clave]; delete parados[clave];
  delete vecesVuelo[clave];
  soltarFotosVuelo(clave);
  // Contestó: el contexto creció, así que se vuelve a preguntar. Es el momento en que
  // el aviso de "esto ya arrastra mucho" tiene que aparecer solo.
  modeloPedido = '';
  // Terminó de contestar: si te fuiste a otra pestaña, esta queda marcada.
  if (activa !== clave) pendientes[clave] = true;
  firma=''; guardar(); pintarTabs(); pintarSesion(); cargar();
}

$('#texto').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); mandar(); }
});
// Cambió el ancho de la caja (cambiaste el zoom, apareció Parar, plegaste el árbol): el
// alto se vuelve a medir. Se compara SOLO el ancho porque ajustar el alto dispara este
// mismo observador y quedaría dando vueltas.
if (window.ResizeObserver){
  let anchoCaja = 0;
  new ResizeObserver(es => {
    const ancho = Math.round(es[0].contentRect.width);
    if (ancho === anchoCaja) return;
    anchoCaja = ancho;
    ajustarCaja();
  }).observe($('#texto'));
}

$('#texto').addEventListener('input', e => {
  ajustarCaja();
  // ⭐ Cada tecla queda guardada como borrador: acá en el acto, y al servidor con el
  // respiro de 700 ms de `anotarBorrador`.
  anotarBorrador(activa, e.target.value);
});

// Cada 8 s se pregunta por las pestañas abiertas si alguna terminó de escribir.
// Solo por las tuyas, no por las 144 que hay en el disco.
async function mirarNovedades(){
  const abrir = abiertas.filter(t => !t.sid.startsWith('nueva-'));
  if (!abrir.length) return;
  let r;
  try {
    r = await (await fetch('/movil/novedad', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pestanas: abrir.map(t => ({sid:t.sid, cwd:t.cwd}))})})).json();
  } catch(e){ return; }
  let cambio = false;
  for (const t of abrir){
    const n = r[t.sid];
    if (!n || n.ultimo !== 'claude') continue;
    if (t.sid === activa){ visto[t.sid] = n.ts; continue; }   // la estás mirando
    if (n.ts > (visto[t.sid] || 0)){ pendientes[t.sid] = true; cambio = true; }
  }
  if (cambio){ guardar(); pintarTabs(); }
}

// ⭐ El marcador de texto: seleccionás adentro de una charla, botón derecho, y sale el
// menú de colores y formas (pedido de Martín, 2026-08-17). Va UN listener en el
// contenedor y no uno por mensaje: el hilo se rearma entero cada 3 s y habría que
// volver a engancharlos todos en cada repintado.
// ⚠ Si no hay nada seleccionado ni una marca abajo del puntero, `Marcas.menu` devuelve
// false y NO se toca el evento: ahí sale el menú del navegador, que es lo que uno espera
// (y en la lista de conversaciones el clic derecho sigue archivando, como siempre).
document.getElementById('cuerpo').addEventListener('contextmenu', e => {
  if (!activa || !window.Marcas) return;
  const hilo = document.getElementById('hilo');
  if (!hilo || !hilo.contains(e.target)) return;
  Marcas.menu(e, activa, hilo, () => { firma = ''; pintarSesion(); });
});

// ⭐ Y con el clic de siempre se AGARRA una marca ya hecha, para cambiarle el color o la
// forma sin tener que acordarse del botón derecho (pedido de Martín, 2026-08-18: "como lo
// ofrece el Adobe PDF"). ⚠ Solo si no estás seleccionando texto: si hay algo seleccionado,
// el clic es el final de ese arrastre y abrirle un menú encima sería una molestia.
document.getElementById('cuerpo').addEventListener('click', e => {
  if (!activa || !window.Marcas) return;
  const marca = e.target.closest && e.target.closest('.mkc');
  if (!marca) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  const hilo = document.getElementById('hilo');
  if (!hilo || !hilo.contains(marca)) return;
  Marcas.menu(e, activa, hilo, () => { firma = ''; pintarSesion(); });
});

// --- ⭐ Volver a Sesiones y caer donde lo dejaste -------------------------------------
// Pedido de Martín (2026-08-18): "si estoy navegando por el panel y salgo de sesiones para
// entrar a otra pestaña, cuando vuelva a sesiones quiero estar exactamente donde lo dejé".
//
// ⚠⚠ Esto convive con una decisión CONTRARIA que sigue en pie: "siempre se entra por la
// bandeja de Todas" (2026-08-17). No se pisan porque no hablan del mismo momento —
// entrar de cero (un favorito, el acceso del escritorio, la barra de direcciones) es venir
// a ver qué hay y va a la bandeja; VOLVER desde otra pantalla del panel es seguir donde
// estabas. Se distinguen mirando de dónde venís (`document.referrer`).
const PANTALLAS_PANEL = ['/', '/pizarra', '/estudio', '/avisos'];

function vengoDelPanel(){
  try {
    const r = new URL(document.referrer);
    if (r.origin !== location.origin) return false;
    return PANTALLAS_PANEL.includes((r.pathname || '/').replace(/\/+$/, '') || '/');
  } catch (e) { return false; }
}

function guardarSitio(){
  const c = $('#cuerpo');
  try {
    localStorage.setItem('sesSitio', JSON.stringify({
      activa, proy, viendoArchivadas,
      filtro: ($('#filtro') && $('#filtro').value) || '',
      scroll: c ? Math.round(c.scrollTop) : 0,
    }));
  } catch (e) { /* si no se puede guardar, se vuelve a la bandeja y listo */ }
}
// ⚠ `pagehide` y no `beforeunload`: éste último no siempre corre al navegar y encima
// algunos navegadores lo tratan como "voy a preguntar si querés salir". Y también al
// esconderse la pestaña, por si el navegador la descarta sin avisar.
addEventListener('pagehide', guardarSitio);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarSitio(); });
// Y lo mismo con el borrador: lo que estaba esperando el respiro de 700 ms se manda antes
// de irse. El `keepalive` del fetch es lo que hace que ese pedido llegue igual.
addEventListener('pagehide', soltarBorrador);
document.addEventListener('visibilitychange', () => { if (document.hidden) soltarBorrador(); });

function volverAlSitio(){
  let s;
  try { s = JSON.parse(localStorage.getItem('sesSitio') || 'null'); } catch (e) { return false; }
  if (!s) return false;
  if (s.proy) proy = s.proy;
  viendoArchivadas = !!s.viendoArchivadas;
  scrollPendiente = s.scroll || 0;
  if (s.activa && abiertas.some(t => t.sid === s.activa)){
    irTab(s.activa);
    recienAbierta = false;           // no caer al final: volvés al renglón donde estabas
  } else {
    activa = null;
    firma = ''; pintarCarpetas(); pintarTabs(); pintar();
  }
  // ⚠ El filtro NO se puede escribir en el campo y listo: `cargar()` termina un segundo
  // después y repinta la lista entera, con lo que el campo se rehace vacío y lo escrito
  // se pierde. Va como pendiente y lo toma el primer pintado que lo encuentre.
  if (s.filtro) filtroPendiente = s.filtro;
  return true;
}

// --- Entrar por una dirección: `/sesiones?c=<id>` ------------------------------------
// Dos caminos, del más barato al más caro:
//   1. la charla YA está entre tus pestañas (viene del localStorage): se abre en el acto,
//      sin esperar a nadie;
//   2. no está (un favorito, una pestaña nueva del navegador, otra computadora): se le
//      pregunta al servidor en qué carpeta vive, mandándole el id pelado.
// ⚠ No se espera a `/movil/sesiones` para resolverla: esa lista tarda hasta un segundo y
// además está topeada al último mes, así que un favorito viejo no aparecería ahí.
async function entrarPorDireccion(){
  const sid = window.Direccion ? Direccion.leer().c : '';
  if (!sid){
    // Sin conversación en la dirección: si venís de otra pantalla del panel, se te
    // devuelve la vista donde la dejaste; si entrás de cero, la bandeja de siempre.
    if (vengoDelPanel() && volverAlSitio()){ fijarDireccion({empujar: false}); return; }
    return fijarDireccion({empujar: false});           // la bandeja: solo el título
  }
  const t = abiertas.find(x => x.sid === sid);
  if (t) return irTab(sid);
  const d = await Direccion.donde(sid);
  if (d) return abrirSesion(d.cwd, sid, d.nombre);
  perdida = sid; firma = ''; pintarLista();
}

// ⚠ Varias pestañas del NAVEGADOR comparten el mismo `localStorage`, así que la barra de
// pestañas de arriba es una sola para todas: si en una ventana abrís otra charla, la de
// al lado no se enteraba y en el siguiente `guardar()` la pisaba (la pestaña recién
// abierta desaparecía sola). Con esto cada ventana adopta la lista nueva apenas cambia.
// ⭐ Lo que NO se adopta es qué charla estás mirando: eso lo manda la dirección de ESTA
// ventana, que es todo el punto de tener una dirección por conversación. Si la lista que
// llega no la trae, se la devuelve.
addEventListener('storage', e => {
  if (e.key !== 'sesTabs') return;
  let lista;
  try { lista = JSON.parse(e.newValue || '[]'); } catch (err) { return; }
  if (!Array.isArray(lista)) return;
  const mia = abiertas.find(t => t.sid === activa);
  abiertas = lista;
  if (mia && !abiertas.some(t => t.sid === mia.sid)) abiertas.push(mia);
  pintarTabs();
});

// La flecha ← del navegador: vuelve a la conversación anterior, o a la bandeja.
// ⚠ Acá NO se vuelve a escribir la dirección (el navegador ya la cambió): `irTab` la
// escribe igual, pero como es la misma que ya está puesta, `Direccion.fijar` no toca el
// historial. Sin esa guarda, cada ← agregaría una entrada nueva y no se saldría más.
if (window.Direccion) Direccion.alVolver(async estado => {
  if (!estado.c){
    activa = null; proy = TODAS; recienAbierta = true;
    Direccion.fijar({}, {empujar: false});
    firma=''; pintarCarpetas(); pintarTabs(); pintar();
    return;
  }
  if (estado.c === activa) return;
  if (abiertas.some(x => x.sid === estado.c)) return irTab(estado.c);
  const d = await Direccion.donde(estado.c);
  if (d) abrirSesion(d.cwd, estado.c, d.nombre);
});

// ⚠ `entrarPorDireccion()` NO se llama acá: abrir una charla dibuja la pantalla entera,
// y el explorador de archivos (`arb`) todavía no existe en este renglón — reventaba con
// "Cannot access 'arb' before initialization". Se llama al final del archivo.
cargar();
mirarNovedades();
setInterval(mirarNovedades, 8000);
setInterval(() => { if (activa) pintarSesion(); }, 3000);   // el en vivo de la charla
// La bandeja se actualiza sola cada 8 s: veinte era demasiado, mandabas un mensaje,
// volvías a "Todas" y todavía figuraba como antes (2026-08-17).
setInterval(() => {
  const r = document.getElementById('reloj'), t0 = arranque[activa];
  if (!r || !t0) return;
  const seg = Math.round((Date.now() - t0) / 1000);
  r.textContent = seg < 60 ? ' · ' + seg + ' s'
                           : ' · ' + Math.floor(seg/60) + ' min ' + (seg % 60) + ' s';
}, 1000);
setInterval(cargar, 8000);
// Y al volver a esta pestaña del navegador, refresca al instante en vez de esperar
// el próximo tic: es justo cuando uno viene a mirar cómo quedó.
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });

// --- El explorador de archivos del proyecto ----------------------------------
// Pedido de Martín (2026-08-17): "quiero el explorador de archivos del proyecto al
// lateral izquierdo, como Visual Studio". Muestra los archivos de la CARPETA donde
// estás parado (la marcada arriba, o la de la conversación abierta si estás en
// "Todas"), y al tocar uno se lee a la derecha.
// ⭐ Es de MIRAR: no edita, no borra, no mueve nada. Para cambiar un archivo está la
// conversación, que es la que sabe lo que está haciendo; un explorador que además
// escribe es otra cosa y se decide aparte.
// ⭐ Los hijos de una carpeta se piden RECIÉN al abrirla: un proyecto de verdad tiene
// miles de archivos y pedirlos todos de entrada sería la lista de 240 sesiones otra vez.
const arb = {cwd:'', nom:'', hijos:{}, demas:{}, abiertas:new Set(), sel:'',
             nota:'Elegí una carpeta arriba y acá aparecen sus archivos.'};
let verArchivo = null;      // el archivo que se está mirando (null = la conversación)
let verCrudo = false;       // un .md se dibuja; con esto se ve el texto tal cual

const ICONOS = {py:'🐍', js:'📜', json:'⚙', jsonl:'📋', html:'🌐', css:'🎨', md:'📝',
                txt:'📄', yml:'⚙', yaml:'⚙', bat:'▶', cmd:'▶', vbs:'▶', ps1:'▶',
                log:'📋', png:'🖼', jpg:'🖼', jpeg:'🖼', gif:'🖼', webp:'🖼', svg:'🖼',
                ico:'🖼', wav:'🎵', mp3:'🎵', m4a:'🎵', mp4:'🎬', zip:'📦', env:'🔑'};
const iconoDe = n => ICONOS[(n.split('.').pop() || '').toLowerCase()] || '📄';
const pesoDe = b => b < 1024 ? b + ' B'
                  : b < 1048576 ? (b/1024).toFixed(1).replace('.', ',') + ' kB'
                  : (b/1048576).toFixed(1).replace('.', ',') + ' MB';

// De qué carpeta se muestran los archivos: la marcada arriba manda, y si estás en
// "Todas" (que no es un proyecto) vale la de la conversación que tenés abierta.
function cwdDelArbol(){
  const p = datos.proyectos.find(x => x.proyecto === proy);
  if (p && p.cwd) return {cwd: p.cwd, nom: p.proyecto};
  const t = abiertas.find(x => x.sid === activa);
  if (t && t.cwd) return {cwd: t.cwd, nom: proyectoDe(t) || t.cwd};
  // ⭐ En "Todas" no hay ninguna carpeta parada, y el explorador se vaciaba justo en la
  // pantalla donde uno más tiempo pasa: quedaba un cartelito y parecía que no estaba
  // (Martín, 2026-08-17: "no sé dónde quedó el explorador"). Se queda mostrando la
  // ÚLTIMA carpeta que miraste, como hace VS Code, hasta que elijas otra.
  try {
    const u = JSON.parse(localStorage.getItem('sesArbolCwd') || 'null');
    if (u && u.cwd) return u;
  } catch(e){ /* si quedó algo raro guardado, se ignora */ }
  return {cwd:'', nom:''};
}

// Se llama en CADA pintado y casi siempre no hace nada: solo reacciona cuando
// cambiaste de carpeta. Si no, cada repintado de 8 s te cerraría las ramas abiertas.
function sincronizarArbol(){
  const d = cwdDelArbol();
  if (d.cwd === arb.cwd) return;
  arb.cwd = d.cwd; arb.nom = d.nom;
  arb.hijos = {}; arb.demas = {}; arb.abiertas = new Set(); arb.sel = ''; arb.nota = '';
  // ⚠ El título dice SIEMPRE "Archivos". Antes mostraba solo el nombre del proyecto, y
  // con el panel plegado esa tira decía "▸ wpp-transcriptor": imposible adivinar que ahí
  // adentro estaban los archivos. El botoncito tiene que decir qué trae de vuelta.
  $('#arbolNom').textContent = arb.nom ? 'Archivos · ' + arb.nom : 'Archivos';
  $('#arbolNom').title = arb.cwd || '';
  if (arb.cwd){
    localStorage.setItem('sesArbolCwd', JSON.stringify({cwd: arb.cwd, nom: arb.nom}));
    cargarCarpeta('');
  } else { arb.nota = 'Elegí una carpeta arriba y acá aparecen sus archivos.'; pintarArbol(); }
}

async function cargarCarpeta(sub){
  try {
    const r = await fetch('/archivos/lista?cwd=' + encodeURIComponent(arb.cwd) +
                          '&sub=' + encodeURIComponent(sub));
    // La pantalla se sirve del disco y se actualiza sola, pero las direcciones nuevas
    // viven adentro de panel.py y no existen hasta que se lo reinicie. Sin este aviso,
    // el explorador se veía vacío y parecía roto.
    if (r.status === 404){
      arb.nota = '⚠ Falta reiniciar el panel: el explorador ya está, pero sus ' +
                 'direcciones todavía no existen en el panel que está corriendo.';
      return pintarArbol();
    }
    const d = await r.json();
    if (!d.ok){ arb.nota = d.error || 'No pude leer esa carpeta.'; return pintarArbol(); }
    arb.nota = '';
    arb.hijos[sub] = d.items;
    arb.demas[sub] = d.de_mas || 0;
  } catch(e){ arb.nota = 'No pude leer la carpeta: ' + e; }
  pintarArbol();
}

function filasArbol(sub, nivel){
  let html = (arb.hijos[sub] || []).map(it => {
    const ruta = sub ? sub + '/' + it.nombre : it.nombre;
    const ab = arb.abiertas.has(ruta);
    return '<div class="nodo' + (arb.sel === ruta ? ' sel' : '') + '" data-r="' + esc(ruta) +
      '" data-d="' + (it.dir ? 1 : 0) + '" title="' + esc(ruta) +
      (it.dir ? '' : ' · ' + pesoDe(it.bytes)) + '"' +
      ' style="padding-left:' + (7 + nivel * 13) + 'px">' +
      '<span class="fle">' + (it.dir ? (ab ? '▾' : '▸') : '') + '</span>' +
      '<span class="ico">' + (it.dir ? (ab ? '📂' : '📁') : iconoDe(it.nombre)) + '</span>' +
      '<span class="nom">' + esc(it.nombre) + '</span></div>' +
      (it.dir && ab ? filasArbol(ruta, nivel + 1) : '');
  }).join('');
  if (arb.demas[sub])
    html += '<div class="arbolNota" style="padding-left:' + (24 + nivel * 13) + 'px">…y ' +
            arb.demas[sub] + ' más: son demasiados para mostrarlos</div>';
  return html;
}

function pintarArbol(){
  const c = $('#arbol');
  if (!c) return;
  c.innerHTML = (arb.nota ? '<div class="arbolNota">' + esc(arb.nota) + '</div>' : '') +
                (arb.cwd ? filasArbol('', 0) : '');
  c.querySelectorAll('.nodo').forEach(el => {
    el.onclick = () => {
      const ruta = el.dataset.r;
      if (el.dataset.d !== '1') return abrirArchivo(ruta);
      if (arb.abiertas.has(ruta)) arb.abiertas.delete(ruta);
      else {
        arb.abiertas.add(ruta);
        if (!arb.hijos[ruta]) return cargarCarpeta(ruta);   // ella repinta al volver
      }
      pintarArbol();
    };
  });
}

async function abrirArchivo(ruta){
  arb.sel = ruta; verCrudo = false; pintarArbol();
  try {
    const d = await (await fetch('/archivos/ver?cwd=' + encodeURIComponent(arb.cwd) +
                                 '&ruta=' + encodeURIComponent(ruta))).json();
    if (!d.ok) return alert(d.error || 'No pude abrirlo');
    verArchivo = Object.assign({cwd: arb.cwd}, d);
  } catch(e){ return alert('No pude abrirlo: ' + e); }
  firma = ''; pintar();
}

function cerrarArchivo(){
  verArchivo = null; arb.sel = '';
  firma = ''; recienAbierta = true;
  pintarArbol(); pintar();
}

function pintarArchivo(){
  const a = verArchivo;
  const md = a.tipo === 'texto' && /\.md$/i.test(a.nombre);
  const cuando = new Date((a.ts || 0) * 1000).toLocaleString('es-AR');
  let cuerpo;
  if (a.tipo === 'imagen')
    cuerpo = '<img class="vImg" src="/archivos/crudo?cwd=' + encodeURIComponent(a.cwd) +
             '&ruta=' + encodeURIComponent(a.ruta) + '">';
  else if (a.tipo === 'binario')
    cuerpo = '<div class="vacio">Esto no es texto (' + pesoDe(a.bytes) + '): hay que ' +
             'abrirlo con el programa que le corresponda.</div>';
  else if (a.tipo === 'pesado')
    cuerpo = '<div class="vacio">Pesa ' + pesoDe(a.bytes) + ': demasiado para mostrarlo acá.</div>';
  else if (md && !verCrudo)
    cuerpo = marcar(a.texto);
  else {
    // Los números de renglón van en su propia columna: adentro del texto se copiarían
    // junto con el código y no servirían para nada.
    const cuantas = a.texto.split('\n').length;
    cuerpo = '<div class="codigo"><div class="ren">' +
             Array.from({length: cuantas}, (_, i) => i + 1).join('\n') +
             '</div><pre>' + esc(a.texto) + '</pre></div>';
  }
  const html = '<div class="vCab"><b>' + esc(a.nombre) + '</b>' +
    '<small>' + esc(a.ruta) + ' · ' + pesoDe(a.bytes) + ' · ' + esc(cuando) + '</small>' +
    (md ? '<div class="op" id="vCrudo">' + (verCrudo ? '📖 dibujado' : '🔤 tal cual') + '</div>' : '') +
    '<div class="op" id="vCopiar">📋 copiar la ruta</div>' +
    (activa ? '<div class="op" id="vPasar">📎 pasársela a la charla</div>' : '') +
    '<div class="op cerrar" id="vCerrar">✕ cerrar</div></div>' +
    (a.cortado ? '<div class="aviso">Es grande: se muestra el principio nomás.</div>' : '') +
    cuerpo;
  if (html === firma) return;
  firma = html;
  $('#cuerpo').innerHTML = html;
  $('#cuerpo').scrollTop = 0;
  $('#vCerrar').onclick = cerrarArchivo;
  $('#vCopiar').onclick = async () => {
    try { await navigator.clipboard.writeText(a.completo); $('#vCopiar').textContent = '✓ copiada'; }
    catch(e){ alert(a.completo); }
  };
  if ($('#vCrudo')) $('#vCrudo').onclick = () => { verCrudo = !verCrudo; firma=''; pintarArchivo(); };
  // 📎 le deja la ruta escrita en la caja de abajo: es lo que uno viene a hacer con el
  // explorador abierto al lado de una conversación ("mirá este archivo").
  if ($('#vPasar')) $('#vPasar').onclick = () => {
    const c = $('#texto');
    c.value = (c.value ? c.value.trimEnd() + ' ' : '') + a.completo + ' ';
    c.focus(); ajustarCaja();
  };
}

// El explorador se guarda como la barra de la pizarra, y el ancho de la columna se
// arrastra del borde. Las dos cosas se acuerdan de cómo las dejaste.
// ⚠⚠ La llave dice "2" a propósito: la PRIMERA versión de Ctrl+B plegaba este panel, y a
// quien lo haya usado le quedó guardado "plegado" para siempre — o sea, el explorador
// desaparecido y sin saber por qué (le pasó a Martín el 2026-08-17). Cambiarle el nombre
// a la llave hace que todos arranquen con el explorador abierto, una sola vez.
if (localStorage.getItem('sesArbolPlegado2') === '1')
  document.body.classList.add('arbol-plegado');
const estaPlegado = () => document.body.classList.contains('arbol-plegado');

function plegarArbol(plegado){
  document.body.classList.toggle('arbol-plegado', plegado);
  localStorage.setItem('sesArbolPlegado2', plegado ? '1' : '0');
  $('#arbolPlegar').textContent = plegado ? '▸' : '▾';
}
plegarArbol(estaPlegado());               // dibuja la flechita como quedó la última vez
$('#arbolPlegar').onclick = () => plegarArbol(!estaPlegado());

// --- ⭐ Esconder las barras de arriba: un botón por cosa ------------------------------
// Pedido de Martín (2026-08-18), en tres pasos y vale la pena seguirlos porque la
// conclusión no era obvia:
//   1. "me gustaría poder ocultar cada sección individualmente" -> se hizo un menú 👁 con
//      una tilde por franja. Lo rechazó apenas lo vio: "no me convence".
//   2. "quiero un botón simple para ocultar ambas, así tengo la pantalla del chat
//      completa" -> el ⤢.
//   3. "un botón para cada una individualmente" -> además, el ▭ y el ⧉.
//   4. "no me convence ese botón de hamburguesa, yo quiero que se oculte la barra entera,
//      no solo las pestañas" -> el ▭ se lleva la FILA ENTERA, con sus propios botones
//      adentro, y deja de ser un ☰ (la hamburguesa quiere decir "abrir un menú", justo lo
//      contrario de lo que hace).
// O sea: lo que no quería era ELEGIR EN UN MENÚ. Un botón por cosa, a la vista y de un
// toque, es exactamente lo mismo que ofrecía el menú y sí le sirve. La diferencia no está
// en cuánto se puede configurar sino en cuántos gestos cuesta. Y esconder algo tiene que
// devolver EL LUGAR que ocupaba: media barra vacía no es esconderla.
//
// El ▭ esconde la barra de arriba entera y el ⧉ la fila de conversaciones.
let ver = {};
try { ver = JSON.parse(localStorage.getItem('sesVer') || '{}') || {}; } catch(e){}
const seVe = k => ver[k] !== false;

function aplicarVer(){
  // ⚠ `menu` esconde la FILA, no el `<nav>` de las pantallas: sacarle las pastillas y
  // dejar la tira con los cuatro botones no le devolvía a la conversación ni un pixel.
  document.body.classList.toggle('sin-arriba', !seVe('menu'));
  $('#barra').style.display = seVe('tabs') ? '' : 'none';
  // Apagado, el botón queda tenue: así se ve de una que eso está escondido y que ahí
  // mismo se lo vuelve a prender. (El de la barra de arriba se va con ella; para ese
  // está el ⤡ flotando, que es el único camino de vuelta.)
  $('#btnTabs').classList.toggle('off', !seVe('tabs'));
  $('#btnTabs').title = (seVe('tabs') ? 'Esconder' : 'Mostrar') + ' la fila de conversaciones';
  localStorage.setItem('sesVer', JSON.stringify(ver));
  if (window.menuAcomodar) menuAcomodar();   // el menú mide su lugar solo
}
$('#btnMenu').onclick = () => { ver.menu = false; aplicarVer(); };
$('#btnTabs').onclick = () => { ver.tabs = !seVe('tabs'); aplicarVer(); };
aplicarVer();

// ⚠⚠ Escondida la barra de arriba —sola con el ▭, o junto con la otra con el ⤢— se van con
// ella TODOS los botones. Por eso aparece el ⤡ flotando sobre la charla: es el único camino
// de vuelta y NO puede depender de pasar el mouse por el lugar justo. Una pantalla que se
// desarma sin poder rearmarse es una trampa, y acá ya pasó una vez (el explorador
// desaparecido por una llave vieja del localStorage). El Esc hace lo mismo.
// ⭐ El ⤡ devuelve la barra de arriba y sale de pantalla completa, pero NO le toca la fila
// de conversaciones: si la habías escondido vos, es porque la querés escondida. Vuelve la
// barra con los botones, y desde ahí decidís el resto.
const enPleno = () => document.body.classList.contains('pleno');
const sinArriba = () => document.body.classList.contains('sin-arriba');

function verPleno(pleno){
  document.body.classList.toggle('pleno', pleno);
  localStorage.setItem('sesPleno', pleno ? '1' : '0');
  if (!pleno && window.menuAcomodar) menuAcomodar();   // volvió: que mida su lugar
}
verPleno(localStorage.getItem('sesPleno') === '1');

function volverBarras(){
  verPleno(false);
  ver.menu = true;
  aplicarVer();
}
$('#btnPleno').onclick = () => verPleno(true);
$('#salirPleno').onclick = volverBarras;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (enPleno() || sinArriba())) volverBarras();
});

// ⚠ Limpieza del intento anterior: si quedó guardado el menú 👁 con alguna franja apagada,
// se respeta SOLO lo de la columna (que ya existía con el Ctrl+B) y el resto vuelve a la
// vista. Lo que se borra tiene que dejar todo visible, nunca escondido: si no, quedaría
// media pantalla apagada por un botón que ya no existe.
try {
  const viejo = JSON.parse(localStorage.getItem('sesFranjas') || 'null');
  if (viejo){
    if (viejo.lateral === false) localStorage.setItem('sesLateralOculto', '1');
    localStorage.removeItem('sesFranjas');
  }
} catch(e){ localStorage.removeItem('sesFranjas'); }

// ⭐ Ctrl+B esconde y muestra la COLUMNA ENTERA (proyectos + archivos), como en VS Code
// (pedido de Martín, 2026-08-17: "me refería al navbar completo del explorador"). El ▾ del
// explorador es otra cosa y sigue igual: pliega solo el árbol y deja los proyectos.
// Anda también mientras escribís en la caja de abajo: en un campo de texto pelado Ctrl+B
// no hace nada propio (no hay negrita que aplicar), así que no le pisamos nada a nadie.
// ⚠ Se pide Ctrl SIN Shift ni Alt: Ctrl+Shift+B es de las barras del navegador.
if (localStorage.getItem('sesLateralOculto') === '1')
  document.body.classList.add('lateral-oculto');
const lateralOculto = () => document.body.classList.contains('lateral-oculto');

function verLateral(oculto){
  document.body.classList.toggle('lateral-oculto', oculto);
  localStorage.setItem('sesLateralOculto', oculto ? '1' : '0');
  $('#btnLateral').title = (oculto ? 'Mostrar' : 'Esconder') + ' la barra lateral (Ctrl+B)';
}
verLateral(lateralOculto());
$('#btnLateral').onclick = () => verLateral(!lateralOculto());

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  if ((e.key || '').toLowerCase() !== 'b') return;
  e.preventDefault();
  verLateral(!lateralOculto());
});
// ⟳ vuelve a leer el disco: si creaste un archivo (o lo creó la conversación de al
// lado), el árbol no se entera solo. Se releen las ramas que tenías abiertas.
$('#arbolRefrescar').onclick = async () => {
  const ramas = ['', ...arb.abiertas];
  arb.hijos = {}; arb.demas = {};
  for (const r of ramas) await cargarCarpeta(r);
};

const anchoGuardado = +localStorage.getItem('sesLatAncho') || 0;
if (anchoGuardado)
  document.documentElement.style.setProperty('--lat', anchoGuardado + 'px');
$('#tirador').addEventListener('pointerdown', e => {
  e.preventDefault();
  let ancho = 0;
  const mover = ev => {
    ancho = Math.max(190, Math.min(640, ev.clientX));
    document.documentElement.style.setProperty('--lat', ancho + 'px');
  };
  const soltar = () => {
    document.removeEventListener('pointermove', mover);
    document.removeEventListener('pointerup', soltar);
    if (ancho) localStorage.setItem('sesLatAncho', ancho);
  };
  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', soltar);
});
pintarArbol();      // el cartelito de "elegí una carpeta" antes del primer /movil/sesiones

// ⭐ Y recién ahora, con TODA la pantalla declarada, se mira la dirección con la que
// entraste: si dice una conversación, se abre ya (`/sesiones?c=<id>`). Va último a
// propósito — abrir una charla pinta la pantalla entera, incluido el explorador de
// archivos, y llamándolo antes se usaba `arb` sin haberlo creado todavía.
// ⭐ Con la lista de la última vez ya cargada, la pantalla se dibuja ENTERA antes de
// pedirle nada a nadie: eso es lo que hace que entrar sea instantáneo. Si es la primera
// vez que entrás desde este navegador no hay nada guardado y queda el "Cargando…" de
// siempre, medio segundo.
if (datos.proyectos.length){ pintarCarpetas(); pintarTabs(); pintar(); }
entrarPorDireccion();

// El aspecto (fondo, tipografía y color) lo maneja /estaticos/aspecto.js, que es
// el mismo para todas las pantallas. Acá solo quedan, arriba en el CSS, las reglas
// que enganchan los colores de ESTA pantalla a sus variables.
</script></body></html>
