<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesiones</title>
<!--
  Las sesiones de Claude Code en pantalla grande. Referencia que pidio Martin: Gmail.
  Los proyectos son las carpetas de la izquierda, las conversaciones de ese proyecto
  son la bandeja, y al abrir una queda como PESTAÑA propia arriba — nunca como una
  columna al lado del chat, eso lo descarto explicito (2026-08-16).
  Vive como archivo aparte (no adentro de panel.py) porque son 200 lineas de HTML y
  ahi todo hay que escaparlo dos veces; el panel solo lo sirve.
-->
<style>
 *{box-sizing:border-box}
 :root{color-scheme:dark}
 html,body{height:100%;margin:0;background:var(--c0b0d12,#0b0d12);color:var(--ce8ecf1,#e8ecf1);
           font:14px/1.5 Segoe UI,system-ui,sans-serif}
 body{display:flex;flex-direction:column}
 /* ⭐⭐ DOS FILAS, y no una (pedido de Martín, 2026-08-18: "no me gusta que las sesiones
    ocupen el mismo lugar que las pestañas, se me hace incómodo trabajar así; que las
    pestañas estén arriba"). Arriba el menú de PANTALLAS —Panel, Sesiones, Pizarra…—, que
    es la chapa de la aplicación; abajo, a todo lo ancho, las conversaciones abiertas.
    Antes compartían renglón y el menú les comía como 700 px justo del lado donde crecen.
    Ojo con los dos sentidos de "pestaña": acá `.tab` es una charla abierta y
    `#menuPantallas` son las seis pantallas del panel, que es a las que él les dice así. */
 /* ⭐ Las dos barras siguen a `--ui` (el tamaño de los controles del 🎨, 2026-09-12): con
    el zoom arriba las pestañas se comían dos renglones de pantalla. Sin elegir nada vale
    1 y queda igual que siempre. */
 #barraArriba{display:flex;align-items:center;justify-content:space-between;
              background:var(--c0f1320,#0f1320);flex:none;
              padding:calc(5px * var(--ui,1)) calc(14px * var(--ui,1)) calc(5px * var(--ui,1)) 0;
              border-bottom:1px solid var(--c171d2b,#171d2b)}
 #barra{display:flex;align-items:flex-end;background:var(--c0f1320,#0f1320);flex:none}
 #tabs{flex:1;min-width:0;display:flex;gap:calc(6px * var(--ui,1));
       padding:calc(7px * var(--ui,1)) calc(14px * var(--ui,1)) 0;overflow-x:auto}
 #menuPantallas{flex:none;align-items:center}
 .tab{padding:calc(8px * var(--ui,1)) calc(14px * var(--ui,1));border-radius:10px 10px 0 0;background:var(--c151920,#151920);color:var(--c9aa6b5,#9aa6b5);
      font-size:calc(13px * var(--ui,1));white-space:nowrap;cursor:pointer;border:1px solid var(--c232a35,#232a35);border-bottom:0}
 .tab.sel{background:var(--c1a2130,#1a2130);color:var(--ccfe6ff,#cfe6ff)}
 /* Se arrastran para reordenarlas, como en el navegador: el texto no se selecciona
    (si no, arrastrar te pinta el nombre) y la que llevás agarrada queda apagada.
    El cambio de color va con transición para que pasar de una a otra no sea un
    parpadeo; el `transform` NO se pone acá, lo maneja `deslizando()` a mano. */
 .tab{user-select:none;transition:background .18s ease,color .18s ease,
      border-color .18s ease,opacity .15s ease}
 .tab.moviendo{opacity:.42}
 .tab:active{cursor:grabbing}
 .tab .x{margin-left:9px;color:var(--c6b7280,#6b7280)}
 .tab .x:hover{color:var(--mal-txt)}
 /* El punto de una sesion VIVA = esta trabajando: amarillo, como en la lista. */
 .tab .viva{color:var(--aviso);font-size:10px;margin-right:5px}
 /* El ＋ de arrancar una charla: mismo alto que las pestañas, pero se lee como botón. */
 .tab.mas{color:var(--c8ecbff,#8ecbff);background:var(--c131a26,#131a26);font-size:calc(15px * var(--ui,1));padding:calc(8px * var(--ui,1)) calc(13px * var(--ui,1));font-weight:600}
 .tab.mas:hover{background:var(--c1a2536,#1a2536);color:var(--ccfe6ff,#cfe6ff)}
 /* Mismo semáforo que en la lista: verde te espera, amarillo trabaja, rojo falló. */
 .tab.espera{background:var(--ok-bg);color:var(--ok-txt);border-color:var(--ok-bd)}
 .tab.espera .bola{display:inline-block;width:8px;height:8px;border-radius:50%;
                   background:var(--ok);margin-right:7px;animation:latir 1.4s infinite}
 .tab.fallada{background:var(--mal-bg);color:var(--mal-txt);border-color:var(--mal-bd)}
 .tab.fallada .bola{background:var(--mal-txt)}
 @keyframes latir{0%,100%{opacity:1} 50%{opacity:.35}}
 /* ⭐ La pestaña que acabás de abrir con el botón del medio (2026-08-19). Abrir en
    segundo plano no cambia NADA de lo que estás mirando, así que sin este parpadeo el
    clic se siente como si no hubiera pasado nada. Es un respiro de un segundo y medio,
    no un color fijo: el color fijo competiría con el semáforo de al lado. */
 .tab.recien{animation:tabRecien 1.5s ease}
 @keyframes tabRecien{0%{background:var(--c1d3350,#1d3350);box-shadow:0 0 0 2px rgba(var(--c8ecbff-rgb,142,203,255),.55)}
                      100%{background:var(--c151920,#151920);box-shadow:0 0 0 0 rgba(var(--c8ecbff-rgb,142,203,255),0)}}
 /* ⭐ Las pestañas van AGRUPADAS POR PROYECTO, como los grupos de pestañas del
    navegador (pedido de Martín, 2026-08-17): cada proyecto es una pastilla que se
    despliega y se pliega, y su ✕ cierra todas las charlas de ese proyecto de una.
    Se distingue del `.tab` a propósito: la pastilla es redonda de los cuatro lados y
    no llega al piso de la barra, así se ve que es el rótulo del grupo y no una charla. */
 .grupo{display:flex;align-items:center;gap:calc(7px * var(--ui,1));margin-bottom:1px;
        padding:calc(6px * var(--ui,1)) calc(10px * var(--ui,1));border-radius:9px;background:var(--c12161f,#12161f);color:var(--c8b97a7,#8b97a7);
        font-size:calc(12px * var(--ui,1));font-weight:600;letter-spacing:.02em;white-space:nowrap;
        cursor:pointer;border:1px solid var(--c232a35,#232a35);user-select:none;
        transition:background .18s ease,color .18s ease,border-color .18s ease}
 .grupo:hover{background:var(--c182030,#182030);color:var(--ccfe6ff,#cfe6ff)}
 /* Desplegado se enciende. Lo que lo ATA a sus charlas es la caja que las abraza a
    todas (ver `#abrazo`), no una rayita: eso ya lo dice la caja. */
 .grupo.abierto{background:var(--c1a2130,#1a2130);color:var(--ccfe6ff,#cfe6ff);border-color:var(--c2d3a4d,#2d3a4d)}
 /* ⭐ LA CAJA QUE ABRAZA AL GRUPO (pedido de Martín, 2026-08-18: "me gustaría que esta
    pastilla pueda abrazar a las sesiones que muestra"), como los grupos de pestañas de
    Chrome: la pastilla del proyecto y las charlas que despliega, adentro de un mismo
    marco redondeado.
    ⚠⚠ Es un DIV APARTE dibujado detrás, no un contenedor de verdad. Meter las pestañas
    adentro de un `<div>` rompería el arrastre entero: mueve NODOS con `insertBefore`
    sobre `#tabs` y recorre el grupo con `nextElementSibling`, así que dejarían de ser
    hermanas. Acá el DOM queda plano y la caja se acomoda midiendo (`acomodarAbrazo`).
    Va como hija de `#tabs` para que se corra sola con el scroll de la fila. */
 #tabs{position:relative}
 #tabs .tab,#tabs .grupo{position:relative;z-index:1}
 #abrazo{position:absolute;top:2px;bottom:0;z-index:0;pointer-events:none;display:none;
         border:1px solid var(--borde-fuerte,var(--c2d3a4d,#2d3a4d));border-bottom:0;border-radius:13px 13px 0 0;
         background:rgba(var(--cffffff-rgb,255,255,255),.035)}
 /* ⭐ Cada tarjetita se puede pintar y renombrar a mano (botón derecho encima), tanto la
    de un proyecto como la de una conversación — pedido de Martín, 2026-08-18. El color va
    en el estilo del elemento, así que le gana a las clases: el semáforo sigue avisando con
    su PUNTITO, que es lo que no se toca. */
 /* ⚠ Con ancho tope: con nueve figuras el menú se estiraba media pantalla y quedaba
    cortado contra el borde. Acotado, las pastillas se acomodan en varias filas. */
 #menuTarjeta{display:none;position:fixed;z-index:9999;width:252px;background:var(--c151b26,#151b26);
   border:1px solid var(--c2a3342,#2a3342);border-radius:12px;padding:9px;color:var(--ce8ecf1,#e8ecf1);font-size:13px;
   box-shadow:var(--sombra-3)}
 #menuTarjeta.abierto{display:block}
 #menuTarjeta .rub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
   color:var(--c5c6675,#5c6675);font-weight:700;margin:1px 0 8px 7px}
 #menuTarjeta .tonos{display:flex;flex-wrap:wrap;gap:7px;padding:0 4px 4px}
 #menuTarjeta .tono{width:22px;height:22px;border-radius:50%;cursor:pointer;
   border:2px solid transparent}
 #menuTarjeta .tono.sel{border-color:var(--ce8ecf1,#e8ecf1)}
 #menuTarjeta .tono.nada{background:var(--c1b2130,#1b2130);color:var(--c6f7b8c,#6f7b8c);display:flex;
   align-items:center;justify-content:center;font-size:12px}
 /* Los íconos de una carpeta usan la misma cuadrícula que los colores, pero con el
    emoji adentro: en la fila de 22 px entran de a siete y la lista se va para abajo,
    que es lo que hace falta ahora que él puede agregar los suyos. */
 #menuTarjeta .tono.ico{background:var(--c1b2130,#1b2130);display:flex;align-items:center;
   justify-content:center;font-size:13px;line-height:1}
 #menuTarjeta .tono.ico:hover{background:var(--c222b3d,#222b3d)}
 /* El ＋ para agregar uno tuyo: punteado, porque todavía no es un ícono sino el lugar
    donde va a haber uno. */
 #menuTarjeta .tono.mas{background:none;color:var(--c6f7b8c,#6f7b8c);display:flex;align-items:center;
   justify-content:center;font-size:12px;border:2px dashed var(--c333d4e,#333d4e);cursor:pointer}
 #menuTarjeta .tono.mas:hover{color:var(--ce8ecf1,#e8ecf1);border-color:var(--c4a5769,#4a5769)}
 /* ⭐ El buscador de íconos, adentro del menú. Antes esto era un `prompt()` del navegador
    ("localhost:8750 says…", gris, arriba de todo, tapando media pantalla): Martín lo vio
    y dijo "se ve muy feo". Un cartel del sistema en el medio de una pantalla cuidada
    canta que es un agregado. */
 #menuTarjeta .buscaIco{width:100%;box-sizing:border-box;background:var(--c1b2130,#1b2130);
   border:1px solid var(--c2a3342,#2a3342);border-radius:8px;color:var(--ce8ecf1,#e8ecf1);font-size:12.5px;
   padding:6px 9px;outline:none;font-family:inherit;margin:0 0 2px}
 #menuTarjeta .buscaIco:focus{border-color:var(--acento)}
 #menuTarjeta .buscaIco::placeholder{color:var(--c5c6675,#5c6675)}
 #menuTarjeta .galeria{display:flex;flex-wrap:wrap;gap:7px;padding:7px 2px 2px;
   max-height:168px;overflow-y:auto;overscroll-behavior:contain}
 #menuTarjeta .galeria::-webkit-scrollbar{width:6px}
 #menuTarjeta .galeria::-webkit-scrollbar-thumb{background:var(--c2a3342,#2a3342);border-radius:3px}
 /* El que pegaste va primero y marcado: es tuyo, no uno más de la lista. */
 #menuTarjeta .tono.pegado{border-color:var(--acento)}
 #menuTarjeta .nada-hay{color:var(--c6f7b8c,#6f7b8c);font-size:12px;padding:9px 5px 4px;line-height:1.4}
 #menuTarjeta .volver{color:var(--c6f7b8c,#6f7b8c);font-size:11px;padding:6px 5px 0;cursor:pointer}
 #menuTarjeta .volver:hover{color:var(--ce8ecf1,#e8ecf1)}
 #menuTarjeta .op{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
   cursor:pointer;color:var(--c9aa6b5,#9aa6b5);margin-top:2px}
 #menuTarjeta .op:hover{background:var(--c1d2534,#1d2534);color:var(--ce8ecf1,#e8ecf1)}
 #menuTarjeta .sep{border-top:1px solid var(--c232a35,#232a35);margin:8px 0 4px}
 #menuTarjeta .formas{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 2px}
 #menuTarjeta .forma{padding:5px 10px;border-radius:8px;background:var(--c1b2130,#1b2130);color:var(--c9aa6b5,#9aa6b5);
   font-size:12px;cursor:pointer;border:1px solid transparent}
 #menuTarjeta .forma:hover{background:var(--c222b3d,#222b3d)}
 #menuTarjeta .forma.sel{border-color:var(--acento);color:var(--acento)}
 /* La rueda para cualquier otro color, con su aro arcoíris — el mismo disfraz que en el
    🎨: pintada del color actual a secas parecía un tono más de la fila. */
 #menuTarjeta .ruedaCaja{display:inline-flex;padding:3px;border-radius:50%;
   border:2px solid transparent;
   background:conic-gradient(#f87171,#fbbf24,#34d399,#22d3ee,#60a5fa,#c084fc,#f87171)}
 #menuTarjeta .ruedaCaja.sel{border-color:var(--ce8ecf1,#e8ecf1)}
 #menuTarjeta .rueda{width:16px;height:16px;padding:0;border:none;border-radius:50%;
   background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
 #menuTarjeta .rueda::-webkit-color-swatch-wrapper{padding:0}
 #menuTarjeta .rueda::-webkit-color-swatch{border:none;border-radius:50%}
 /* ⭐ LA FORMA de las tarjetas (pedido de Martín, 2026-08-18: "la forma de las tarjetas me
    refería" + "dame más figuras"). Va por TIPO —todas las de proyecto o todas las de
    conversación—, no una por una: el color distingue una tarjeta de otra, la forma es cómo
    se ven las de esa clase. Vive en `data-ftab`/`data-fgrupo` de `#tabs`.
    ⚠ Cada figura se escribe UNA vez para los dos tipos: el selector nombra a la pestaña y
    a la pastilla juntas. Ocho figuras por dos tipos serían dieciséis reglas casi iguales. */
 #tabs[data-ftab="cuadrada"] .tab,#tabs[data-fgrupo="cuadrada"] .grupo{border-radius:0}
 #tabs[data-ftab="pildora"] .tab,#tabs[data-fgrupo="pildora"] .grupo{
   border-radius:999px;padding-left:16px;padding-right:16px}
 #tabs[data-ftab="pildora"] .tab{border-bottom-width:1px;margin-bottom:3px}
 #tabs[data-ftab="hoja"] .tab,#tabs[data-fgrupo="hoja"] .grupo{border-radius:16px 4px 16px 4px}
 #tabs[data-ftab="arco"] .tab,#tabs[data-fgrupo="arco"] .grupo{border-radius:18px 18px 5px 5px}
 #tabs[data-ftab="cinta"] .tab,#tabs[data-fgrupo="cinta"] .grupo{
   border-radius:4px;border-left-width:4px;border-left-color:currentColor;
   padding-left:12px}
 /* --- Las RECORTADAS. ⚠⚠ `clip-path` corta el borde en las diagonales, así que la silueta
    la dibuja el FONDO: por eso acá va más claro que la barra. Con el fondo de siempre la
    forma no se distinguía de la redondeada (visto en captura, no leyendo el CSS). */
 #tabs[data-ftab="pestana"] .tab,#tabs[data-fgrupo="pestana"] .grupo,
 #tabs[data-ftab="cortada"] .tab,#tabs[data-fgrupo="cortada"] .grupo,
 #tabs[data-ftab="flecha"] .tab,#tabs[data-fgrupo="flecha"] .grupo{
   border-radius:0;border-color:transparent;background:var(--c1e2735,#1e2735);
   padding-left:20px;padding-right:20px}
 #tabs[data-ftab="pestana"] .tab.sel,#tabs[data-fgrupo="pestana"] .grupo.abierto,
 #tabs[data-ftab="cortada"] .tab.sel,#tabs[data-fgrupo="cortada"] .grupo.abierto,
 #tabs[data-ftab="flecha"] .tab.sel,#tabs[data-fgrupo="flecha"] .grupo.abierto{
   background:var(--c28374f,#28374f)}
 #tabs[data-ftab="pestana"] .tab,#tabs[data-fgrupo="pestana"] .grupo{
   clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 100%,0 100%)}
 #tabs[data-ftab="cortada"] .tab,#tabs[data-fgrupo="cortada"] .grupo{
   clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
 #tabs[data-ftab="flecha"] .tab,#tabs[data-fgrupo="flecha"] .grupo{
   padding-right:26px;
   clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
 /* La caja que abraza al grupo acompaña a la forma de la pastilla. */
 #tabs[data-fgrupo="cuadrada"] #abrazo,#tabs[data-fgrupo="cortada"] #abrazo{border-radius:0}
 #tabs[data-fgrupo="pildora"] #abrazo{border-radius:20px 20px 0 0}
 #tabs[data-fgrupo="hoja"] #abrazo{border-radius:20px 6px 0 0}
 #tabs[data-fgrupo="arco"] #abrazo{border-radius:22px 22px 0 0}
 /* Un respiro entre grupos: pegados, la pastilla del siguiente parecía otra pestaña. */
 #tabs .grupo:not(:first-child){margin-left:14px}
 .grupo .flecha{font-size:10px;opacity:.75}
 /* Se arrastran para cambiarlas de orden, igual que las pestañas — y el grupo entero se
    va con su pastilla, con las charlas que tenga desplegadas adentro. */
 .grupo.moviendo{opacity:.42}
 .grupo:active{cursor:grabbing}
 .grupo .cuantas{opacity:.65;font-weight:400}
 .grupo .x{color:var(--c6b7280,#6b7280);margin-left:2px}
 .grupo .x:hover{color:var(--mal-txt)}
 /* Plegado, el grupo tiene que seguir avisando lo que pasa adentro: si no, la charla
    que te contestó queda escondida y el semáforo deja de servir justo cuando importa. */
 .grupo .bola{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
 .grupo.espera{color:var(--ok-txt);border-color:var(--ok-bd)}
 .grupo.espera .bola{background:var(--ok);animation:latir 1.4s infinite}
 .grupo.fallada{color:var(--mal-txt);border-color:var(--mal-bd)}
 .grupo.fallada .bola{background:var(--mal-txt)}
 .grupo.trabajando .bola{background:var(--aviso);animation:latir 1.4s infinite}
 /* ⭐ La columna de la izquierda tiene DOS pisos: arriba los proyectos (las carpetas
    del correo, la referencia Gmail de siempre) y abajo el EXPLORADOR de archivos del
    proyecto donde estás parado — pedido de Martín, 2026-08-17: "como Visual Studio".
    Cada piso con su propio scroll, si no el árbol le empuja la lista de proyectos
    fuera de la pantalla; y el ancho de la columna se arrastra del borde (`--lat`),
    que con rutas largas 250 px fijos no alcanzan. */
 main{flex:1;min-height:0;display:grid;grid-template-columns:var(--lat,272px) 1fr}
 aside{border-right:1px solid var(--c1b2130,#1b2130);background:var(--c0f1320,#0f1320);position:relative;
       display:flex;flex-direction:column;overflow:hidden}
 #paneProy{flex:0 0 auto;max-height:46%;overflow-y:auto;padding:14px 0 8px}
 /* ⭐⭐ La BARRA de desplazamiento de los dos pisos de la columna, a la vista y
    agarrable con el mouse (pedido de Martín, 2026-09-13: "en vez de un botón, quiero
    que sea la barra que desplaza"). Dibujarla a mano no es cosmético: la de fábrica de
    Chrome en Windows es del tipo que se esconde y aparece medio segundo al mover la
    rueda, así que la columna se veía cortada sin ningún indicio de que seguía abajo.
    Definiendo `::-webkit-scrollbar` la barra pasa a ser de las CLÁSICAS: ocupa su
    ancho, está siempre visible mientras haya algo que desplazar y se puede arrastrar.
    ⚠ El `border` transparente + `background-clip` es lo que deja un carril de 11 px
    para agarrar con el mouse y un pulgar fino de 5 px a la vista: sin eso, un pulgar
    cómodo de agarrar se ve como una franja gruesa al lado de las carpetas. */
 #paneProy::-webkit-scrollbar,#arbol::-webkit-scrollbar{width:11px}
 #paneProy::-webkit-scrollbar-track,#arbol::-webkit-scrollbar-track{background:transparent}
 #paneProy::-webkit-scrollbar-thumb,#arbol::-webkit-scrollbar-thumb{
       background:var(--c39445a,#39445a);border-radius:6px;
       border:3px solid transparent;background-clip:content-box}
 #paneProy::-webkit-scrollbar-thumb:hover,#arbol::-webkit-scrollbar-thumb:hover{
       background:var(--c5b6a84,#5b6a84);background-clip:content-box}
 #paneArch{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
           border-top:1px solid var(--c1b2130,#1b2130)}
 #arbol{flex:1;min-height:0;overflow:auto;padding-bottom:14px}
 /* Guardado: el explorador queda en una tira fina y los proyectos usan todo el alto. */
 body.arbol-plegado #paneArch{flex:0 0 auto}
 body.arbol-plegado #arbol{display:none}
 /* ⚠⚠ `max-height:none` A SOLAS dejaba la lista SIN NINGUN SCROLL (captura de Martín,
    2026-09-13: "me falta un botón para desplazarme en esta barra para abajo"). Sin tope
    y con `flex:0 0 auto`, el piso crece hasta el alto de sus 23 carpetas, el `aside` lo
    recorta con su `overflow:hidden` y el final —Escondidas y "＋ Agregar una carpeta"—
    queda INALCANZABLE: la rueda no lo mueve porque el que desborda es el aside, que no
    scrollea. Medido con el árbol plegado: pane de 984 px adentro de un aside de 809.
    Por eso van las tres juntas: toma el alto que sobra (`1 1 auto`), puede achicarse
    (`min-height:0`, si no el flex respeta el contenido y estamos igual) y ahí sí su
    `overflow-y:auto` scrollea. */
 body.arbol-plegado #paneProy{max-height:none;flex:1 1 auto;min-height:0}
 #tirador{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
 #tirador:hover{background:var(--acento);opacity:.45}
 /* ⭐ Ctrl+B (o el ◧ de arriba) esconde la columna ENTERA —los dos pisos—, como en VS
    Code: la conversación o el archivo que estás leyendo se quedan con toda la pantalla.
    El botón queda siempre a la vista, si no, escondida no habría con qué traerla de
    vuelta salvo acordándose del atajo (misma regla que la barra de la pizarra). */
 /* ⚠ Va UNA sola pista, no `0 1fr`: con la columna en `display:none` deja de ser un
    hijo de la grilla, y la conversación se acomodaba sola en la primera pista — la de
    ancho CERO. O sea, escondías la lateral y quedaba la pantalla en blanco. */
 body.lateral-oculto main{grid-template-columns:1fr}
 body.lateral-oculto aside{display:none}
 /* ⭐ Los interruptores de las barras, todos juntos a la izquierda: la columna, el menú
    de pantallas, la fila de conversaciones y las dos de una. Apagado, el botón queda
    tenue pero SIGUE ESTANDO — es con lo que se vuelve. */
 #barraArriba .izq{display:flex;align-items:center;padding-left:12px}
 .botBarra{flex:none;display:flex;align-items:center;justify-content:center;
           width:calc(26px * var(--ui,1));height:calc(24px * var(--ui,1));border-radius:7px;
           font-size:calc(14px * var(--ui,1));cursor:pointer;
           opacity:.55;transition:opacity .15s,background .15s}
 .botBarra:hover{opacity:1;background:var(--c1d2534,#1d2534)}
 .botBarra.off{opacity:.22}
 .botBarra.off:hover{opacity:.8}
 #btnLateral{font-size:15px}
 body.pleno #barraArriba,body.pleno #barra,body.sin-arriba #barraArriba{display:none}
 /* El botón de volver flota sobre la charla. Discreto, pero SIEMPRE visible: si
    apareciera solo al pasar el mouse, quien no sepa que está no lo encuentra nunca. */
 #salirPleno{display:none;position:fixed;top:9px;right:14px;z-index:80;
   width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;
   background:rgba(var(--c151b26-rgb,21,27,38),.82);border:1px solid var(--c2a3342,#2a3342);color:var(--c9aa6b5,#9aa6b5);cursor:pointer;
   font-size:14px;backdrop-filter:blur(calc(6px * var(--vidrio,1)))}
 #salirPleno:hover{color:var(--ce8ecf1,#e8ecf1);border-color:var(--c3a4658,#3a4658)}
 body.pleno #salirPleno,body.sin-arriba #salirPleno{display:flex}
 .rubro{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--c5c6675,#5c6675);
        margin:0 0 9px 18px;font-weight:700}
 /* ⭐ Las filas de la columna también siguen a `--ui` (2026-09-12): con veintitrés
    carpetas y el zoom arriba, la lista era lo primero que dejaba de entrar. */
 .carpeta{display:flex;align-items:center;gap:calc(10px * var(--ui,1));
          padding:calc(9px * var(--ui,1)) calc(18px * var(--ui,1));cursor:pointer;
          font-size:calc(13.5px * var(--ui,1));position:relative}
 .carpeta:hover{background:var(--c141a26,#141a26)}
 .carpeta .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .carpeta .num{color:var(--c5c6675,#5c6675);font-size:calc(11.5px * var(--ui,1))}
 /* La marca de "esta carpeta maneja un navegador": apagada, para que no le compita al
    nombre, que es lo único que se viene a leer acá. Nunca en rojo. */
 .carpeta .naveg{flex:none;font-size:10px;opacity:.5;line-height:1}
 .carpeta.sel{background:var(--c16233a,#16233a);color:var(--c8ecbff,#8ecbff);border-radius:0 999px 999px 0;
              margin-right:14px;font-weight:600}
 /* --- ⭐ Mover las carpetas y sacarlas (pedido de Martín, 2026-08-18) -------------
    ⚠⚠ Se arrastra la FILA ENTERA, no un agarre al costado (segunda vuelta del pedido:
    "no me gusta tener que agarrar el costado, tendría que poder seleccionar la carpeta
    entera y así moverla"). Hubo un ⠿ y se sacó. Que la misma fila sea el clic que ENTRA
    y el agarre que MUEVE se resuelve con un umbral de movimiento, no con dos zonas:
    ver `arrancarArrastreCarpeta`. */
 .carpeta .sacar{flex:none;width:17px;height:17px;display:flex;align-items:center;
                 justify-content:center;border-radius:5px;color:var(--c5c6675,#5c6675);font-size:12px;
                 opacity:0;transition:opacity .14s,background .14s,color .14s}
 .carpeta:hover .sacar{opacity:.7}
 .carpeta .sacar:hover{opacity:1;background:var(--c2a2036,#2a2036);color:var(--cc9a6e8,#c9a6e8)}
 /* El número se corre cuando aparece la ✕, así no bailan las dos en el mismo lugar. */
 .carpeta:hover .num{display:none}
 /* ⭐⭐ La animación de mover. La que se arrastra se levanta (sombra y un pelo más
    grande) y las demás se acomodan SOLAS con una transición de posición — es la
    técnica FLIP: se mide dónde estaba cada una, se rearma la lista, se mide dónde
    quedó, y se la manda de vuelta al lugar viejo para soltarla enseguida. Sin eso el
    reordenado es un salto seco y no se entiende qué se movió. */
 .carpeta.deslizando{opacity:.9;background:var(--c1a2333,#1a2333);box-shadow:var(--sombra-2);
                     border-radius:9px;transform:scale(1.02);z-index:6;cursor:grabbing}
 .carpeta.acomodando{transition:transform .22s cubic-bezier(.2,.9,.3,1)}
 /* Hueco donde va a caer: una línea fina, como el cursor de texto entre dos renglones. */
 .carpeta.hueco-arriba::before,.carpeta.hueco-abajo::after{content:'';position:absolute;
   left:14px;right:14px;height:2px;border-radius:2px;background:var(--acento,var(--c8ecbff,#8ecbff))}
 .carpeta.hueco-arriba::before{top:-1px}
 .carpeta.hueco-abajo::after{bottom:-1px}
 /* Sacarla: se desvanece y la lista se cierra sola sobre el hueco. */
 @keyframes carpetaSeVa{
   from{opacity:1;transform:none}
   40%{opacity:0;transform:translateX(-22px)}
   to{opacity:0;transform:translateX(-22px);height:0;padding-top:0;padding-bottom:0}
 }
 .carpeta.se-va{animation:carpetaSeVa .3s cubic-bezier(.4,0,.6,1) forwards;
                overflow:hidden;pointer-events:none}
 /* Y al volver, entra por donde se fue. */
 @keyframes carpetaVuelve{from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:none}}
 .carpeta.vuelve{animation:carpetaVuelve .26s ease-out}
 /* Las escondidas: un renglón discreto al pie, con las que sacaste. Es el único
    camino de vuelta, así que tiene que estar SIEMPRE que haya alguna escondida —
    una lista que se desarma sin poder rearmarse es una trampa. */
 .carpeta.guardadas{color:var(--c7d8592,#7d8592);font-size:12.5px;border-top:1px solid var(--c1b2130,#1b2130);
                    margin-top:6px;padding-top:11px}
 .carpeta.guardadas:hover{color:var(--cc9d2de,#c9d2de)}
 .carpeta.devolver{padding-left:30px;color:var(--c8b93a1,#8b93a1);font-size:12.5px}
 .carpeta.devolver .vol{flex:none;color:var(--c5c6675,#5c6675);font-size:12px}
 .carpeta.devolver:hover .vol{color:var(--acento,var(--c8ecbff,#8ecbff))}
 /* --- ⭐ La identidad visual de cada carpeta (2026-08-18) ------------------------
    Pintada, la carpeta lleva su color propio. ⚠ El color va en el `style` del
    elemento, así que le gana a la marca de "estás parado acá" (`.sel`): por eso una
    carpeta pintada Y seleccionada se distingue por la BARRITA de la izquierda, que
    no se pinta nunca — misma solución que el puntito de las pestañas. */
 .carpeta.pintada{border-radius:0 999px 999px 0;margin-right:14px}
 .carpeta.pintada.sel::after{content:'';position:absolute;left:0;top:6px;bottom:6px;
   width:3px;border-radius:0 3px 3px 0;background:currentColor}
 /* Con ícono propio se pierde el 📂/📁 que contaba si el proyecto tiene algo vivo:
    ese estado pasa a un puntito, que no se pinta (la misma regla del semáforo). */
 .carpeta .vive{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c5eead4,#5eead4);
                opacity:.85}
 #buscar{width:calc(100% - 28px);margin:0 14px 10px;padding:7px 11px;border-radius:9px;
         border:1px solid var(--c232a35,#232a35);background:var(--c151b26,#151b26);color:var(--ce8ecf1,#e8ecf1);font-size:13px}
 #buscar::placeholder{color:var(--c5c6675,#5c6675)}
 .carpeta.sumar{color:var(--c8ecbff,#8ecbff);margin-top:8px;border-top:1px solid var(--c1b2130,#1b2130);padding-top:13px}
 section{overflow-y:auto;padding:16px 22px}
 .cabeza{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
 .cabeza b{font-size:19px} .cabeza small{color:var(--c7c8797,#7c8797)}
 .cabeza #filtro{margin-left:auto;padding:7px 12px;border-radius:9px;border:1px solid var(--c232a35,#232a35);
                 background:var(--c151b26,#151b26);color:var(--ce8ecf1,#e8ecf1);font-size:13px;width:230px}
 .cabeza #filtro::placeholder{color:var(--c5c6675,#5c6675)}
 .dedonde{font-size:11px;color:var(--c7c8797,#7c8797);font-weight:400;background:var(--c1a2130,#1a2130);padding:2px 7px;
          border-radius:999px;margin-left:7px}
 /* ⭐ LA CHAPA DE BORRADOR (pedido de Martín, 2026-08-18: "quiero que lo que yo escriba
    dentro de una sesión quede guardado como borrador y se pueda ver en todas, con una
    señalización que diga que está en borrador, que tenga un color y una animación").
    Es el borrador del correo: escribiste media frase, te fuiste, y la conversación queda
    marcada en la bandeja hasta que la mandes.
    ⚠⚠ El color es LAVANDA y no toca el semáforo: verde, amarillo y rojo dicen en qué anda
    la CONVERSACIÓN (te espera, trabaja, falló) y un borrador no es un estado de ella —
    es algo tuyo que quedó a medio escribir. Por eso va como chapa al lado del título y
    NO pintando la fila: el borde izquierdo de la fila lo sigue mandando el semáforo, que
    es el idioma de esta pantalla.
    ⚠ La animación es un respiro lento (2,6 s) y solo del aro: la bandeja puede tener
    veinte borradores y veinte cosas parpadeando rápido serían una calesita. */
 .borra{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
        color:var(--cc4b5fd,#c4b5fd);background:var(--c241d3a,#241d3a);border:1px solid var(--c4d3d7a,#4d3d7a);border-radius:999px;
        padding:2px 8px;margin-left:7px;white-space:nowrap;vertical-align:middle;
        animation:borradorRespira 2.6s ease-in-out infinite}
 @keyframes borradorRespira{0%,100%{box-shadow:0 0 0 0 rgba(var(--cc4b5fd-rgb,196,181,253),0);
                                    border-color:var(--c4d3d7a,#4d3d7a)}
                            50%{box-shadow:0 0 0 3px rgba(var(--cc4b5fd-rgb,196,181,253),.13);
                                border-color:var(--c7c69bd,#7c69bd)}}
 /* La plumita late aparte, más marcada: es lo que se ve de reojo con la lista quieta. */
 .borra .plu{animation:latir 2.6s ease-in-out infinite}
 /* Lo que dejaste escrito, en el renglón de abajo: es justo lo que uno viene a recordar
    (si no, "Borrador" a secas obliga a entrar para saber de qué). */
 .baj .bpre{color:var(--ca99ae0,#a99ae0);font-style:italic}
 /* Y en la pestaña de arriba la misma señal en chiquito: ahí la chapa entera no entra. */
 .tab .plu{color:var(--cc4b5fd,#c4b5fd);font-size:11px;margin-right:5px;
           animation:latir 2.6s ease-in-out infinite}
 /* Entrar y salir de las archivadas. Va en la cabecera, al lado del contador. */
 .op-arch{margin-left:8px;font-size:12px;color:var(--c7d8a9b,#7d8a9b);background:var(--c151b26,#151b26);
          border:1px solid var(--c232a35,#232a35);border-radius:9px;padding:5px 11px;cursor:pointer;
          white-space:nowrap}
 .op-arch:hover{color:var(--acento);border-color:var(--acento)}

 .devolver{flex:none;font-size:12px;color:var(--acento);background:var(--c141d2b,#141d2b);
           border:1px solid var(--c24354b,#24354b);border-radius:9px;padding:6px 11px;white-space:nowrap}
 .devolver:hover{background:var(--c1b2942,#1b2942)}
 .correo{display:flex;align-items:center;gap:14px;padding:12px 8px;cursor:pointer;

 .correo:hover{background:var(--c131924,#131924)}
 /* ⭐⭐ Los tres colores, elegidos por Martín el 2026-08-17. Es un semáforo y se lee

    falló (frená y mirá). Antes el verde era "trabajando" y se probó violeta para la

 .correo.espera{border-left:3px solid var(--ok);background:var(--c101c16,#101c16)}
 .correo.espera .tit{color:var(--ok-txt)}
 .correo.espera .baj b{color:var(--ok);font-weight:600}

 .correo.trabajando .baj b{color:var(--aviso);font-weight:600}
 .correo.fallada{border-left:3px solid var(--mal);background:var(--c1e1214,#1e1214)}
 .correo.fallada .tit{color:var(--mal-txt)}
 .correo.fallada .baj b{color:var(--mal-txt);font-weight:600}
 .ini{width:36px;height:36px;border-radius:50%;background:var(--c22304a,#22304a);color:var(--c8ecbff,#8ecbff);flex:none;
      display:flex;align-items:center;justify-content:center;font-weight:700}
 .ini.viva{background:var(--c2b2109,#2b2109);color:var(--aviso-txt);box-shadow:0 0 0 2px var(--aviso-bd)}
 .ini.mas{background:var(--c14304a,#14304a)}
 .med{flex:1;min-width:0}
 .tit{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .baj{color:var(--c7c8797,#7c8797);font-size:12.5px}
 .lapiz{color:var(--c5c6675,#5c6675);padding:4px 8px} .lapiz:hover{color:var(--c8ecbff,#8ecbff)}
 /* El ▾ de cada carpeta y las últimas conversaciones que muestra. */
 .lapiz.despl{font-size:12.5px;color:var(--c7d8a9b,#7d8a9b);background:var(--c141a26,#141a26);border-radius:8px;padding:5px 9px}
 .lapiz.despl:hover{background:var(--c1a2536,#1a2536);color:var(--ccfe6ff,#cfe6ff)}
 .ultimas{margin:2px 0 8px 50px;padding-left:11px;border-left:2px solid var(--c1e2634,#1e2634)}
 .ult{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
      cursor:pointer;font-size:13px;color:var(--cc3ccd9,#c3ccd9)}
 .ult:hover{background:var(--c131924,#131924);color:var(--ce8ecf1,#e8ecf1)}
 .ult .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ult .cuando{color:var(--c5c6675,#5c6675);font-size:11.5px;white-space:nowrap}
 .ult .pto{width:7px;height:7px;border-radius:50%;background:var(--c3a4557,#3a4557);flex:none}
 .ult .pto.viva{background:var(--aviso)}
 #hilo{display:flex;flex-direction:column;gap:11px;padding-bottom:12px}
 /* Entrar a una pestaña: la charla aparece con un desvanecido corto en vez de golpe. */
 @keyframes entrar{from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none}}
 #hilo.entrando{animation:entrar .18s ease-out}
 /* ⭐ El tamaño sale del 🎨 (`--escala`, en /estaticos/aspecto.js): es un MULTIPLICADOR,

 .msg{padding:9px 13px;border-radius:13px;max-width:min(760px,80%);white-space:pre-wrap;

 .msg img{width:auto;height:auto;max-width:min(420px,100%);max-height:min(360px,55vh);

 /* La burbuja de "pensando" tiene que MOVERSE: quieta no se distingue de una respuesta

 .msg.pensa{display:flex;align-items:center;gap:9px;color:var(--c8b95a6,#8b95a6);font-size:13px;

 .pregunta .pNota{font-size:11.5px;color:var(--c6e7889,#6e7889)}
 .tab .viva.late{animation:pulso 1.2s infinite ease-in-out}
 @keyframes pulso{0%,100%{opacity:.28}50%{opacity:1}}
 /* ⭐ La pregunta con opciones (AskUserQuestion): cuando la sesión pregunta algo con

 .pregunta{align-self:flex-start;max-width:min(760px,86%);background:var(--burbuja-ia);
       border-left:3px solid var(--acento,var(--c8ecbff,#8ecbff));border-radius:13px;
       border-bottom-left-radius:4px;padding:11px 14px;
       font-size:calc(13.6px * var(--escala,1));line-height:1.5}
 .pregunta .pTit{display:inline-block;font-size:10.5px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--acento,var(--c8ecbff,#8ecbff));
       background:var(--acento-bg,var(--c16233a,#16233a));border-radius:999px;padding:2px 9px;
       margin-bottom:7px;font-weight:700}
 .pregunta .pBloque{margin-bottom:12px}
 .pregunta .pBloque:last-of-type{margin-bottom:4px}
 .pregunta .pPreg{font-weight:600;margin-bottom:9px}
 .pregunta .pOps{display:flex;flex-direction:column;gap:7px}
 .pregunta .pOp{text-align:left;background:var(--c151b26,#151b26);border:1px solid var(--c232a35,#232a35);
       color:var(--cc9d2de,#c9d2de);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;
       font-size:13px;line-height:1.4;transition:border-color .15s,background .15s}
 .pregunta .pOp:hover{border-color:var(--acento,var(--c8ecbff,#8ecbff))}
 .pregunta .pOp.puesta{background:var(--acento-bg,var(--c16233a,#16233a));
       border-color:var(--acento,var(--c8ecbff,#8ecbff))}
 .pregunta .pOp b{display:block;color:var(--ce8ecf1,#e8ecf1)}
 .pregunta .pOp.puesta b{color:var(--acento,var(--c8ecbff,#8ecbff))}
 .pregunta .pOp span{display:block;color:var(--c7d8a9b,#7d8a9b);font-size:12px;margin-top:2px}
 .pregunta .pOtra{display:flex;gap:7px;margin-top:8px}
 .pregunta .pOtra input{flex:1;background:var(--c151b26,#151b26);border:1px solid var(--c232a35,#232a35);
       border-radius:9px;color:var(--ce8ecf1,#e8ecf1);padding:7px 11px;font:inherit;font-size:13px}
 .pregunta .pOtra input::placeholder{color:var(--c5c6675,#5c6675)}
 .pregunta .pManda,.pregunta .pMandar{background:var(--acento-bg,var(--c16233a,#16233a));
       color:var(--acento,var(--c8ecbff,#8ecbff));border:0;border-radius:9px;padding:7px 14px;
       font:inherit;font-size:13px;font-weight:600;cursor:pointer}
 .pregunta .pMandar{margin-top:10px}
 .pregunta .pNota{color:var(--c7d8a9b,#7d8a9b);font-size:11.5px;margin-top:9px}
 /* El plan propuesto (plan mode, 2026-08-20): puede ser largo, así que tiene su
    propio scroll para que los botones de decidir queden siempre a la vista. */
 .pregunta .pPlan{max-height:48vh;overflow:auto;margin-bottom:10px;padding:9px 12px;
       background:var(--c0d131c,#0d131c);border:1px solid var(--c232a35,#232a35);border-radius:10px}
 /* ⭐ La lista de tareas de la sesión (TodoWrite, 2026-08-20): lo que el agente se
    anotó para hacer y va tildando mientras trabaja, en vivo. Informa, no pide
    nada: tonos apagados, y solo la fila en curso lleva el acento. */
 .tareas{align-self:flex-start;max-width:min(760px,86%);background:var(--c0f141d,#0f141d);
         border:1px solid var(--c232a35,#232a35);border-radius:13px;border-bottom-left-radius:4px;
         padding:10px 14px;font-size:13px;line-height:1.5;margin:6px 0}
 .tareas .tTit{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--c7d8a9b,#7d8a9b);font-weight:700;margin-bottom:6px}
 .tareas .tTit span{color:var(--c8ecbff,#8ecbff);margin-left:6px;letter-spacing:0}
 .tareas .tFila{display:flex;gap:8px;align-items:baseline;color:var(--cc9d2de,#c9d2de);padding:2px 0}
 .tareas .tFila .tIco{flex:none;width:16px;text-align:center;color:var(--c5c6675,#5c6675)}
 .tareas .tFila.hecha{color:var(--c6e7889,#6e7889)}
 .tareas .tFila.hecha .tIco{color:var(--ok-txt)}
 .tareas .tFila.haciendo{color:var(--ce8ecf1,#e8ecf1);font-weight:600}
 .tareas .tFila.haciendo .tIco{color:var(--acento,var(--c8ecbff,#8ecbff))}
 /* ⭐⭐ `align-items:flex-end` NO es cosmético: es lo que hace que al pegar un texto largo
    crezca SOLO la caja de escribir y los botones se queden quietos, apoyados en la misma
    línea de abajo (pedido de Martín, 2026-08-25, con una captura de la barra deformada).
    Sin esto la fila queda en `stretch` y pasan tres cosas feas a la vez: Enviar se estira
    en una plancha verde de 130 px, "Subir imagen"/"Buscar archivo" (que tienen alto fijo)
    se trepan ARRIBA de todo, y los que tenían `align-self:center` flotan en el medio —
    tres alturas distintas en una sola fila. Por eso los `align-self:center` de acá abajo
    se sacaron: pisaban esta regla. Se mide en `pruebas/ver_caja_crece_compu.py`. */
 /* ⭐⭐ `flex-wrap` + el `min-width` de abajo son el arreglo del ZOOM (Martín, 2026-08-25,
    con una captura al 110 %): la caja de escribir había quedado en 28 px de ancho, una
    rendija donde solo se veía la barra de scroll — y encima alta, porque cualquier frase
    metida en 28 px se parte en treinta renglones. La razón es que los botones no se
    achican y la caja era el único elástico de la fila: TODO el recorte lo pagaba ella.
    Con esto, cuando no entra, los botones del final se van a un segundo renglón (pegados
    a la derecha por el `justify-content`) en vez de comerse el lugar de escribir.
    Se mide en `pruebas/ver_caja_zoom.py`, a los anchos que le dan sus zooms. */
 /* ⭐⭐ `--ui` es el tamaño de los CONTROLES (2026-09-12, pedido de Martín: "me gustaría
    poder encoger más los botones de la interfaz, o que queden en un tamaño fijo cuando
    llego a cierto grado de zoom"). Sale del 🎨 (`aspecto.js`), es un MULTIPLICADOR igual
    que `--escala`, y sin elegir nada vale 1: la barra queda exactamente como estaba.
    ⚠ `--bh` es el alto de toda la fila y se define UNA vez acá, en el padre de todos:
    antes el 38 estaba escrito en seis reglas distintas y bastaba olvidarse de una para
    que un botón quedara más alto que sus vecinos. */
 .caja{--bh:calc(38px * var(--ui,1));
       display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end;
       gap:calc(9px * var(--ui,1));padding:calc(12px * var(--ui,1)) calc(22px * var(--ui,1));
       border-top:1px solid var(--c1b2130,#1b2130);background:var(--c0f1320,#0f1320);flex:none}
 /* El `flex-basis` es el ancho que la caja PIDE (si sobra lugar crece hasta llenar la
    fila, como antes); el `min-width` es el que no negocia ni con el zoom más bruto.
    ⚠ El `min-width` SÍ sigue a `--ui`: achicando los botones se gana lugar, y si la caja
    siguiera pidiendo 280 px fijos la fila se partiría igual que antes. */
 .caja textarea{flex:1 1 420px;min-width:calc(280px * var(--ui,1));
       background:var(--c151b26,#151b26);border:1px solid var(--c232a35,#232a35);border-radius:11px;
       color:var(--ce8ecf1,#e8ecf1);padding:calc(11px * var(--ui,1)) calc(13px * var(--ui,1));
       font:calc(14px * var(--ui,1))/1.45 inherit;resize:none;max-height:calc(130px * var(--ui,1))}
 /* ⚠ El alto va acá y no en cada botón: sin `stretch` que los infle, un botón sin alto
    propio se encoge al tamaño de su letra. */
 .caja button{height:var(--bh);padding:0 calc(20px * var(--ui,1));border-radius:11px;border:0;background:var(--c14304a,#14304a);
       color:var(--c8ecbff,#8ecbff);font-size:calc(14px * var(--ui,1));font-weight:600;cursor:pointer}
 .caja button.clip{padding:0 calc(14px * var(--ui,1));background:var(--c151b26,#151b26);font-size:calc(17px * var(--ui,1))}
 .caja button.archivo-accion{height:var(--bh);padding:0 calc(12px * var(--ui,1));background:var(--c151b26,#151b26);color:var(--c9aa4b3,#9aa4b3);
       border:1px solid var(--c232a35,#232a35);font-size:calc(12px * var(--ui,1));font-weight:500;white-space:nowrap}
 .caja button.archivo-accion:hover{background:var(--c1b2230,#1b2230);color:var(--cc9d2de,#c9d2de)}
 /* Una categoría = un bloque pegado. La separación chica adentro (3 px) contra la
    grande de la fila (9 px) es lo que los hace leer como UNA sola cosa.
    ⚠ Se llama `grupo-iconos` y no `grupo` porque `.grupo` YA existe en esta pantalla:
    es la píldora que agrupa las pestañas por proyecto, con su fondo, su borde y su
    `align-items:center`. Con ese nombre, la fila de iconos se comía ese estilo y
    quedaba 14 px más alta que el resto (medido). */
 .caja .grupo-iconos{display:inline-flex;align-items:flex-end;gap:calc(3px * var(--ui,1))}
 /* Rojo apagado: es un freno, no un botón que uno quiera apretar de paso. */
 .caja button.parar{background:var(--mal-bg);color:var(--mal-txt);font-weight:600}
 .caja button.parar:hover{background:var(--mal-bd)}
 /* ⭐ El modelo de ESTA sesión y el botón de compactarla (2026-08-18). Van apagados a
    propósito: son la herramienta, no la acción — lo que uno viene a hacer acá es
    escribir. El selector se pinta cuando NO está en el de fábrica, que es la única vez
    que importa saber con qué está corriendo. */
 /* ⚠⚠ `appearance:none` NO es cosmético acá: en Windows el <select> nativo ignora el
    fondo y queda BLANCO adentro de una barra oscura, y además se estira a lo alto de
    la fila flex — se vio el 2026-08-18 como una caja blanca vacía al lado de Enviar.
    Con la apariencia apagada hay que dibujarle la flecha, que va de fondo. */
 .caja select.modelo{appearance:none;-webkit-appearance:none;
       height:var(--bh);background:var(--c151b26,#151b26) no-repeat right 9px center/9px 6px;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 6'><path d='M0 0h9L4.5 6z' fill='%237d8798'/></svg>");
       border:1px solid var(--c232a35,#232a35);border-radius:11px;color:var(--c9aa4b3,#9aa4b3);
       padding:0 calc(24px * var(--ui,1)) 0 calc(10px * var(--ui,1));
       font:calc(12.5px * var(--ui,1)) inherit;cursor:pointer;max-width:calc(170px * var(--ui,1))}
 .caja select.modelo.puesto{color:var(--c8ecbff,#8ecbff);border-color:var(--c25435e,#25435e)}
 /* ⭐ La chapita de "esta charla es de Codex" (2026-08-19). Verde suave, no rojo:
    es un estado normal, no una alarma — misma regla que el selector del panel. */
 .cer{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;
      background:var(--c12261c,#12261c);border:1px solid var(--ok-bd);color:var(--ok-txt);
      font-size:10.5px;line-height:16px;vertical-align:1px}
 .tab .cer{margin-left:4px;line-height:14px;font-size:9.5px}
 /* La chapa de "esta charla se compactó y sigue en otra" (2026-08-20). Apagada, no es
    alarma: informa cuál es la vieja. Se toca para saltar a la continuación. */
 .sigue{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;
        background:var(--c161b22,#161b22);border:1px solid var(--c333b49,#333b49);color:var(--c8b96a5,#8b96a5);
        font-size:10.5px;line-height:16px;vertical-align:1px;cursor:pointer}
 .sigue:hover{color:var(--cc9d2de,#c9d2de);border-color:var(--c4a5568,#4a5568)}
 /* Las opciones del desplegable las dibuja Windows: sin esto son texto claro sobre
    fondo claro y no se lee ninguna. */
 .caja select.modelo option{background:var(--c151b26,#151b26);color:var(--ce8ecf1,#e8ecf1)}
 /* Modelo, esfuerzo y modo/velocidad viven detrás de un solo botón: son ajustes de
    una misma sesión y separados ocupaban media barra. El panel abre hacia arriba para
    no tapar la caja de escritura. */
 .ajustes-modelo{position:relative;display:inline-flex}
 .caja button.ajustes-modelo-boton{height:var(--bh);max-width:calc(250px * var(--ui,1));
       padding:0 calc(28px * var(--ui,1)) 0 calc(12px * var(--ui,1));
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
       background:var(--c151b26,#151b26);color:var(--c9aa4b3,#9aa4b3);border:1px solid var(--c232a35,#232a35);font-size:calc(12.5px * var(--ui,1));
       font-weight:500;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 6'><path d='M0 0h9L4.5 6z' fill='%237d8798'/></svg>");
       background-repeat:no-repeat;background-position:right 10px center;background-size:9px 6px}
 .caja button.ajustes-modelo-boton.puesto{color:var(--c8ecbff,#8ecbff);border-color:var(--c25435e,#25435e)}
 .caja button.ajustes-modelo-boton:hover{background-color:var(--c1b2230,#1b2230);color:var(--cc9d2de,#c9d2de)}
 .ajustes-modelo-menu{display:none;position:absolute;right:0;bottom:46px;z-index:30;
       min-width:230px;padding:10px;background:var(--c111722,#111722);border:1px solid var(--c2b3443,#2b3443);
       border-radius:12px;box-shadow:var(--sombra-3)}
 .ajustes-modelo.abierto .ajustes-modelo-menu{display:grid;gap:8px}
 .ajustes-modelo-menu label{display:grid;gap:4px;color:var(--c778295,#778295);font-size:10.5px}
 .ajustes-modelo-menu label:has(select[style*="display: none"]){display:none}
 .ajustes-modelo-menu select.modelo{display:block;width:100%;max-width:none}
 /* Las acciones van abajo de las perillas y detrás de una línea: las perillas cambian
    cómo corre la charla, esto le HACE algo. */
 .menu-acciones{display:grid;gap:8px;margin-top:2px;padding-top:9px;
       border-top:1px solid var(--c232b38,#232b38)}
 .menu-acciones:empty,.menu-acciones.vacio{display:none}
 .ajustes-modelo-menu .menu-acciones button{width:100%;text-align:left}
 .caja button.compactar{height:var(--bh);padding:0 calc(13px * var(--ui,1));background:var(--c151b26,#151b26);
       color:var(--c9aa4b3,#9aa4b3);font-size:calc(13px * var(--ui,1));font-weight:500;border:1px solid var(--c232a35,#232a35)}
 .caja button.compactar:hover{background:var(--c1b2230,#1b2230);color:var(--cc9d2de,#c9d2de)}
 /* "Avisame": la misma cara apagada que Compactar, y encendido en ámbar cuando está
    puesto. Es una opción secundaria del envío, no un botón principal — y el ámbar es
    el mismo que usa el celular, que ya lo tenía desde antes (2026-08-25). */
 .caja button.avisar{height:var(--bh);padding:0 calc(13px * var(--ui,1));background:var(--c151b26,#151b26);
       color:var(--c9aa4b3,#9aa4b3);font-size:calc(13px * var(--ui,1));font-weight:500;border:1px solid var(--c232a35,#232a35)}
 .caja button.avisar:hover{background:var(--c1b2230,#1b2230);color:var(--cc9d2de,#c9d2de)}
 .caja button.avisar.sel{background:var(--aviso-bg);color:var(--aviso-txt);border-color:var(--aviso-bd)}
 /* ⭐ Los botones de un solo dibujito (2026-08-25, "sería mejor que se compacten por
    categoría"): cuadrados y sin texto. El nombre entero vive en el `title`, que es lo
    que sale en el globito — sin eso no hay forma de saber qué hace cada uno.
    ⚠ Va DESPUÉS de `.avisar` y `.archivo-accion` a propósito: pesan lo mismo, así que
    el que manda es el último que aparece. Si se mueve para arriba, el 🔔 vuelve a
    tener el ancho del texto viejo. */
 .caja button.icono{width:var(--bh);padding:0;font-size:calc(15px * var(--ui,1));text-align:center;
       line-height:1}
 .caja button.compactar.pide{background:var(--aviso-bg);color:var(--aviso-txt)}
 /* Encendido cuando de verdad conviene compactar, apagado el resto del tiempo. */
 .caja button.compactar.conviene{background:var(--aviso-bg);color:var(--aviso-txt)}
 /* Cuánto arrastra la charla en cada mensaje. Los tres tonos son suaves a propósito:
    esto informa, no reta. El rojo queda para lo que está roto. */
 /* Con alto de botón (y la letra centrada adentro) para que apoye en la misma línea que
    el resto de la fila, en vez de quedar una pastilla más baja colgando. */
 .caja .ctx{display:inline-flex;align-items:center;height:var(--bh);padding:0 calc(9px * var(--ui,1));
       border-radius:9px;background:var(--c151b26,#151b26);
       color:var(--c6e7889,#6e7889);font-size:calc(11.6px * var(--ui,1));border:1px solid var(--c232a35,#232a35);white-space:nowrap}
 .caja .ctx.medio{color:var(--aviso-txt);border-color:var(--aviso-bg)}
 .caja .ctx.mucho{color:var(--aviso-txt);background:var(--aviso-bg);border-color:var(--aviso-bd)}
 /* Las imágenes elegidas se ven ANTES de mandarlas, con su cruz para sacarlas. */
 #chapas{display:none;gap:9px;padding:10px 22px 0;background:var(--c0f1320,#0f1320);overflow-x:auto;flex:none}
 #chapas.hay{display:flex}
 #chapas .chapa{position:relative;flex:0 0 auto}
 #chapas img{height:66px;border-radius:9px;display:block}
 #chapas .x{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;
            background:var(--mal-bg);color:var(--mal-txt);font-size:12px;display:flex;align-items:center;
            justify-content:center;border:1px solid var(--mal-bd);cursor:pointer}
 .aviso{background:var(--aviso-bg);color:var(--aviso-txt);padding:10px 14px;border-radius:10px;font-size:13px;
        margin-bottom:14px}
 /* La costura de una compactada: una rayita en el hilo, no un cartel (2026-08-20). */
 .marcaHilo{display:flex;align-items:center;gap:10px;color:var(--c7d879a,#7d879a);font-size:12px;
            margin:16px 0;text-align:center}
 .marcaHilo::before,.marcaHilo::after{content:'';flex:1;border-top:1px solid var(--c2a3242,#2a3242)}
 /* El rastro: lo que la sesión va HACIENDO. ⚠⚠ Va en un BLOQUE con fondo propio y no
    como renglones sueltos: la pantalla tiene foto de fondo, y sin superficie el texto
    apagado cae sobre la foto y no se lee (probado en pantalla el 2026-08-28 — quedaba
    invisible sobre una roca). Todo lo demás acá vive en una burbuja; esto también. */
 .pasos{background:var(--rastro-bg,rgba(var(--c10151e-rgb,16,21,30),.72));
        border:1px solid var(--rastro-borde,var(--c232b3a,#232b3a));border-radius:10px;
        padding:8px 12px;margin:6px 0;max-width:min(760px,92%);
        backdrop-filter:blur(calc(3px * var(--vidrio,1)))}
 /* ⚠⚠ Los pasos van EN LÍNEA, separados por un punto, no uno abajo del otro. Juntar los
    repetidos no alcanzaba: en una tanda real casi nunca están pegados (clic, mirar, clic,
    mirar), así que sesenta renglones seguían siendo una pared que tapaba la conversación.
    Como párrafo, esos mismos sesenta pasos entran en cinco o seis líneas y se leen de
    corrido, que es como uno los cuenta: "miró, hizo clic, escribió tal cosa". */
 .paso{color:var(--rastro,var(--c93a0b4,#93a0b4));font-size:12px;line-height:1.7;display:inline;
       overflow-wrap:anywhere}
 .paso + .paso::before{content:' · ';color:var(--c5a657a,#5a657a)}
 .pasos + .msg{margin-top:10px}
 /* La pregunta de compactar, adentro del hilo. Ámbar como el botón "conviene". */
 .pideComp{background:var(--aviso-bg);color:var(--aviso-txt);padding:12px 15px;border-radius:10px;
           font-size:13px;margin:10px 0;line-height:1.5}
 .pideComp .botones{display:flex;gap:8px;margin-top:9px}
 .pideComp button{height:32px;padding:0 13px;border:none;border-radius:8px;cursor:pointer;
                  background:var(--aviso-txt);color:var(--c241f08,#241f08);font-weight:600;font-size:13px}
 .pideComp button.despues{background:var(--c151b26,#151b26);color:var(--c9aa3b2,#9aa3b2);font-weight:400}
 .vacio{color:var(--c616977,#616977);text-align:center;margin-top:60px}
 .choque{background:var(--mal-bg);border:1px solid var(--mal-bd);color:var(--mal-txt);padding:11px 15px;
         border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5}
 .choque b{color:var(--mal-txt)}

 /* --- El explorador de archivos (columna izquierda, piso de abajo) -------------
    Un árbol como el de VS Code: las carpetas primero, se abren con ▸/▾ y los hijos
    se piden RECIÉN al abrirlas (un proyecto de verdad tiene miles de archivos y casi
    ninguno se va a mirar). Tocar un archivo lo abre a la derecha. */
 .rubro.cab{display:flex;align-items:center;gap:8px;margin:11px 12px 7px 18px}
 .rubro.cab .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                 text-transform:none;letter-spacing:.02em;font-size:11.5px;color:var(--c7c8797,#7c8797)}
 .rubro.cab .bot{cursor:pointer;color:var(--c5c6675,#5c6675);font-size:12px;letter-spacing:0;font-weight:400}
 .rubro.cab .bot:hover{color:var(--acento)}
 .nodo{display:flex;align-items:center;gap:calc(6px * var(--ui,1));
       padding:calc(3px * var(--ui,1)) calc(8px * var(--ui,1)) calc(3px * var(--ui,1)) 0;cursor:pointer;
       font-size:calc(13px * var(--ui,1));color:var(--cc3ccd9,#c3ccd9);white-space:nowrap}
 .nodo:hover{background:var(--c141a26,#141a26)}

 /* ⚠ La flechita de abrir la carpeta a 9 px y en gris oscuro no se veía en la captura:
