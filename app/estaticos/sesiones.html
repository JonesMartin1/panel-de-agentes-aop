                            sid: t.sid.startsWith('nueva-') ? '' : t.sid,
                            aprobar: !!aprobar, comentario: comentario || ''})})).json();
  } catch(e){}
  // Aprobado, la sesión ya salió de plan mode: el selector tiene que decirlo.
  if (aprobar && !t.sid.startsWith('nueva-')){ modoDe[t.sid] = ''; pintarModelo(); }
  // ⭐ Codex: el turno que dejó el plan ya terminó, así que no hay a quién contestarle
  // y la decisión viaja como el mensaje siguiente. Lo manda `mandar()` para no
  // duplicar nada de lo que ese camino ya resuelve (ocupada, Parar, hilo en vivo).
  if (r && r.ok && r.mandar){ pintarSesion(); mandar(r.mandar); return; }
  pintarSesion();
}

// El hilo se rearma entero cada 3 s: lo marcado y lo tipeado viven acá afuera y se
// vuelven a poner después de cada repintado (misma familia que las marcas de texto).
function guardarPregunta(c){
  const est = {textos: {}, foco: null};
  c.querySelectorAll('.pregunta .pOtra input').forEach(i => {
    if (i.value) est.textos[i.dataset.q] = i.value;
    if (document.activeElement === i) est.foco = i.dataset.q;
  });
  return est;
}

function restaurarPregunta(c, est){
  c.querySelectorAll('.pregunta .pOp').forEach(b => {
    if ((pregElecciones[b.dataset.q] || []).includes(+b.dataset.o)) b.classList.add('puesta');
  });
  if (!est) return;
  c.querySelectorAll('.pregunta .pOtra input').forEach(i => {
    if (est.textos[i.dataset.q]) i.value = est.textos[i.dataset.q];
    if (est.foco === i.dataset.q){
      i.focus();
      i.setSelectionRange(i.value.length, i.value.length);
    }
  });
}

// Junta lo elegido de todas las preguntas: lo tipeado a mano le gana a los botones
// (si escribiste algo es porque ninguna opción te servía). Devuelve null si falta
// contestar alguna, y avisa cuál en la notita del pie.
function juntarRespuestas(card){
  const rs = {};
  for (let iQ = 0; iQ < pregActual.preguntas.length; iQ++){
    const q = pregActual.preguntas[iQ];
    const inp = card.querySelector('.pOtra input[data-q="' + iQ + '"]');
    const tipeado = inp && inp.value.trim();
    const marcadas = (pregElecciones[iQ] || []).map(iO => q.opciones[iO].etiqueta);
    if (tipeado) rs[q.pregunta] = tipeado;
    else if (marcadas.length) rs[q.pregunta] = marcadas.join(', ');
    else {
      const nota = card.querySelector('.pNota');
      if (nota) nota.textContent = 'Falta contestar: ' + (q.titulo || q.pregunta);
      return null;
    }
  }
  return rs;
}

async function responderPregunta(rs){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || !pregActual) return;
  // Se esconde al toque y se vuelve a la burbuja de "pensando": la respuesta ya salió
  // y dejar los botones a la vista invita a tocar dos veces.
  pregRespondida = pregActual.hora;
  pregElecciones = {};
  firma = '';
  try {
    const r = await (await fetch('/movil/responder', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // Una pestaña sin estrenar manda sid vacío: el servidor guarda ese turno (y su
      // pregunta) bajo la carpeta, igual que /movil/mandar y /movil/parar.
      body: JSON.stringify({cwd: t.cwd,
                            sid: t.sid.startsWith('nueva-') ? '' : t.sid,
                            respuestas: rs})})).json();
    // Si ya no estaba esperando (la contestó otro, o el turno se cortó), no hay nada
    // que rehacer: el repintado siguiente muestra lo que haya.
  } catch(e){}
  pintarSesion();
}

// Un solo escucha delegado para los botones del selector (la lección de marcado.js:
// el hilo se rearma cada 3 s, engancharlos uno por uno obligaría a re-engancharlos).
document.getElementById('cuerpo').addEventListener('click', e => {
  if (!pregActual) return;
  const card = e.target.closest && e.target.closest('.pregunta');
  if (!card) return;
  // La tarjeta del plan tiene sus dos botones propios y ninguna opción numerada.
  if (pregActual.plan){
    if (e.target.closest('.pAprueba')) responderPlan(true);
    else if (e.target.closest('.pSigue')){
      const inp = card.querySelector('.pOtra input');
      responderPlan(false, inp && inp.value.trim());
    }
    return;
  }
  const op = e.target.closest('.pOp');
  if (op){
    const iQ = +op.dataset.q, iO = +op.dataset.o;
    const q = pregActual.preguntas[iQ];
    if (q.multi){
      const el = pregElecciones[iQ] || (pregElecciones[iQ] = []);
      const ya = el.indexOf(iO);
      if (ya >= 0) el.splice(ya, 1); else el.push(iO);
      op.classList.toggle('puesta');
    } else if (pregActual.preguntas.length === 1){
      responderPregunta({[q.pregunta]: q.opciones[iO].etiqueta});
    } else {
      pregElecciones[iQ] = [iO];
      card.querySelectorAll('.pOp[data-q="' + iQ + '"]').forEach(b =>
        b.classList.toggle('puesta', b === op));
    }
    return;
  }
  const manda = e.target.closest('.pManda');     // "Mandar" del texto libre (una pregunta)
  if (manda){
    const inp = card.querySelector('.pOtra input[data-q="' + manda.dataset.q + '"]');
    const texto = inp && inp.value.trim();
    if (texto) responderPregunta({[pregActual.preguntas[+manda.dataset.q].pregunta]: texto});
    return;
  }
  if (e.target.closest('.pMandar')){             // "Responder" de las preguntas juntas
    const rs = juntarRespuestas(card);
    if (rs) responderPregunta(rs);
  }
});

// Enter adentro de "Otra respuesta…" manda, como en la caja de abajo.
document.getElementById('cuerpo').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !pregActual) return;
  const inp = e.target.closest && e.target.closest('.pregunta .pOtra input');
  if (!inp) return;
  e.preventDefault();
  // En la tarjeta del plan, Enter con texto es "seguí planeando con estos cambios".
  if (pregActual.plan){
    const texto = inp.value.trim();
    if (texto) responderPlan(false, texto);
    return;
  }
  const card = inp.closest('.pregunta');
  if (pregActual.preguntas.length === 1){
    const texto = inp.value.trim();
    if (texto) responderPregunta({[pregActual.preguntas[0].pregunta]: texto});
  } else {
    const rs = juntarRespuestas(card);
    if (rs) responderPregunta(rs);
  }
});

// ⏹ Cortar el turno que está pensando. Mata el proceso `claude` de ese turno: lo que
// ya escribió queda escrito, la conversación no se rompe y podés escribirle de nuevo.
// No es un error, así que NO deja la marca roja (pedido de Martín, 2026-08-17).
// --- El modelo de esta sesión y compactarla ----------------------------------
// ⭐ Pedido de Martín el 2026-08-18, después de encontrar de dónde salía el drenaje de
// tokens: su configuración global tenía el modelo en `opus[1m]` (ventana de un millón),
// así que ninguna charla se compactaba nunca y cada comando releía la conversación
// entera. Ahora cada sesión elige con qué corre, y se puede compactar a mano.
// ⚠ El modelo vive en el SERVIDOR (no en el localStorage): lo usa quien lanza el
// proceso `claude`, no la pantalla, y así elegirlo en la compu vale también en el
// celular. Acá solo se guarda lo último que contestó, para no preguntar cada 3 s.
let modelos = [], modeloDe = {}, modeloPedido = '';
let esfuerzos = [], esfuerzoDe = {};
let velocidades = [], velocidadDe = {};
// ⭐ Plan mode (2026-08-20): la perilla vive en el servidor, como el modelo.
let modos = [], modoDe = {};

let contextoDe = {};

async function refrescarModelo(){
  const t = abiertas.find(x => x.sid === activa);
  const sel = $('#modelo'), selE = $('#esfuerzo'), selV = $('#velocidad'), bot = $('#compactar');
  const real = t && !t.sid.startsWith('nueva-') ? t.sid : '';
  // ⭐ El selector de cerebro (Claude/Codex) se ve SIEMPRE que haya carpeta: en una
  // charla sin estrenar elige con cuál nace, y en una nacida cambiarlo la MUDA al
  // otro CLI (resumen + sesión nueva). Compactar y Plan siguen siendo de Claude;
  // Modelo y Esfuerzo existen en los dos, y Velocidad solamente en Codex.
  const selC = $('#cerebro'), codex = t && t.cerebro === 'codex';
  if (selC){
    selC.style.display = (t && t.cwd) ? '' : 'none';
    if (t) selC.value = t.cerebro === 'auto' ? 'auto' : (codex ? 'codex' : '');
  }
  // Una charla sin estrenar no tiene nada que compactar ni un id donde guardar el
  // modelo: el turno lo va a arrancar igual con el de fábrica.
  if (bot) bot.style.display = (real && !codex) ? '' : 'none';
  // Bifurcar: misma regla que compactar (Codex no tiene `--fork-session`).
  if ($('#bifurcar')) $('#bifurcar').style.display = (real && !codex) ? '' : 'none';
  // 🎨 Con cualquier cerebro. Sin estrenar todavía no hay id donde guardar lo de la charla,
  // pero sí carpeta: ahí se pueden elegir los de la carpeta.
  if ($('#colorCharla')) $('#colorCharla').style.display = (real || (t && t.cwd)) ? '' : 'none';
  if (!sel || !t) return;
  const pedido = (real || t.sid) + ':' + (codex ? 'codex' : 'claude') + ':' + (t.modelo || '');
  if (modeloPedido === pedido) { pintarModelo(); return; }
  modeloPedido = pedido;
  try {
    const r = await (await fetch('/movil/modelo?sid=' + encodeURIComponent(real) +
                                 '&cwd=' + encodeURIComponent(t.cwd || '') +
                                 '&cerebro=' + (codex ? 'codex' : '') +
                                 '&modelo=' + encodeURIComponent(t.modelo || ''))).json();
    if (r.ok){
      const clave = real || t.sid;
      modelos = r.modelos || []; modeloDe[clave] = real ? r.modelo : (t.modelo || r.modelo);
      esfuerzos = r.esfuerzos || [];
      esfuerzoDe[clave] = real ? (r.esfuerzo || '') : (t.esfuerzo || r.esfuerzo || '');
      velocidades = r.velocidades || [];
      velocidadDe[clave] = real ? (r.velocidad || '') : (t.velocidad || r.velocidad || '');
      if (real){ t.modelo=r.modelo; t.esfuerzo=r.esfuerzo||''; t.velocidad=r.velocidad||''; }
      modos = r.modos || []; modoDe[real] = r.modo || '';
      if (r.contexto) contextoDe[real] = r.contexto;
      pintarModelo();
    }
  } catch(e){}
}

function pintarModelo(){
  const t = abiertas.find(x => x.sid === activa), sel = $('#modelo'), selE = $('#esfuerzo'), selV = $('#velocidad');
  if (!sel) return;
  const grupo = $('#ajustesModelo');
  // ⚠ Vacío no se muestra: hasta que el servidor conteste la lista, un <select> sin
  // opciones es una caja en blanco al lado de Enviar (se vio así el 2026-08-18,
  // porque el panel todavía no tenía el endpoint nuevo).
  sel.style.display = (t && modelos.length) ? '' : 'none';
  if (!t){ if (grupo) grupo.style.display = 'none'; return; }
  const real = t.sid.startsWith('nueva-') ? '' : t.sid;
  if (modelos.length){
    const clave = real || t.sid;
    const puesto = t.modelo || modeloDe[clave] || modelos[0].id;
    const html = modelos.map(m => '<option value="' + m.id + '"' +
          (m.id === puesto ? ' selected' : '') + '>' + esc(m.nombre) + '</option>').join('');
    if (sel.innerHTML !== html) sel.innerHTML = html;
    sel.value = puesto;
    sel.classList.toggle('puesto', puesto !== (modelos[0] || {}).id);
  }
  if (selE){
    const clave = real || t.sid;
    const puestoE = t.esfuerzo || esfuerzoDe[clave] || '';
    const htmlE = esfuerzos.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoE ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selE.innerHTML !== htmlE) selE.innerHTML = htmlE;
    selE.style.display = esfuerzos.length ? '' : 'none';
    selE.value = puestoE;
    selE.classList.toggle('puesto', !!puestoE);
  }
  if (selV){
    const clave = real || t.sid;
    const puestoV = t.velocidad || velocidadDe[clave] || '';
    const htmlV = velocidades.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoV ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selV.innerHTML !== htmlV) selV.innerHTML = htmlV;
    selV.style.display = (t.cerebro === 'codex' && velocidades.length) ? '' : 'none';
    selV.value = puestoV;
    selV.classList.toggle('puesto', !!puestoV);
  }
  // ⭐ Plan mode: solo en charlas de Claude ya nacidas (el servidor guarda la perilla
  // por id). Pintado cuando está en "Plan primero", que es lo que hay que notar.
  const selM = $('#modo');
  if (selM){
    const puestoM = modoDe[real] || '';
    const htmlM = modos.map(x => '<option value="' + x.id + '"' +
          (x.id === puestoM ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('');
    if (selM.innerHTML !== htmlM) selM.innerHTML = htmlM;
    selM.style.display = (t.cerebro !== 'codex' && real && modos.length) ? '' : 'none';
    selM.value = puestoM;
    selM.classList.toggle('puesto', !!puestoM);
  }
  pintarBotonAjustes();
  pintarContexto();
}

// ⭐ Un solo botón para TODO lo de esta charla (2026-08-25, "sería mejor que se compacten
// por categoría"): el cerebro y las acciones —Compactar, Revisar— entraron acá adentro,
// donde ya vivían modelo, esfuerzo, velocidad y modo. Antes eran cinco botones sueltos
// que empujaban la caja de escribir hasta dejarla en una rendija con el zoom puesto.
function pintarBotonAjustes(){
  const grupo = $('#ajustesModelo'), bot = $('#ajustesModeloBoton');
  if (!grupo || !bot) return;
  const todos = [$('#cerebro'), $('#modelo'), $('#esfuerzo'), $('#velocidad'), $('#modo')]
        .filter(Boolean);
  todos.forEach(s => { const label = s.closest('label'); if (label) label.style.display = s.style.display === 'none' ? 'none' : ''; });
  const activos = todos
        .filter(s => s && s.style.display !== 'none' && s.options.length);
  // La línea de acciones se esconde entera cuando no queda ninguna: una charla sin
  // estrenar no tiene nada que compactar.
  const acciones = [$('#compactar'), $('#revisar'), $('#bifurcar'), $('#colorCharla')].filter(Boolean);
  const hayAccion = acciones.some(b => b.style.display !== 'none');
  const fila = $('#menuAcciones');
  if (fila) fila.classList.toggle('vacio', !hayAccion);
  grupo.style.display = (activos.length || hayAccion) ? '' : 'none';
  if (!activos.length && !hayAccion){
    grupo.classList.remove('abierto'); bot.setAttribute('aria-expanded','false'); return;
  }
  const corto = txt => txt.replace(/^(Esfuerzo|Modo|Velocidad)\s+/i, '').trim();
  // ⚠ En el rótulo van solo las DOS primeras (cerebro y modelo): con las cinco, el
  // botón se pasaba de su tope de 250 px y quedaba cortado con puntos suspensivos,
  // que es peor que no mostrarlas. Lo demás se ve al abrirlo, y si algo está fuera
  // de fábrica el botón se pinta igual.
  const rotulo = activos.map(s => corto(s.selectedOptions[0]?.textContent || ''))
                        .filter(Boolean).slice(0, 2).join(' · ');
  rotular(bot, rotulo || 'Ajustes');
  bot.classList.toggle('puesto', activos.some(s => s.classList.contains('puesto')));
}

$('#ajustesModeloBoton').addEventListener('click', e => {
  e.stopPropagation();
  const grupo = $('#ajustesModelo'), abierto = !grupo.classList.contains('abierto');
  grupo.classList.toggle('abierto', abierto);
  e.currentTarget.setAttribute('aria-expanded', abierto ? 'true' : 'false');
});
// El menú no se cierra al tocar una perilla (podés cambiar dos seguidas). Sí se cierra
// con las acciones marcadas `data-cierra`, que son las que terminan en el hilo.
// ⚠ Compactar NO la lleva a propósito: pregunta primero y se confirma con un SEGUNDO
// toque en el mismo botón. Si el menú se cerrara con el primero, habría que volver a
// abrirlo para confirmar y el botón ya no diría "¿compacto?".
$('#ajustesModeloMenu').addEventListener('click', e => {
  e.stopPropagation();
  if (!e.target.closest('.menu-acciones button[data-cierra]')) return;
  const grupo = $('#ajustesModelo');
  grupo.classList.remove('abierto');
  $('#ajustesModeloBoton').setAttribute('aria-expanded', 'false');
});
document.addEventListener('click', () => {
  const grupo = $('#ajustesModelo'), bot = $('#ajustesModeloBoton');
  if (grupo) grupo.classList.remove('abierto');
  if (bot) bot.setAttribute('aria-expanded', 'false');
});

// ⭐ El aviso de cuánto arrastra esta charla (pedido de Martín, 2026-08-18). Lo que se
// muestra NO es lo que gastó en total: es lo que se relee en CADA mensaje, que es lo
// que se paga de nuevo con cada comando y cada archivo que abre. Va pegado al botón
// Compactar porque es justo la respuesta a "¿y qué hago con esto?".
// ⚠ El color fuerte es solo para el nivel alto: el naranja de "va cargada" es un
// aviso, no un error — el rojo acá es para lo que está mal (regla de Martín).
function pintarContexto(){
  const t = abiertas.find(x => x.sid === activa), chip = $('#contexto');
  if (!chip) return;
  const c = t ? contextoDe[t.sid] : null;
  if (!c || !c.tokens){ chip.style.display = 'none'; return; }
  chip.style.display = '';
  chip.className = 'ctx ' + (c.nivel || 'bien');
  const mil = c.tokens >= 1000000 ? (c.tokens/1000000).toFixed(1).replace('.', ',') + ' M'
                                  : Math.round(c.tokens/1000) + ' k';
  chip.textContent = mil;
  chip.title = c.aviso || ('Esta charla arrastra ' + mil + ' de contexto en cada mensaje.');
  // El botón Compactar se enciende cuando de verdad conviene: si está siempre igual,
  // deja de querer decir algo.
  const bot = $('#compactar');
  if (bot) bot.classList.toggle('conviene', c.nivel === 'mucho');
}

// El cerebro elegido queda EN LA PESTAÑA (t.cerebro) hasta el primer mensaje, que es
// el que hace nacer la charla en ese CLI. En una charla ya NACIDA, cambiarlo la muda
// al otro cerebro (2026-08-20): se la resume y sigue en una sesión nueva del otro
// lado, igual que compactar pero aterrizando enfrente.
$('#cerebro').addEventListener('change', async e => {
  const t = abiertas.find(x => x.sid === activa);
  if (!t){ pintarModelo(); return; }
  if (!t.sid.startsWith('nueva-') && e.target.value === 'auto'){
    alert('Auto se elige al empezar una conversación nueva.'); refrescarModelo(); return;
  }
  const aCodex = e.target.value === 'codex';
  if (t.sid.startsWith('nueva-')){
    t.cerebro = e.target.value === 'auto' ? 'auto' : (aCodex ? 'codex' : '');
    modeloPedido = '';
    firma = ''; guardar(); pintarTabs(); refrescarModelo();
    return;
  }
  if ((t.cerebro === 'codex') === aCodex || enVuelo[t.sid]){ refrescarModelo(); return; }
  const para = aCodex ? 'Codex' : 'Claude';
  if (!confirm('¿Pasar esta charla a ' + para + '? La resume y sigue en una nueva de '
               + para + ' con ese resumen. Tarda un rato.')){ refrescarModelo(); return; }
  const viejo = t.sid;
  enVuelo[viejo] = 'mudando la charla a ' + para; arranque[viejo] = Date.now();
  firma = ''; pintarSesion(); pintarTabs();
  try {
    const r = await (await fetch('/movil/mudar_cerebro', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sid: viejo, cwd: t.cwd})})).json();
    if (r.ok && r.sid){

});

// ⚠ Dos toques, como el ▶ de los bloques de código: compactar cuesta dos turnos (el
// primero lee la charla entera) y deja la pestaña en una sesión NUEVA. Un clic de más
// no puede alcanzar. Se cae solo a los 5 s. Con `directo` (el "Sí" de la pregunta que
// hace el servidor al pasar el tope) no hay segundo toque: la pregunta ya se contestó.
let compactarPide = 0;
async function compactar(directo){
  const t = abiertas.find(x => x.sid === activa);
  const b = $('#compactar');
  if (!t || t.sid.startsWith('nueva-') || enVuelo[t.sid]) return;
  if (directo !== true && Date.now() > compactarPide){
    compactarPide = Date.now() + 5000;
    b.classList.add('pide'); rotular(b, '¿compacto?');
    setTimeout(() => { if (Date.now() > compactarPide){
      b.classList.remove('pide'); rotular(b, 'Compactar'); } }, 5100);
    return;
  }
  compactarPide = 0;
  b.classList.remove('pide'); b.disabled = true; rotular(b, 'resumiendo…');
  const viejo = t.sid;
  enVuelo[viejo] = 'compactando la charla'; arranque[viejo] = Date.now();
  firma=''; pintarSesion(); pintarTabs();
  try {
    const r = await (await fetch('/movil/compactar', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sid: viejo, cwd: t.cwd})})).json();
    if (r.ok && r.sid){
      // La pestaña se muda a la sesión nueva. La vieja NO se cierra ni se borra:
      // sigue en la bandeja, entera, por si hay que volver a mirarla. En el hilo no
      // se nota el corte: la conversación viene cosida del servidor (2026-08-20).
      delete pideCompactar[viejo]; delete pideCompactar[r.sid];
      t.sid = r.sid; if (activa === viejo) activa = r.sid;
      modeloPedido = '';
      fijarDireccion({empujar: false});
      guardar();
    } else {
      alert(r.error || 'No pude compactarla.');
    }
  } catch(e){ alert('No pude compactarla: ' + e); }
  delete enVuelo[viejo]; delete arranque[viejo];
  b.disabled = false; rotular(b, 'Compactar');
  firma=''; pintarTabs(); pintarSesion(); cargar(); refrescarModelo();
}

// --- Imágenes: las que quieras, por el clip o pegando con Ctrl+V --------------
let fotos = [];

function pintarChapas(){
  const c = $('#chapas');

    '<div class="chapa"><img src="' + URL.createObjectURL(f) + '">' +

  c.querySelectorAll('.x').forEach(x =>

function sumarFotos(lista){
  for (const f of lista) if (f && f.type.startsWith('image/')) fotos.push(f);
  pintarChapas();

$('#archivo').addEventListener('change', e => { sumarFotos(e.target.files); e.target.value=''; });

async function buscarArchivo(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || !t.cwd){ alert('Abrí una charla dentro de una carpeta primero.'); return; }
  try {
    const r = await (await fetch('/movil/elegir_archivo?cwd=' + encodeURIComponent(t.cwd),
                                 {method:'POST'})).json();
    if (!r.ok){ if (!r.cancelado) alert(r.error || 'No pude abrir el buscador de archivos.'); return; }
    const c = $('#texto'), ruta = r.ruta || '';
    const ini = c.selectionStart ?? c.value.length, fin = c.selectionEnd ?? ini;
    const antes = c.value.slice(0, ini), despues = c.value.slice(fin);
    const separaAntes = antes && !/\s$/.test(antes) ? ' ' : '';
    const separaDespues = despues && !/^\s/.test(despues) ? ' ' : '';
    const pegado = '`' + ruta + '`';
    c.value = antes + separaAntes + pegado + separaDespues + despues;
    const pos = antes.length + separaAntes.length + pegado.length;
    c.setSelectionRange(pos, pos); c.dispatchEvent(new Event('input')); c.focus();
  } catch(e){ alert('No pude abrir el buscador de archivos. Reiniciá el panel y probá de nuevo.'); }
}
// Pegar una captura es lo natural en la compu: el listener va en toda la página,
// no en el campo, así uno pega apenas recorta sin tener que hacer clic antes.
document.addEventListener('paste', e => {
  if (!activa) return;
  const im = [...(e.clipboardData?.items || [])]
    .filter(i => i.type.startsWith('image/')).map(i => i.getAsFile());
  if (im.length){ e.preventDefault(); sumarFotos(im); }
});

// ⭐⭐ Una charla NUEVA cambia de id UNA sola vez en su vida: nace como `nueva-…` acá en
// la pantalla y a los pocos segundos el CLI le da el de verdad. Mudar la pestaña a ese id
// es lo que la engancha con la conversación real: el hilo en vivo, el botón Parar y la
// dirección web. Antes esto pasaba recién cuando el turno ENTERO terminaba, y hasta ahí
// la pantalla mostraba "Sin mensajes todavía" con la burbuja de pensando — 7 minutos
// mirando una charla vacía que estaba trabajando (captura de Martín, 2026-08-23). Ahora
// se llama dos veces: apenas el servidor publica el id, y de nuevo al cerrar el turno.
function mudarPestana(t, clave, sidNuevo){
  if (!sidNuevo || sidNuevo === clave) return clave;
  // ⭐⭐ ¿Seguís parado en esta charla? Se pregunta ANTES de tocar nada, con el id viejo
  // todavía puesto. Antes esto hacía `activa = r.sid` a secas y el resultado era el que
  // Martín reportó el 2026-08-23: mandabas el primer mensaje de una charla nueva, te ibas
  // a otra pestaña mientras pensaba, y al llegar la respuesta la pantalla te arrastraba
  // de vuelta sola. Lo mismo ya se hacía bien al compactar y al mudar de cerebro: la
  // pestaña se muda, vos no.
  const seguisAca = activa === clave;
  for (const caja of [enVuelo, arranque, vecesVuelo, fotosVuelo, vecesFotosVuelo,
                      hiloVisto, parados]){
    if (Object.prototype.hasOwnProperty.call(caja, clave)){
      caja[sidNuevo] = caja[clave]; delete caja[clave];
    }
  }
  t.sid = sidNuevo;
  if (seguisAca) activa = sidNuevo;
  // Recién ahora esta charla existe de verdad y tiene id propio: ahí gana su dirección.
  // Va REEMPLAZANDO, no empujando: la entrada anterior del historial es la misma pantalla
  // con un id provisorio que ya no significa nada. ⚠ Solo si seguís acá: si te fuiste, la
  // barra de direcciones es de la pantalla que estás mirando ahora y no se le toca.
  if (seguisAca) fijarDireccion({empujar: false});
  guardar(); pintarTabs();
  firma = '';                       // el hilo se repinta contra la charla de verdad
  return sidNuevo;
}

// Con qué cerebro y perillas quedó la charla después del turno (una nueva las estrena acá).
function aplicarPerillas(t, r){
  if (r.cerebro) t.cerebro = r.cerebro === 'codex' ? 'codex' : '';
  if (Object.prototype.hasOwnProperty.call(r,'modelo')) t.modelo = r.modelo;
  if (Object.prototype.hasOwnProperty.call(r,'esfuerzo')) t.esfuerzo = r.esfuerzo;
  if (Object.prototype.hasOwnProperty.call(r,'velocidad')) t.velocidad = r.velocidad;
}

// ⭐ Lo que no se pudo mandar NO SE PIERDE (2026-08-23). Vuelve a ser el borrador de esa
// conversación, y si seguís parado ahí y no escribiste otra cosa mientras tanto, vuelve
// también a la caja con sus fotos. Antes se borraba apenas apretabas Enviar y, si el
// servidor lo rebotaba —"esa sesión está contestando algo"—, había que escribirlo de nuevo.
function devolverLoEscrito(sid, texto, fotosGuardadas){
  fotosGuardadas = fotosGuardadas || [];
  if (!texto && !fotosGuardadas.length) return;
  if (texto) anotarBorrador(sid, texto);
  if (activa !== sid) return;
  const caja = $('#texto');
  if (texto && caja && !caja.value.trim()){
    caja.value = texto;
    caja.dispatchEvent(new Event('input'));    // le devuelve el alto que tenía
  }
  if (fotosGuardadas.length && !fotos.length){ fotos = fotosGuardadas; pintarChapas(); }
}

/* ⭐ Revisar el código (2026-08-25). Va como un mensaje MÁS de la charla abierta, no
   como un proceso aparte: el hilo que ves se dibuja de los archivos del propio CLI,
   así que lo que no es un turno de verdad no puede aparecer ahí. Y de paso queda
   donde sirve — podés seguir con "arreglá el segundo" sin cambiar de pantalla.
   Cada cerebro con lo suyo: Claude tiene la skill /code-review; Codex no la tiene
   (su `codex review` es un comando de afuera), así que se le pide en criollo. */
const PEDIDO_REVISION = {
  claude: '/code-review',
  codex: 'Revisá los cambios que todavía no commiteé en este proyecto (mirá el git ' +
         'status y el git diff, incluido lo que está en staged y lo que no se agregó ' +
         'todavía) y decime qué está mal. Primero los errores de verdad, después lo ' +
         'que se pueda simplificar. No arregles nada todavía: quiero leer la lista.'
};

/* ⭐ Bifurcar una charla (2026-09-27): como en Claude Code, probar otro camino sin perder
   este. Se abre una pestaña sin estrenar que MUESTRA la original y lleva `desde`; recién
   el primer mensaje que mandes ahí crea la copia (`--resume <original> --fork-session`),
   que sigue con todo lo anterior y un id propio. Medido con `sonda_bifurcar.py`: la copia
   recuerda, tiene id nuevo, y la original queda intacta. Codex no se bifurca. */
function bifurcar(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t || t.sid.startsWith('nueva-') || t.cerebro === 'codex') return;
  const sid = 'nueva-' + Date.now();
  abiertas.push({sid, cwd: t.cwd, nombre: 'Copia de ' + (t.nombre || 'la charla'), cerebro: '',
                 desde: t.sid, desdeNombre: t.nombre || '', modelo: t.modelo || modeloDe[t.sid] || ''});
  guardar();
  irTab(sid);
}

function revisarCodigo(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return;
  if (t.sid.startsWith('nueva-')){
    alert('Abrí o empezá una charla en ese proyecto y después pedile la revisión.');
    return;
  }
  mandar(t.cerebro === 'codex' ? PEDIDO_REVISION.codex : PEDIDO_REVISION.claude);
}

// ⭐ Avisame al celular cuando termine. Vale para UN mensaje: se apaga al mandarlo,
// así no te llena el celular sin que lo pidas.
// ⭐⭐ Y desde el 2026-08-29 sirve TAMBIÉN con el turno ya corriendo, que es cuando de
// verdad lo necesitás: te das cuenta de que la cosa viene larga MIENTRAS piensa, no
// antes de mandar. Antes, apretarlo ahí no hacía nada para ese turno y encima quedaba
// armado en silencio para el mensaje siguiente. Quién manda es el SERVIDOR: él sabe si
// hay un turno vivo al que colgarle el aviso, y la pantalla no adivina.
let avisarTarea = false;
let avisandoSes = {}, ocupadaSes = {};

function pintarAviso(){
  const b = $('#avisarTarea');
  if (!b) return;
  const enCurso = !!avisandoSes[activa];
  b.classList.toggle('sel', avisarTarea || enCurso);
  b.title = enCurso ? 'Te aviso al celular cuando termine este turno (tocá para cancelar)'
    : avisarTarea ? 'Te aviso al celular cuando termine el mensaje que mandes'
    : 'Avisarme al celular cuando termine';
}

async function alternarAviso(){
  const t = abiertas.find(x => x.sid === activa);
  const sid = (t && !t.sid.startsWith('nueva-')) ? t.sid : '';
  const quiero = !(avisarTarea || avisandoSes[activa]);
  let r = null, panelViejo = false;
  if (sid){
    try {
      const resp = await fetch('/movil/avisar', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({sid, quiero})});
      panelViejo = (resp.status === 404);   // el panel corre con el módulo de antes
      r = await resp.json();
    } catch(e){}
  }
  if (r && r.ok && r.enganchado){
    // Enganchado al turno que está corriendo: el botón queda encendido hasta que
    // termine (el estado lo repone el servidor en cada refresco).
    avisandoSes[activa] = quiero;
    avisarTarea = false;
    pintarAviso();
    return;
  }
  if (r && r.ok && r.motivo === 'recien_termino'){
    // La regla es que el aviso no se pierda en silencio: si apretaste justo cuando
    // terminaba, el servidor lo manda igual y acá se dice.
    avisandoSes[activa] = false; avisarTarea = false; pintarAviso();
    alert('Ya había terminado: te mandé el aviso igual.');
    return;
  }
  // No hay ningún turno vivo al que engancharlo: vale para el mensaje que mandes.
  avisarTarea = quiero;
  avisandoSes[activa] = false;
  pintarAviso();
  if (quiero && panelViejo){
    alert('Reiniciá el panel: esta versión todavía no sabe enganchar el aviso a un turno '
        + 'que ya está corriendo. Por ahora queda pedido para el mensaje que mandes vos.');
  } else if (quiero && ocupadaSes[activa]){
    alert('Esa charla está trabajando, pero el turno no lo largó esta pantalla, así que '
        + 'no puedo engancharle el aviso. Queda pedido para el mensaje que mandes vos.');
  }
}

// `forzado` es un mensaje que manda la pantalla sola, sin pasar por la caja de
// escribir: hoy lo usa la decisión del plan de Codex. Se comprueba que sea texto y no
// un evento, porque a `mandar` también la llaman desde un onclick y desde el Enter.
// --- ⭐⭐ Mensajes en fila: escribirle mientras trabaja (2026-09-27) --------------------
// El servidor se lo pasa al MISMO proceso que está en pleno turno (`/movil/mandar` →
// `sesiones_movil.encolar`) y el CLI lo toma en la próxima pausa. Hasta que aparece en el
// hilo (Claude Code lo guarda como `queued_command` recién cuando lo toma) se ve una
// burbuja tuya "en fila". Se cuenta, no se ubica, igual que el eco de siempre.
let enFila = {};               // sid -> [{texto, base}]
let avisoFila = {};            // sid -> texto del último rechazo, para mostrarlo abajo

async function encolarMensaje(t, txt){
  anotarMio(t, txt);
  recorrido = null;
  $('#texto').value = '';
  ajustarCaja();
  anotarBorrador(t.sid, '');
  soltarBorrador();
  delete avisoFila[t.sid];
  (enFila[t.sid] = enFila[t.sid] || []).push({texto: txt, base: cuentaTuya(hiloVisto[t.sid], txt)});
  firma = ''; pintarSesion();
  const f = new FormData();
  f.append('cwd', t.cwd); f.append('sid', t.sid); f.append('texto', txt);
  let r = null;
  try { r = await (await fetch('/movil/mandar', {method: 'POST', body: f})).json(); } catch(e){}
  if (!r || !r.ok){
    enFila[t.sid] = (enFila[t.sid] || []).filter(x => x.texto !== txt);
    avisoFila[t.sid] = (r && r.error) || 'No le pude pasar el mensaje: probá de nuevo.';
    devolverLoEscrito(t.sid, txt, []);   // no se pierde lo que escribiste
  }
  firma = ''; pintarSesion();
}

async function mandar(forzado){
  const impuesto = (typeof forzado === 'string' && forzado.trim()) ? forzado.trim() : '';
  const t = abiertas.find(x => x.sid === activa);
  const txt = impuesto || $('#texto').value.trim();
  const ses = datos.proyectos.flatMap(x => x.sesiones).find(s => s.id === t?.sid);
  if (!t || (!txt && !fotos.length)) return;
  // ⭐⭐ Escribirle MIENTRAS trabaja, como en Claude Code (2026-09-27): el mensaje queda en
  // fila y lo toma en la próxima pausa, sin cortar lo que está haciendo. Una charla que
  // todavía no nació (sin id) no se puede: se espera a que lo tenga, son segundos.
  if (enVuelo[t.sid] || ses?.ocupada || ocupadaSes[t.sid]){
    if (impuesto || t.sid.startsWith('nueva-') || !txt) return;
    return encolarMensaje(t, txt);
  }
  // Mandaste un mensaje: lo que querés ver es la charla, no el archivo que estabas
  // mirando. Se cierra solo (si no, la pantalla volvía al archivo en el próximo
  // repintado y tu mensaje desaparecía de la vista).
  if (verArchivo){ verArchivo = null; arb.sel = ''; pintarArbol(); }
  // Un mensaje impuesto no vacía la caja: lo que tenías a medio escribir sigue ahí.
  if (!impuesto){
    // ⭐ Antes de vaciar la caja, tu mensaje queda anotado en este navegador: si el
    // envío se pierde antes de llegar al servidor, lo recuperás con ↑ (2026-09-27).
    anotarMio(t, txt);
    recorrido = null;
    $('#texto').value = '';
    ajustarCaja();
    // Lo mandaste: el borrador de esta conversación ya no existe. Se avisa igual aunque el
    // propio `/movil/mandar` lo borre del lado del servidor — así la chapa se apaga en el
    // acto y no dentro de veinte segundos, cuando vuelva la lista.
    anotarBorrador(t.sid, '');
    soltarBorrador();
  }
  let clave = t.sid;
  // Las chapitas se limpian para dejar la caja lista, pero su miniatura sigue viva en
  // el eco hasta que el servidor devuelve la foto real. Si no se guarda acá, durante el
  // envío solo quedaba el cartel feo "(imagen)".
  // Las fotos que tengas puestas son para TU mensaje, no para uno impuesto: la
  // decisión del plan no se lleva puesta la captura que estabas por mandar.
  const fotosParaEnviar = impuesto ? [] : fotos;
  if (!impuesto){ fotos = []; pintarChapas(); }
  if (fotosParaEnviar.length){
    fotosVuelo[clave] = fotosParaEnviar.map(foto => URL.createObjectURL(foto));
    vecesFotosVuelo[clave] = cuentaFotos(hiloVisto[clave]);
  }
  // Le mandaste algo nuevo: lo que hayas cortado antes ya no cuenta.
  delete paradoEn[clave];
  enVuelo[clave] = txt || '(imagen)'; arranque[clave] = Date.now();
  vecesVuelo[clave] = cuentaTuya(hiloVisto[clave], txt);
  saleArmada = true;
  pintarYa = true;               // tu burbuja aparece ya, sin esperar al panel
  firma=''; pintarSesion(); pintarTabs();
  const f = new FormData();
  f.append('cwd', t.cwd);
  f.append('sid', clave.startsWith('nueva-') ? '' : clave);
  // Con qué cerebro nace una charla NUEVA (con id, el servidor lo deduce solo).
  f.append('cerebro', t.cerebro || '');
  f.append('modelo', t.modelo || modeloDe[t.sid] || '');
  f.append('esfuerzo', t.esfuerzo || esfuerzoDe[t.sid] || '');
  f.append('velocidad', t.velocidad || velocidadDe[t.sid] || '');
  f.append('texto', txt);
  // Bifurcar: el primer mensaje de una copia la crea a partir de la original.
  if (clave.startsWith('nueva-') && t.desde) f.append('desde', t.desde);
  // ⭐ El turno corre en el servidor y acá solo se pregunta cómo viene (2026-08-21).
  // Antes el pedido quedaba abierto hasta que Claude terminaba: un turno largo (un
  // deploy, una revisión) se colgaba de esa conexión y si el navegador la soltaba
  // aparecía "falló · Se cortó: Failed to fetch" con el trabajo andando perfecto.
  // ⭐ Las charlas SIN estrenar también van por acá desde el 2026-08-23. Antes iban por
  // el camino directo "porque necesitábamos su id de verdad en la misma respuesta": ese
  // era justamente el problema — el id llegaba al FINAL del primer turno y hasta entonces
  // la pestaña no tenía a qué conversación mirar. Ahora el servidor lo publica en la
  // ficha del trabajo apenas nace y la pestaña se muda en el acto (ver `mudarPestana`).
  f.append('segundo_plano', '1');
  // El aviso se pide para ESTE mensaje. ⭐ Las charlas sin estrenar también, desde el
  // 2026-08-29: se las excluía "porque recién nacida no hay a qué charla nombrar en el
  // aviso", y eso no era cierto — el aviso se arma al TERMINAR, con el id que la charla
  // ya ganó. Con la exclusión el botón quedaba encendido y no avisaba nunca: la misma
  // mentira que se vino a arreglar. Y el primer turno de una charla nueva suele ser
  // justo el largo.
  if (avisarTarea){
    f.append('avisar', '1');
    avisarTarea = false;
    pintarAviso();
  }
  for (const foto of fotosParaEnviar) f.append('imagenes', foto, foto.name || 'captura.png');
  try {
    let r = await (await fetch('/movil/mandar', {method:'POST', body:f})).json();
    if (r.segundo_plano && r.trabajo){
      // El POST ya terminó: desde acá solo se mira una ficha chica. Si una consulta
      // falla (se durmió la máquina, cambió la red), se reintenta: el turno no depende
      // de esta conexión.
      while (true){
        await new Promise(ok => setTimeout(ok, 1200));
        try {
          const e = await (await fetch('/movil/trabajo/' + r.trabajo)).json();
          if (!e.ok){ r = e; break; }
          // ⭐ La charla nueva ya tiene su id: la pestaña se muda AHORA, en plena
          // pensada, y el hilo empieza a mostrar lo que la sesión va contestando.
          if (e.sid_nuevo && e.sid_nuevo !== clave && t.sid === clave){
            clave = mudarPestana(t, clave, e.sid_nuevo);
            pintarSesion();
          }
          if (e.estado === 'trabajando') continue;
          r = {...e, ok: e.estado === 'terminado', sid: e.sid_nuevo || e.sid};
          break;
        } catch(e){ continue; }
      }
    }
    if (r.sid){
      // El turno cerró: si la charla cambió de id (nació recién, o el CLI la compactó a
      // mitad de camino) la pestaña se muda ahora. Si ya se había mudado en el medio,
      // esto no hace nada y solo quedan las perillas.
      clave = mudarPestana(t, clave, r.sid);
      aplicarPerillas(t, r);
      guardar(); pintarTabs();
    }
    // Si lo cortaste vos con el botón Parar, el turno vuelve con error y eso NO es
    // una falla: no se pinta de rojo.
    if (!r.ok && !parados[clave]){
      marcarFalla(clave, r.error || 'No pude mandarlo');
      devolverLoEscrito(clave, txt, fotosParaEnviar);   // no se pierde lo que escribiste
    }
    else if (r.ok) delete falladas[clave];
    // ⭐ El tope ya no compacta solo (2026-08-20): si la charla pasó el límite, el
    // turno vuelve con la pregunta y se dibuja adentro del hilo, sin cartel del
    // navegador. "Ahora no" la silencia media hora.
    if (r.pide_compactar && !(silencioComp[clave] > Date.now()))
      pideCompactar[clave] = r.pide_compactar;
    else delete pideCompactar[clave];
  } catch(e){
    if (!parados[clave]){
      marcarFalla(clave, 'Se cortó: ' + e);
      devolverLoEscrito(clave, txt, fotosParaEnviar);
    }
  }
  delete enVuelo[clave]; delete arranque[clave]; delete parados[clave];
  delete vecesVuelo[clave];
  soltarFotosVuelo(clave);
  // Contestó: el contexto creció, así que se vuelve a preguntar. Es el momento en que
  // el aviso de "esto ya arrastra mucho" tiene que aparecer solo.
  modeloPedido = '';
  // Terminó de contestar: si te fuiste a otra pestaña, esta queda marcada.
  if (activa !== clave) pendientes[clave] = true;
  firma=''; guardar(); pintarTabs(); pintarSesion(); cargar();
}

// --- ⭐⭐ Tus mensajes no se pierden: ↑ te devuelve los anteriores (2026-09-27) --------
// Pedido de Martín: "no perder los prompts que yo mando". Cada mensaje queda en DOS
// lados: el servidor lo guarda apenas llega (`/movil/mis-mensajes`, que ve también lo
// del celular) y este navegador lo anota ANTES de vaciar la caja, que es lo único que
// cubre un envío que se cae antes de llegar (pasó el 2026-09-27: la caja quedó vacía y
// el servidor nunca lo recibió). Con la caja vacía, ↑ recorre tus mensajes de ESTA
// carpeta del más nuevo al más viejo y ↓ vuelve, como en Claude Code.
// ⚠ Solo con la caja vacía (o ya recorriendo): escribiendo, las flechas mueven el cursor.
const MIOS = 'misMensajes';
let recorrido = null;          // {lista, i, antes} mientras recorrés con las flechas

function anotarMio(t, texto){
  if (!t || !texto) return;
  try {
    const l = JSON.parse(localStorage.getItem(MIOS) || '[]');
    l.push({texto, cwd: t.cwd, h: Date.now()});
    localStorage.setItem(MIOS, JSON.stringify(l.slice(-300)));
  } catch(e){}
}

async function listaMia(cwd){
  // La misma carpeta puede venir como `D:\IA\x` o `d:/IA/x/`.
  const igual = c => (c || '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
  let delServidor = [];
  try {
    delServidor = (await (await fetch('/movil/mis-mensajes?n=200&cwd=' +
                   encodeURIComponent(cwd))).json()).mensajes.map(m => m.texto);
  } catch(e){}
  let locales = [];
  try {
    locales = JSON.parse(localStorage.getItem(MIOS) || '[]')
                .filter(m => igual(m.cwd) === igual(cwd)).map(m => m.texto);
  } catch(e){}
  // Lo que el servidor no tiene es justo lo que se perdió en el camino: va al final.
  const del = new Set(delServidor);
  const lista = delServidor.concat(locales.filter(x => !del.has(x)));
  return lista.filter((x, i) => x && x !== lista[i - 1]);
}

function ponerEnCaja(caja, v){
  caja.value = v;          // sin evento 'input': recorrer no pisa el borrador guardado
  ajustarCaja();
  caja.setSelectionRange(v.length, v.length);
}

$('#texto').addEventListener('keydown', async e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); mandar(); return; }
  if ((e.key !== 'ArrowUp' && e.key !== 'ArrowDown') || e.shiftKey || e.altKey ||
      e.ctrlKey || e.metaKey) return;
  const caja = e.target;
  if (!recorrido && (e.key === 'ArrowDown' || caja.value.trim())) return;
  e.preventDefault();
  if (!recorrido){
    const t = abiertas.find(x => x.sid === activa);
    if (!t || !t.cwd) return;
    recorrido = {lista: null, i: 0, antes: caja.value};
    const r = recorrido;
    r.lista = await listaMia(t.cwd);
    if (recorrido !== r) return;         // escribiste algo mientras la traía
    r.i = r.lista.length;
  }
  if (!recorrido.lista) return;          // todavía la está trayendo
  const r = recorrido;
  r.i = Math.max(0, Math.min(r.lista.length, r.i + (e.key === 'ArrowUp' ? -1 : 1)));
  if (r.i >= r.lista.length){ ponerEnCaja(caja, r.antes); recorrido = null; return; }
  ponerEnCaja(caja, r.lista[r.i]);
});
// Cambió el ancho de la caja (cambiaste el zoom, apareció Parar, plegaste el árbol): el
// alto se vuelve a medir. Se compara SOLO el ancho porque ajustar el alto dispara este
// mismo observador y quedaría dando vueltas.
if (window.ResizeObserver){
  let anchoCaja = 0;
  new ResizeObserver(es => {
    const ancho = Math.round(es[0].contentRect.width);
    if (ancho === anchoCaja) return;
    anchoCaja = ancho;
    ajustarCaja();
  }).observe($('#texto'));
}

$('#texto').addEventListener('input', e => {
  recorrido = null;            // escribiste: dejás de recorrer tus mensajes anteriores
  ajustarCaja();
  // ⭐ Cada tecla queda guardada como borrador: acá en el acto, y al servidor con el
  // respiro de 700 ms de `anotarBorrador`.
  anotarBorrador(activa, e.target.value);
});

// Cada 8 s se pregunta por las pestañas abiertas si alguna terminó de escribir.
// Solo por las tuyas, no por las 144 que hay en el disco.
async function mirarNovedades(){
  const abrir = abiertas.filter(t => !t.sid.startsWith('nueva-'));
  if (!abrir.length) return;
  let r;
  try {
    r = await (await fetch('/movil/novedad', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pestanas: abrir.map(t => ({sid:t.sid, cwd:t.cwd}))})})).json();
  } catch(e){ return; }
  let cambio = false;
  for (const t of abrir){
    const n = r[t.sid];
    if (!n || n.ultimo !== 'claude') continue;
    if (t.sid === activa){ visto[t.sid] = n.ts; continue; }   // la estás mirando
    if (n.ts > (visto[t.sid] || 0)){
      // Esa charla dijo algo nuevo: lo guardado de ella ya es viejo. Se tira para que la
      // precarga lo traiga de nuevo y, al entrar, lo que se vea al instante sea lo último.
      if (!pendientes[t.sid]) delete chatVisto[t.sid];
      pendientes[t.sid] = true; cambio = true;
    }
  }
  if (cambio){ guardar(); pintarTabs(); }
  precargarChats();
}

// ⭐ El marcador de texto: seleccionás adentro de una charla, botón derecho, y sale el
// menú de colores y formas (pedido de Martín, 2026-08-17). Va UN listener en el
// contenedor y no uno por mensaje: el hilo se rearma entero cada 3 s y habría que
// volver a engancharlos todos en cada repintado.
// ⚠ Si no hay nada seleccionado ni una marca abajo del puntero, `Marcas.menu` devuelve
// false y NO se toca el evento: ahí sale el menú del navegador, que es lo que uno espera
// (y en la lista de conversaciones el clic derecho sigue archivando, como siempre).
document.getElementById('cuerpo').addEventListener('contextmenu', e => {
  if (!activa || !window.Marcas) return;
  const hilo = document.getElementById('hilo');
  if (!hilo || !hilo.contains(e.target)) return;
  Marcas.menu(e, activa, hilo, () => { firma = ''; pintarSesion(); });
});

// ⭐ Y con el clic de siempre se AGARRA una marca ya hecha, para cambiarle el color o la
// forma sin tener que acordarse del botón derecho (pedido de Martín, 2026-08-18: "como lo
// ofrece el Adobe PDF"). ⚠ Solo si no estás seleccionando texto: si hay algo seleccionado,
// el clic es el final de ese arrastre y abrirle un menú encima sería una molestia.
document.getElementById('cuerpo').addEventListener('click', e => {
  if (!activa || !window.Marcas) return;
  const marca = e.target.closest && e.target.closest('.mkc');
  if (!marca) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  const hilo = document.getElementById('hilo');
  if (!hilo || !hilo.contains(marca)) return;
  Marcas.menu(e, activa, hilo, () => { firma = ''; pintarSesion(); });
});

// --- ⭐ Volver a Sesiones y caer donde lo dejaste -------------------------------------
// Pedido de Martín (2026-08-18): "si estoy navegando por el panel y salgo de sesiones para
// entrar a otra pestaña, cuando vuelva a sesiones quiero estar exactamente donde lo dejé".
//
// ⚠⚠ Esto convive con una decisión CONTRARIA que sigue en pie: "siempre se entra por la
// bandeja de Todas" (2026-08-17). No se pisan porque no hablan del mismo momento —
// entrar de cero (un favorito, el acceso del escritorio, la barra de direcciones) es venir
// a ver qué hay y va a la bandeja; VOLVER desde otra pantalla del panel es seguir donde
// estabas. Se distinguen mirando de dónde venís (`document.referrer`).
const PANTALLAS_PANEL = ['/', '/pizarra', '/estudio', '/avisos'];

function vengoDelPanel(){
  try {
    const r = new URL(document.referrer);
    if (r.origin !== location.origin) return false;
    return PANTALLAS_PANEL.includes((r.pathname || '/').replace(/\/+$/, '') || '/');
  } catch (e) { return false; }
}

function guardarSitio(){
  const c = $('#cuerpo');
  try {
    localStorage.setItem('sesSitio', JSON.stringify({
      activa, proy, viendoArchivadas,
      filtro: ($('#filtro') && $('#filtro').value) || '',
      scroll: c ? Math.round(c.scrollTop) : 0,
    }));
  } catch (e) { /* si no se puede guardar, se vuelve a la bandeja y listo */ }
}
// ⚠ `pagehide` y no `beforeunload`: éste último no siempre corre al navegar y encima
// algunos navegadores lo tratan como "voy a preguntar si querés salir". Y también al
// esconderse la pestaña, por si el navegador la descarta sin avisar.
addEventListener('pagehide', guardarSitio);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarSitio(); });
// Y lo mismo con el borrador: lo que estaba esperando el respiro de 700 ms se manda antes
// de irse. El `keepalive` del fetch es lo que hace que ese pedido llegue igual.
addEventListener('pagehide', soltarBorrador);
document.addEventListener('visibilitychange', () => { if (document.hidden) soltarBorrador(); });

function volverAlSitio(){
  let s;
  try { s = JSON.parse(localStorage.getItem('sesSitio') || 'null'); } catch (e) { return false; }
  if (!s) return false;
  if (s.proy) proy = s.proy;
  viendoArchivadas = !!s.viendoArchivadas;
  scrollPendiente = s.scroll || 0;
  if (s.activa && abiertas.some(t => t.sid === s.activa)){
    irTab(s.activa);
    recienAbierta = false;           // no caer al final: volvés al renglón donde estabas
  } else {
    activa = null;
    firma = ''; pintarCarpetas(); pintarTabs(); pintar();
  }
  // ⚠ El filtro NO se puede escribir en el campo y listo: `cargar()` termina un segundo
  // después y repinta la lista entera, con lo que el campo se rehace vacío y lo escrito
  // se pierde. Va como pendiente y lo toma el primer pintado que lo encuentre.
  if (s.filtro) filtroPendiente = s.filtro;
  return true;
}

// --- Entrar por una dirección: `/sesiones?c=<id>` ------------------------------------
// Dos caminos, del más barato al más caro:
//   1. la charla YA está entre tus pestañas (viene del localStorage): se abre en el acto,
//      sin esperar a nadie;
//   2. no está (un favorito, una pestaña nueva del navegador, otra computadora): se le
//      pregunta al servidor en qué carpeta vive, mandándole el id pelado.
// ⚠ No se espera a `/movil/sesiones` para resolverla: esa lista tarda hasta un segundo y
// además está topeada al último mes, así que un favorito viejo no aparecería ahí.
async function entrarPorDireccion(){
  const sid = window.Direccion ? Direccion.leer().c : '';
  const carpeta = window.Direccion ? Direccion.leer().p : '';
  // Una carpeta en la dirección (la pestaña que abre el botón del medio, un F5, un
  // favorito): se entra a su bandeja. No hace falta esperar la lista: si todavía no
  // llegó, el próximo `cargar()` la pinta ya parada ahí.
  // ⚠ Pero si venís de otra pantalla del panel y estabas en ESA misma carpeta, se te
  // devuelve la vista entera (filtro, renglón): la vuelta desde el Estudio trae `?p=`.
  if (!sid && carpeta){
    let s = null;
    try { s = JSON.parse(localStorage.getItem('sesSitio') || 'null'); } catch (e) {}
    if (vengoDelPanel() && s && s.proy === carpeta && !s.activa && volverAlSitio())
      return fijarDireccion({empujar: false});
    irProyecto(carpeta); return;
  }
  if (!sid){
    // Sin conversación en la dirección: si venís de otra pantalla del panel, se te
    // devuelve la vista donde la dejaste; si entrás de cero, la bandeja de siempre.
    if (vengoDelPanel() && volverAlSitio()){ fijarDireccion({empujar: false}); return; }
    return fijarDireccion({empujar: false});           // la bandeja: solo el título
  }
  const t = abiertas.find(x => x.sid === sid);
  if (t) return irTab(sid);
  const d = await Direccion.donde(sid);
  if (d) return abrirSesion(d.cwd, sid, d.nombre);
  perdida = sid; firma = ''; pintarLista();
}

// ⚠ Varias pestañas del NAVEGADOR comparten el mismo `localStorage`, así que la barra de
// pestañas de arriba es una sola para todas: si en una ventana abrís otra charla, la de
// al lado no se enteraba y en el siguiente `guardar()` la pisaba (la pestaña recién
// abierta desaparecía sola). Con esto cada ventana adopta la lista nueva apenas cambia.
// ⭐ Lo que NO se adopta es qué charla estás mirando: eso lo manda la dirección de ESTA
// ventana, que es todo el punto de tener una dirección por conversación. Si la lista que
// llega no la trae, se la devuelve.
addEventListener('storage', e => {
  if (e.key !== 'sesTabs') return;
  let lista;
  try { lista = JSON.parse(e.newValue || '[]'); } catch (err) { return; }
  if (!Array.isArray(lista)) return;
  const mia = abiertas.find(t => t.sid === activa);
  abiertas = lista;
  if (mia && !abiertas.some(t => t.sid === mia.sid)) abiertas.push(mia);
  pintarTabs();
});

// La flecha ← del navegador: vuelve a la conversación anterior, o a la bandeja.
// ⚠ Acá NO se vuelve a escribir la dirección (el navegador ya la cambió): `irTab` la
// escribe igual, pero como es la misma que ya está puesta, `Direccion.fijar` no toca el
// historial. Sin esa guarda, cada ← agregaría una entrada nueva y no se saldría más.
if (window.Direccion) Direccion.alVolver(async estado => {
  if (!estado.c){
    activa = null; proy = estado.p || TODAS; recienAbierta = true;
    fijarDireccion({empujar: false});
    firma=''; pintarCarpetas(); pintarTabs(); pintar();
    return;
  }
  if (estado.c === activa) return;
  if (abiertas.some(x => x.sid === estado.c)) return irTab(estado.c);
  const d = await Direccion.donde(estado.c);
  if (d) abrirSesion(d.cwd, estado.c, d.nombre);
});

// ⚠ `entrarPorDireccion()` NO se llama acá: abrir una charla dibuja la pantalla entera,
// y el explorador de archivos (`arb`) todavía no existe en este renglón — reventaba con
// "Cannot access 'arb' before initialization". Se llama al final del archivo.
cargar();
mirarNovedades();
setInterval(mirarNovedades, 8000);
// ⭐ El en vivo de la charla, de a UN pedido por vez (2026-11-10). Antes cada 3 s salía un
// pedido nuevo aunque el anterior no hubiera vuelto: con el panel lento se apilaban, cada
// uno lo hacía más lento todavía, y la pantalla quedaba mostrando algo viejo. Ahora el tic
// se saltea mientras haya uno en vuelo. ⚠ Con vencimiento (20 s): un pedido que no vuelve
// nunca —se cortó la red del celular, se reinició el panel— no puede dejar la charla muda.
let sondeoDesde = 0;
setInterval(() => {
  if (!activa || (sondeoDesde && Date.now() - sondeoDesde < 20000)) return;
  sondeoDesde = Date.now();
  Promise.resolve(pintarSesion()).catch(() => {}).finally(() => { sondeoDesde = 0; });
}, 3000);
// La bandeja se actualiza sola cada 8 s: veinte era demasiado, mandabas un mensaje,

}, 1000);

// Y al volver a esta pestaña del navegador, refresca al instante en vez de esperar
// el próximo tic: es justo cuando uno viene a mirar cómo quedó.
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });

// --- El explorador de archivos del proyecto ----------------------------------
// Pedido de Martín (2026-08-17): "quiero el explorador de archivos del proyecto al
// lateral izquierdo, como Visual Studio". Muestra los archivos de la CARPETA donde
// estás parado (la marcada arriba, o la de la conversación abierta si estás en
// "Todas"), y al tocar uno se lee a la derecha.
// ⭐ Es de MIRAR: no edita, no borra, no mueve nada. Para cambiar un archivo está la
// conversación, que es la que sabe lo que está haciendo; un explorador que además
// escribe es otra cosa y se decide aparte.
// ⭐ Los hijos de una carpeta se piden RECIÉN al abrirla: un proyecto de verdad tiene
// miles de archivos y pedirlos todos de entrada sería la lista de 240 sesiones otra vez.
const arb = {cwd:'', nom:'', hijos:{}, demas:{}, abiertas:new Set(), sel:'',
             nota:'Elegí una carpeta arriba y acá aparecen sus archivos.'};
let verArchivo = null;      // el archivo que se está mirando (null = la conversación)
let verCrudo = false;       // un .md se dibuja; con esto se ve el texto tal cual

const ICONOS = {py:'🐍', js:'📜', json:'⚙', jsonl:'📋', html:'🌐', css:'🎨', md:'📝',
                txt:'📄', yml:'⚙', yaml:'⚙', bat:'▶', cmd:'▶', vbs:'▶', ps1:'▶',
                log:'📋', png:'🖼', jpg:'🖼', jpeg:'🖼', gif:'🖼', webp:'🖼', svg:'🖼',
                ico:'🖼', wav:'🎵', mp3:'🎵', m4a:'🎵', mp4:'🎬', zip:'📦', env:'🔑'};
const iconoDe = n => ICONOS[(n.split('.').pop() || '').toLowerCase()] || '📄';
const pesoDe = b => b < 1024 ? b + ' B'
                  : b < 1048576 ? (b/1024).toFixed(1).replace('.', ',') + ' kB'
                  : (b/1048576).toFixed(1).replace('.', ',') + ' MB';

// De qué carpeta se muestran los archivos: la marcada arriba manda, y si estás en
// "Todas" (que no es un proyecto) vale la de la conversación que tenés abierta.
function cwdDelArbol(){
  const p = datos.proyectos.find(x => x.proyecto === proy);
  if (p && p.cwd) return {cwd: p.cwd, nom: p.proyecto};
  const t = abiertas.find(x => x.sid === activa);
  if (t && t.cwd) return {cwd: t.cwd, nom: proyectoDe(t) || t.cwd};
  // ⭐ En "Todas" no hay ninguna carpeta parada, y el explorador se vaciaba justo en la
  // pantalla donde uno más tiempo pasa: quedaba un cartelito y parecía que no estaba
  // (Martín, 2026-08-17: "no sé dónde quedó el explorador"). Se queda mostrando la
  // ÚLTIMA carpeta que miraste, como hace VS Code, hasta que elijas otra.
  try {
    const u = JSON.parse(localStorage.getItem('sesArbolCwd') || 'null');
    if (u && u.cwd) return u;
  } catch(e){ /* si quedó algo raro guardado, se ignora */ }
  return {cwd:'', nom:''};
}

// Se llama en CADA pintado y casi siempre no hace nada: solo reacciona cuando
// cambiaste de carpeta. Si no, cada repintado de 8 s te cerraría las ramas abiertas.
function sincronizarArbol(){
  const d = cwdDelArbol();
  if (d.cwd === arb.cwd) return;
  arb.cwd = d.cwd; arb.nom = d.nom;
  arb.hijos = {}; arb.demas = {}; arb.abiertas = new Set(); arb.sel = ''; arb.nota = '';
  // ⚠ El título dice SIEMPRE "Archivos". Antes mostraba solo el nombre del proyecto, y
  // con el panel plegado esa tira decía "▸ wpp-transcriptor": imposible adivinar que ahí
  // adentro estaban los archivos. El botoncito tiene que decir qué trae de vuelta.
  $('#arbolNom').textContent = arb.nom ? 'Archivos · ' + arb.nom : 'Archivos';
  $('#arbolNom').title = arb.cwd || '';
  if (arb.cwd){
    localStorage.setItem('sesArbolCwd', JSON.stringify({cwd: arb.cwd, nom: arb.nom}));
    cargarCarpeta('');
  } else { arb.nota = 'Elegí una carpeta arriba y acá aparecen sus archivos.'; pintarArbol(); }
}

async function cargarCarpeta(sub){
  try {
    const r = await fetch('/archivos/lista?cwd=' + encodeURIComponent(arb.cwd) +
                          '&sub=' + encodeURIComponent(sub));
    // La pantalla se sirve del disco y se actualiza sola, pero las direcciones nuevas
    // viven adentro de panel.py y no existen hasta que se lo reinicie. Sin este aviso,
    // el explorador se veía vacío y parecía roto.
    if (r.status === 404){
      arb.nota = '⚠ Falta reiniciar el panel: el explorador ya está, pero sus ' +
                 'direcciones todavía no existen en el panel que está corriendo.';
      return pintarArbol();
    }
    const d = await r.json();
    if (!d.ok){ arb.nota = d.error || 'No pude leer esa carpeta.'; return pintarArbol(); }
    arb.nota = '';
    arb.hijos[sub] = d.items;
    arb.demas[sub] = d.de_mas || 0;
  } catch(e){ arb.nota = 'No pude leer la carpeta: ' + e; }
  pintarArbol();
}

function filasArbol(sub, nivel){
  let html = (arb.hijos[sub] || []).map(it => {
    const ruta = sub ? sub + '/' + it.nombre : it.nombre;
    const ab = arb.abiertas.has(ruta);
    return '<div class="nodo' + (arb.sel === ruta ? ' sel' : '') + '" data-r="' + esc(ruta) +
      '" data-d="' + (it.dir ? 1 : 0) + '" title="' + esc(ruta) +
      (it.dir ? '' : ' · ' + pesoDe(it.bytes)) + '"' +
      ' style="padding-left:' + (7 + nivel * 13) + 'px">' +
      '<span class="fle">' + (it.dir ? (ab ? '▾' : '▸') : '') + '</span>' +
      '<span class="ico">' + (it.dir ? (ab ? '📂' : '📁') : iconoDe(it.nombre)) + '</span>' +
      '<span class="nom">' + esc(it.nombre) + '</span></div>' +
      (it.dir && ab ? filasArbol(ruta, nivel + 1) : '');
  }).join('');
  if (arb.demas[sub])
    html += '<div class="arbolNota" style="padding-left:' + (24 + nivel * 13) + 'px">…y ' +
            arb.demas[sub] + ' más: son demasiados para mostrarlos</div>';
  return html;
}

function pintarArbol(){
  const c = $('#arbol');
  if (!c) return;
  c.innerHTML = (arb.nota ? '<div class="arbolNota">' + esc(arb.nota) + '</div>' : '') +
                (arb.cwd ? filasArbol('', 0) : '');
  c.querySelectorAll('.nodo').forEach(el => {
    el.onclick = () => {
      const ruta = el.dataset.r;
      if (el.dataset.d !== '1') return abrirArchivo(ruta);
      if (arb.abiertas.has(ruta)) arb.abiertas.delete(ruta);
      else {
        arb.abiertas.add(ruta);
        if (!arb.hijos[ruta]) return cargarCarpeta(ruta);   // ella repinta al volver
      }
      pintarArbol();
    };
  });
}

async function abrirArchivo(ruta){
  arb.sel = ruta; verCrudo = false; pintarArbol();
  try {
    const d = await (await fetch('/archivos/ver?cwd=' + encodeURIComponent(arb.cwd) +
                                 '&ruta=' + encodeURIComponent(ruta))).json();
    if (!d.ok) return alert(d.error || 'No pude abrirlo');
    verArchivo = Object.assign({cwd: arb.cwd}, d);
  } catch(e){ return alert('No pude abrirlo: ' + e); }
  firma = ''; pintar();
}

function cerrarArchivo(){
  verArchivo = null; arb.sel = '';
  firma = ''; recienAbierta = true;
  pintarArbol(); pintar();
}

function pintarArchivo(){
  const a = verArchivo;
  const md = a.tipo === 'texto' && /\.md$/i.test(a.nombre);
  const cuando = new Date((a.ts || 0) * 1000).toLocaleString('es-AR');
  let cuerpo;
  if (a.tipo === 'imagen')
    cuerpo = '<img class="vImg" src="/archivos/crudo?cwd=' + encodeURIComponent(a.cwd) +
             '&ruta=' + encodeURIComponent(a.ruta) + '">';
  else if (a.tipo === 'binario')
    cuerpo = '<div class="vacio">Esto no es texto (' + pesoDe(a.bytes) + '): hay que ' +
             'abrirlo con el programa que le corresponda.</div>';
  else if (a.tipo === 'pesado')
    cuerpo = '<div class="vacio">Pesa ' + pesoDe(a.bytes) + ': demasiado para mostrarlo acá.</div>';
  else if (md && !verCrudo)
    cuerpo = marcar(a.texto);
  else {
    // Los números de renglón van en su propia columna: adentro del texto se copiarían
    // junto con el código y no servirían para nada.
    const cuantas = a.texto.split('\n').length;
    cuerpo = '<div class="codigo"><div class="ren">' +
             Array.from({length: cuantas}, (_, i) => i + 1).join('\n') +
             '</div><pre>' + esc(a.texto) + '</pre></div>';
  }
  const html = '<div class="vCab"><b>' + esc(a.nombre) + '</b>' +
    '<small>' + esc(a.ruta) + ' · ' + pesoDe(a.bytes) + ' · ' + esc(cuando) + '</small>' +
    (md ? '<div class="op" id="vCrudo">' + (verCrudo ? '📖 dibujado' : '🔤 tal cual') + '</div>' : '') +
    '<div class="op" id="vCopiar">📋 copiar la ruta</div>' +
    (activa ? '<div class="op" id="vPasar">📎 pasársela a la charla</div>' : '') +
    '<div class="op cerrar" id="vCerrar">✕ cerrar</div></div>' +
    (a.cortado ? '<div class="aviso">Es grande: se muestra el principio nomás.</div>' : '') +
    cuerpo;
  if (html === firma) return;
  firma = html;
  $('#cuerpo').innerHTML = html;
  $('#cuerpo').scrollTop = 0;
  $('#vCerrar').onclick = cerrarArchivo;
  $('#vCopiar').onclick = async () => {
    try { await navigator.clipboard.writeText(a.completo); $('#vCopiar').textContent = '✓ copiada'; }
    catch(e){ alert(a.completo); }
  };
  if ($('#vCrudo')) $('#vCrudo').onclick = () => { verCrudo = !verCrudo; firma=''; pintarArchivo(); };
  // 📎 le deja la ruta escrita en la caja de abajo: es lo que uno viene a hacer con el
  // explorador abierto al lado de una conversación ("mirá este archivo").
  if ($('#vPasar')) $('#vPasar').onclick = () => {
    const c = $('#texto');
    c.value = (c.value ? c.value.trimEnd() + ' ' : '') + a.completo + ' ';
    c.focus(); ajustarCaja();
  };
}

// --- ⭐ Esconder las barras de arriba: un botón por cosa ------------------------------
// Pedido de Martín (2026-08-18), en tres pasos y vale la pena seguirlos porque la
// conclusión no era obvia:
//   1. "me gustaría poder ocultar cada sección individualmente" -> se hizo un menú 👁 con
//      una tilde por franja. Lo rechazó apenas lo vio: "no me convence".
//   2. "quiero un botón simple para ocultar ambas, así tengo la pantalla del chat
//      completa" -> el ⤢.
//   3. "un botón para cada una individualmente" -> además, el ▭ y el ⧉.
//   4. "no me convence ese botón de hamburguesa, yo quiero que se oculte la barra entera,
//      no solo las pestañas" -> el ▭ se lleva la FILA ENTERA, con sus propios botones
//      adentro, y deja de ser un ☰ (la hamburguesa quiere decir "abrir un menú", justo lo
//      contrario de lo que hace).
// O sea: lo que no quería era ELEGIR EN UN MENÚ. Un botón por cosa, a la vista y de un
// toque, es exactamente lo mismo que ofrecía el menú y sí le sirve. La diferencia no está
// en cuánto se puede configurar sino en cuántos gestos cuesta. Y esconder algo tiene que
// devolver EL LUGAR que ocupaba: media barra vacía no es esconderla.
//
// El ▭ esconde la barra de arriba entera y el ⧉ la fila de conversaciones.
let ver = {};
try { ver = JSON.parse(localStorage.getItem('sesVer') || '{}') || {}; } catch(e){}
const seVe = k => ver[k] !== false;

function aplicarVer(){
  // ⚠ `menu` esconde la FILA, no el `<nav>` de las pantallas: sacarle las pastillas y
  // dejar la tira con los cuatro botones no le devolvía a la conversación ni un pixel.
  document.body.classList.toggle('sin-arriba', !seVe('menu'));
  $('#barra').style.display = seVe('tabs') ? '' : 'none';
  // Apagado, el botón queda tenue: así se ve de una que eso está escondido y que ahí
  // mismo se lo vuelve a prender. (El de la barra de arriba se va con ella; para ese
  // está el ⤡ flotando, que es el único camino de vuelta.)
  $('#btnTabs').classList.toggle('off', !seVe('tabs'));
  $('#btnTabs').title = (seVe('tabs') ? 'Esconder' : 'Mostrar') + ' la fila de conversaciones';
  localStorage.setItem('sesVer', JSON.stringify(ver));
  if (window.menuAcomodar) menuAcomodar();   // el menú mide su lugar solo
}
$('#btnMenu').onclick = () => { ver.menu = false; aplicarVer(); };
$('#btnTabs').onclick = () => { ver.tabs = !seVe('tabs'); aplicarVer(); };
aplicarVer();

// ⚠⚠ Escondida la barra de arriba —sola con el ▭, o junto con la otra con el ⤢— se van con

// ⭐ La columna de la DERECHA (2026-10-20), la del Claude Desktop: Entorno, Contexto,
// Conectores y el Navegador. Se pide entera a `/movil/entorno` y solo mientras está
// abierta: cerrada no cuesta nada. Lo abierto/cerrado de cada tarjeta queda guardado.
const derAbierta = () => document.body.classList.contains('derecha-abierta');
let derClave = '', derHora = 0, derPidiendo = false;

// ⭐⭐ Las PIEZAS de la columna de la derecha, y su ancho (2026-11-10). Martín quiere acá la
// terminal y el navegador, "como en Claude Code"; esto es el lugar donde van a vivir.
//   Paneles.registrar({id, titulo, anchoMin, alMostrar(caja), alOcultar()})  → la caja
//   Paneles.mostrar(id)   Paneles.actual()   Paneles.caja(id)
// · Una pieza a la vista por vez. Las pestañas aparecen con más de una pieza anotada.
// · `alMostrar` se llama cuando la pieza queda A LA VISTA de verdad (su pestaña elegida Y
//   la columna abierta), y `alOcultar` cuando deja de estarlo por cualquiera de los dos
//   motivos: es lo que le permite a una pieza cara (una terminal, una filmación) no gastar
//   nada mientras nadie la mira.
// · `anchoMin` ensancha la columna la primera vez que hace falta; desde que arrastrás el
//   tirador, manda tu ancho y no se vuelve a tocar solo.
const Paneles = (() => {
  const piezas = [];
  const ANCHO_FABRICA = 300, ANCHO_PISO = 260, CHARLA_PISO = 420;
  let actual = localStorage.getItem('sesDerPestana') || 'entorno';
  let ancho = +localStorage.getItem('sesDerAncho') || 0;      // 0 = nunca lo arrastraste
  let aLaVista = null;                                         // la pieza que hoy se ve

  // Hasta dónde puede crecer: que a la charla le queden por lo menos CHARLA_PISO px.
  function tope(){
    const riel = document.querySelector('aside');
    const izq = riel ? riel.getBoundingClientRect().width : 0;
    return Math.max(ANCHO_PISO, innerWidth - izq - CHARLA_PISO);
  }
  function ponerAncho(px){
    const a = Math.round(Math.max(ANCHO_PISO, Math.min(tope(), px)));
    document.documentElement.style.setProperty('--der-ancho', a + 'px');
    return a;
  }
  if (ancho) ponerAncho(ancho);

  function pintarTabs(){
    const t = $('#derTabs');
    t.classList.toggle('varias', piezas.length > 1);
    t.innerHTML = piezas.map(p => '<button type="button" role="tab" data-pieza="' + esc(p.id) + '"' +
      (p.id === actual ? ' class="sel" aria-selected="true"' : ' aria-selected="false"') +
      '>' + esc(p.titulo) + '</button>').join('');
  }
  // Quién queda a la vista después de un cambio (de pestaña, o de abrir/cerrar la columna),
  // avisándole al que se va y al que llega. Una sola función para los dos casos: así no
  // puede pasar que una pieza quede "mostrada" con la columna cerrada.
  function acomodar(){
    const debe = derAbierta() ? (piezas.find(p => p.id === actual) || null) : null;
    if (debe === aLaVista) return;
    const antes = aLaVista;
    aLaVista = debe;
    if (antes && antes.alOcultar){ try { antes.alOcultar(); } catch (e) { console.error(e); } }
    if (debe){
      if (debe.anchoMin && !ancho){
        const hoy = parseFloat(getComputedStyle(document.documentElement)
                                 .getPropertyValue('--der-ancho')) || ANCHO_FABRICA;
        if (hoy < debe.anchoMin) ponerAncho(debe.anchoMin);
      }
      if (debe.alMostrar){ try { debe.alMostrar(debe.caja); } catch (e) { console.error(e); } }
    }
  }
  function mostrar(id){
    if (!piezas.some(p => p.id === id)) return;
    actual = id;
    localStorage.setItem('sesDerPestana', id);
    piezas.forEach(p => { p.caja.hidden = p.id !== id; });
    pintarTabs();
    acomodar();
  }
  function registrar(p){
    if (piezas.some(x => x.id === p.id)) return Paneles.caja(p.id);
    let caja = document.querySelector('#derecha > .derPane[data-pieza="' + p.id + '"]');
    if (!caja){
      caja = document.createElement('div');
      caja.className = 'derPane';
      caja.dataset.pieza = p.id;
      $('#derecha').appendChild(caja);
    }
    piezas.push(Object.assign({}, p, {caja}));
    // Si la pestaña guardada es de una pieza que todavía no se anotó, se muestra lo que hay.
    const elegida = piezas.some(x => x.id === actual) ? actual : piezas[0].id;
    piezas.forEach(x => { x.caja.hidden = x.id !== elegida; });
    pintarTabs();
    acomodar();
    return caja;
  }
  $('#derTabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-pieza]');
    if (b) mostrar(b.dataset.pieza);
  });

  // El tirador. ⚠ Con `setPointerCapture`: una terminal o una imagen debajo del puntero se
  // quedarían con el movimiento del mouse y el arrastre se cortaría solo.
  const tirador = $('#tiradorDer');
  tirador.addEventListener('pointerdown', e => {
    if (e.button) return;
    e.preventDefault();
    tirador.setPointerCapture(e.pointerId);
    tirador.classList.add('tirando');
    const col = $('#derecha');
    const margen = parseFloat(getComputedStyle(col).marginLeft) || 0;
    const caja = col.getBoundingClientRect();
    // Dónde lo agarraste adentro del tirador: sin esto el borde salta hasta el puntero en
    // el primer movimiento (3 o 4 px de tirón, que se notan).
    const agarre = e.clientX - caja.left;
    let nuevo = 0;
    const mover = ev => { nuevo = ponerAncho(caja.right - ev.clientX + agarre + margen); };
    const soltar = () => {
      tirador.removeEventListener('pointermove', mover);
      tirador.removeEventListener('pointerup', soltar);
      tirador.removeEventListener('pointercancel', soltar);
      tirador.classList.remove('tirando');
      if (nuevo){ ancho = nuevo; localStorage.setItem('sesDerAncho', nuevo); }
    };
    tirador.addEventListener('pointermove', mover);
    tirador.addEventListener('pointerup', soltar);
    tirador.addEventListener('pointercancel', soltar);
  });
  // Doble clic: vuelve al ancho de fábrica (y las piezas vuelven a poder pedir el suyo).
  tirador.addEventListener('dblclick', () => {
    ancho = 0;
    localStorage.removeItem('sesDerAncho');
    ponerAncho(Math.max(ANCHO_FABRICA, (aLaVista && aLaVista.anchoMin) || 0));
  });
  // Achicaste la ventana: la columna no puede dejar a la charla sin lugar.
  addEventListener('resize', () => {
    const hoy = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--der-ancho'));
    if (hoy) ponerAncho(hoy);
  });

  // ⤢ Agrandar: la columna toma todo lo que puede (dejándole a la charla su piso), y otra
  // vez la devuelve a como estaba. No toca el ancho guardado: es un rato, no una preferencia.
  let antesDeAgrandar = 0;
  function agrandar(){
    const hoy = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--der-ancho')) || ANCHO_FABRICA;
    if (antesDeAgrandar && hoy >= tope() - 2){ ponerAncho(antesDeAgrandar); antesDeAgrandar = 0; return; }
    antesDeAgrandar = hoy;
    ponerAncho(tope());
  }

  return {registrar, mostrar, acomodar, agrandar,
          actual: () => (aLaVista ? aLaVista.id : ''),
          elegida: () => actual,
          caja: id => (piezas.find(p => p.id === id) || {}).caja || null};
})();

function verDerecha(abierta){
  document.body.classList.toggle('derecha-abierta', abierta);
  localStorage.setItem('sesDerecha', abierta ? '1' : '0');
  $('#btnDerecha').classList.toggle('off', !abierta);
  $('#btnDerecha').title = (abierta ? 'Esconder' : 'Mostrar') +
    ' la columna de la derecha: entorno, contexto, conectores (Ctrl+.)';
  // Les avisa a las piezas quién quedó a la vista (o que ya no se ve ninguna).
  Paneles.acomodar();
}
// La pieza de siempre. Se refresca al quedar a la vista; mientras se mira otra, no pide nada.
Paneles.registrar({id: 'entorno', titulo: 'Entorno', alMostrar: () => refrescarDerecha(true)});

// ⭐ La TERMINAL (pieza 1 de "lo que tiene Claude Code", 2026-11-10). Una terminal de verdad
// en la carpeta de la charla, adentro de la columna. El dibujo es `terminal.js` (`Consola`)
// y el PowerShell vive en el panel (`app/voz/terminales.py`).
// ⚠ Si el panel todavía no la sirve, `terminal.js` no carga, `Consola` no existe y acá no
// pasa nada: la columna queda como estaba y el ▶ sigue abriendo su ventana de siempre.
if (window.Consola){
  Consola.iniciar({
    // La carpeta de la charla abierta; sin charla, la de la carpeta que estás mirando.
    ubicacion: () => {
      const t = abiertas.find(x => x.sid === activa);
      if (t) return {cwd: t.cwd || ''};
      const p = datos.proyectos.find(x => x.proyecto === proy);
      return {cwd: (p && p.cwd) || ''};
    },
    traer: () => { verDerecha(true); Paneles.mostrar('terminal'); },
    agrandar: () => Paneles.agrandar(),
    // "Mandar a la charla" y "Arreglalo con la sesión": el texto se SUMA a lo que haya en la
    // caja y ahí queda, sin mandarse (el Enter es tuyo). Sin charla abierta no hay caja.
    alChat: texto => {
      const c = $('#texto');
      if (!activa || !c || c.disabled) return false;
      const antes = c.value.replace(/\s+$/, '');
      c.value = (antes ? antes + '\n\n' : '') + texto;
      c.dispatchEvent(new Event('input', {bubbles: true}));   // que el borrador lo guarde
      ajustarCaja();
      c.focus();
      c.setSelectionRange(c.value.length, c.value.length);
      return true;
    },
  });
  Paneles.registrar({id: 'terminal', titulo: 'Terminal', anchoMin: 560,
                     alMostrar: Consola.mostrar, alOcultar: Consola.ocultar});
  // El ▶ de los bloques de código ESCRIBE el comando en la terminal (el Enter es tuyo) en
  // vez de abrir una ventana de PowerShell. `marcado.js` pregunta acá antes de seguir.
  window.MD_CORRER = (cmd, cwd) => Consola.escribir(cmd, cwd);
}
verDerecha(localStorage.getItem('sesDerecha') === '1');
$('#btnDerecha').onclick = () => verDerecha(!derAbierta());
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key === '.') {
    e.preventDefault(); verDerecha(!derAbierta());
  }
});

function ubicDerecha(){
  const t = abiertas.find(x => x.sid === activa);
  if (!t) return null;
  return {cwd: t.cwd || '', sid: t.sid.startsWith('nueva-') ? '' : t.sid, nombre: t.nombre || ''};
}
if (window.Entorno) Entorno.iniciar({ubicacion: ubicDerecha, alCambiar: () => refrescarDerecha(true)});

async function refrescarDerecha(ya){
  if (!window.Entorno || !derAbierta() || derPidiendo || document.visibilityState === 'hidden') return;
  if (Paneles.actual() !== 'entorno') return;       // se está mirando otra pieza
  const u = ubicDerecha();
  if (!u){ $('#derEntorno').innerHTML = '<div class="notaDer">Abrí una charla para ver su entorno.</div>';
           $('#derEntorno').dataset.html = ''; return; }
  const clave = u.cwd + '|' + u.sid;
  // Mientras trabaja se refresca seguido (la foto del navegador cambia); quieta, cada tanto.
  const cada = (u.sid && (ocupadaSes[u.sid] || enVuelo[u.sid])) ? 3000 : 10000;
  if (!ya && clave === derClave && Date.now() - derHora < cada) return;
  derPidiendo = true;
  try {
    const r = await Entorno.pedir(u);
    derClave = clave; derHora = Date.now();
    Entorno.pintar($('#derEntorno'), r, u);
  } catch(e){} finally { derPidiendo = false; }
}
setInterval(() => refrescarDerecha(false), 1500);

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  if ((e.key || '').toLowerCase() !== 'b') return;
  // Adentro de la terminal Ctrl+B es de la terminal (mover el cursor, tmux…), no de la página.
  if (e.target && e.target.closest && e.target.closest('.xterm')) return;
  e.preventDefault();
  verLateral(!lateralOculto());
});

  const ramas = ['', ...arb.abiertas];

};

$('#tirador').addEventListener('pointerdown', e => {

});
