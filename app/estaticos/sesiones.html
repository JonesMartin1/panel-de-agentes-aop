<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
// Lo que escribe Claude se dibuja como markdown (`marcado.js`): antes se leian los
// asteriscos y los numerales crudos. Si por lo que sea el archivo no cargó, mejor
// texto pelado que una pantalla en blanco.
const marcar = t => window.md ? '<div class="md">' + window.md(t) + '</div>' : esc(t);
// ⭐ En qué carpeta corre el ▶ de un bloque de código: la de la conversación que estás
// mirando. Casi todo comando de un proyecto da por sentado que estás parado adentro.
window.MD_CWD = () => (abiertas.find(t => t.sid === activa) || {}).cwd || '';
// ⭐⭐ La lista de la última vez, para que la pantalla APAREZCA DIBUJADA y no con un
// "Cargando…" (pedido de Martín, 2026-08-18: "me gustaría que sea instantánea la
// transición"). Pedirle la lista al servidor tarda medio segundo largo aunque el servidor
// sea rápido —hay que ir y volver—, así que se dibuja lo último que se supo y cuando llega
// lo fresco se repinta solo. Son 25 kB de JSON.
// ⚠ Lo que se ve del primer pintado puede estar viejo (unos segundos, o lo de ayer si
// hace mucho que no entrás): el semáforo se corrige en cuanto llega la respuesta.
let datos = {proyectos:[]};
try {
  const guardado = JSON.parse(localStorage.getItem('sesDatos') || 'null');
  if (guardado && Array.isArray(guardado.proyectos)) datos = guardado;
} catch(e){}
// Siempre se entra por la bandeja de todas: uno viene del panel a ver qué hay,
// no a una carpeta puntual (pedido de Martín, 2026-08-17).
let proy = '✉ Todas las conversaciones';
let abiertas = JSON.parse(localStorage.getItem('sesTabs') || '[]');
let activa = null, enVuelo = {}, firma = '', carpetaVista = '';
// --- ⭐ El ECO: la burbuja provisoria de lo que acabás de mandar --------------------
// Se dibuja al toque para que no sientas que tu mensaje se perdió, y se borra sola
// cuando ese mismo mensaje APARECE EN EL HILO (que es cuando ya está de verdad).
//
// ⚠⚠ Cómo se decide "ya llegó" costó tres intentos, y los dos primeros están mal:
//  1. "mirá los últimos 4 mensajes" → el eco se duplicaba en cuanto la sesión contestaba
//     con varios mensajes seguidos.
//  2. "acordate en qué POSICIÓN estaba el hilo al mandarlo y mirá de ahí en adelante"
//     (2026-08-21) → parece razonable, pero `/movil/chat` devuelve **solo los últimos
//     40 mensajes**: pasada esa marca la lista deja de crecer, la posición guardada cae
//     SIEMPRE al final, y no se mira ni un mensaje. O sea: en toda charla larga el eco
//     quedaba pegado y veías tu mensaje DOS veces hasta que terminaba el turno. Es lo
//     que Martín reportó dos veces el 2026-08-22, la segunda con el arreglo ya puesto.
//  3. (lo que hay) **contar, no ubicar**: cuántas veces está tu texto entre lo tuyo del
//     hilo. Si ahora está una vez más que cuando lo mandaste, llegó. No depende de
//     posiciones ni de cuántos mensajes devuelva el servidor, y aguanta que mandes dos
//     veces lo mismo.
let hiloVisto = {}, vecesVuelo = {}, fotosVuelo = {}, vecesFotosVuelo = {};
// El texto "pelado" para comparar: sin el corchete de contexto que el canal le pega
// adelante (la marca de una imagen, por ejemplo), sin el clip que el servidor agrega
// cuando la foto no está, y con los espacios aplastados — tu mensaje viaja con saltos
// CRLF y volvía guardado distinto de como lo escribiste.
const suelto = x => (x||'').replace(/\[[^\]]*\]/g,'').replace(/📎/g,'')
                           .replace(/\s+/g,' ').trim();
function cuentaTuya(mensajes, texto){
  const b = suelto(texto);
  if(!b) return 0;
  return (mensajes||[]).filter(m => m.de==='vos' && suelto(m.texto)===b).length;
}
// Una foto sin texto no se puede comparar con "(imagen)": lo que prueba que llegó es
// que apareció una foto más entre tus mensajes. Se cuenta, igual que el texto, para no
// confundirla con las que ya había en una charla larga.
const cuentaFotos = mensajes => (mensajes||[]).filter(m => m.de==='vos')
  .reduce((total, m) => total + (m.imgs||[]).length, 0);
// Con foto Y texto manda el texto: sigue identificando el mensaje aunque, al entrar en
// la ventana de 40, la foto nueva empuje afuera una vieja y el total de fotos no cambie.
// El conteo de fotos queda solamente para el envío realmente sin texto (`(imagen)`).
function llegoEco(mensajes, texto, conFoto, textosAntes, fotosAntes){
  return conFoto && texto === '(imagen)'
    ? cuentaFotos(mensajes) > (fotosAntes ?? 0)
    : cuentaTuya(mensajes, texto) > (textosAntes ?? 0);
}
const fotosHtml = urls => (urls||[]).map(u =>
  '<img src="' + u + '" onclick="window.open(this.src)">').join('');
function soltarFotosVuelo(sid){
  (fotosVuelo[sid]||[]).forEach(u => URL.revokeObjectURL(u));
  delete fotosVuelo[sid]; delete vecesFotosVuelo[sid];
}
// ⭐ La pregunta de compactar (2026-08-20): el servidor ya no compacta solo — cuando
// una charla pasa el tope, el turno vuelve con `pide_compactar` y acá se le pregunta
// a Martín. "Ahora no" la calla media hora para esa charla.
let pideCompactar = {}, silencioComp = {};
let arranque = {};        // cuándo empezó a pensar cada sesión, para el relojito
let parados = {};         // las que cortaste vos: su error no es una falla
// "Acabás de entrar acá": lo pone irTab() e irProyecto(), y lo usa el pintado para
// caer al final de la conversación (o al principio de la lista) UNA vez. Sin esto, el
// contenedor conservaba el scroll de la pantalla anterior y abrías una charla en
// cualquier lado (pedido de Martín, 2026-08-17).
let recienAbierta = false;
// ⭐ "Volvé a dejarme donde estaba": cuando volvés a Sesiones desde otra pantalla del
// panel, la vista se restaura tal cual (pedido de Martín, 2026-08-18). Acá viaja el
// scroll que hay que devolver; lo aplica el primer pintado y se borra solo.
let scrollPendiente = null;
let filtroPendiente = null;   // y lo que habías escrito en "Filtrar…"
// Sesiones que ya te contestaron y todavía no fuiste a leer: la pestaña queda
// amarilla hasta que la abrís (pedido de Martín, 2026-08-17: con varias sesiones
// trabajando a la vez, no había forma de saber cuál te estaba esperando).
let pendientes = JSON.parse(localStorage.getItem('sesPendientes') || '{}');
// Conversaciones donde lo último que intentaste FALLÓ (el turno volvió con error, se
// cortó la conexión, o se pasó de los 10 minutos que aguanta el panel). Se pintan en
// rojo hasta que las abrís o hasta que un mensaje entra bien: es el único estado de
// esta pantalla que quiere decir "algo está mal" (pedido de Martín, 2026-08-17).
let falladas = JSON.parse(localStorage.getItem('sesFalladas') || '{}');
// --- ⭐ EL BORRADOR de cada conversación ---------------------------------------------
// Pedido de Martín (2026-08-18): "quiero que lo que yo escriba dentro de una sesión quede
// guardado como borrador y se pueda ver en TODAS, con una señalización que diga que está
// en borrador, con un color y una animación". Es el borrador del correo.
// ⭐ La verdad la tiene el SERVIDOR (`/movil/borradores`), no el navegador: es la misma
// conversación en la compu y en el teléfono, así que lo que empezaste a escribir en una
// pantalla tiene que estar en la otra. Esta copia local es para que la chapa aparezca EN
// EL ACTO mientras escribís, sin esperar ninguna respuesta.
// ⚠ Vacío se guarda como '' y NO se borra la entrada: '' quiere decir "de ésta sabemos
// que no tiene", y es lo que apaga la chapa al toque cuando vaciás la caja. Sin eso caía
// al anticipo que trae la lista —que todavía es el viejo— y la chapa quedaba prendida.
let borradores = {};
try { borradores = JSON.parse(localStorage.getItem('sesBorradores') || '{}') || {}; } catch(e){}
const guardarBorradores = () =>
  localStorage.setItem('sesBorradores', JSON.stringify(borradores));
// El texto de un borrador: el que tenemos entero, y si de esa conversación no sabemos
// nada, el anticipo (120 letras) que viene en la lista del servidor.
const borradorDe = (sid, anticipo) =>
  borradores[sid] !== undefined ? borradores[sid] : (anticipo || '');
const hayBorrador = (sid, anticipo) => !!borradorDe(sid, anticipo).trim();
// Lo que se muestra abajo del título: una línea, sin saltos ni espacios de más.
function vistaBorrador(sid, anticipo){
  const t = borradorDe(sid, anticipo).replace(/\s+/g, ' ').trim();
  return t.length > 90 ? t.slice(0, 90) + '…' : t;
}
// Guardar lo tipeado: en el acto acá, y al servidor con un respiro de 700 ms — guardar en
// cada tecla serían cien avisos por una frase (misma regla que la rueda de color del 🎨).
let borradorTimer = null;
let borradorPuesto = {};      // lo último que ya se le mandó al servidor, para no repetir

function anotarBorrador(sid, texto){
  if (!sid) return;
  const antes = hayBorrador(sid);
  borradores[sid] = texto || '';
  guardarBorradores();
  // Se repinta solo cuando la chapa APARECE o SE VA, nunca en cada tecla.
  if (antes !== hayBorrador(sid)){ firma = ''; pintarTabs(); if (!activa) pintar(); }
  clearTimeout(borradorTimer);
  borradorTimer = setTimeout(() => empujarBorrador(sid), 700);
}

// ⚠ Las charlas sin estrenar (`nueva-…`) NO viajan al servidor: ese id es provisorio y no
// significa nada en otra pantalla ni mañana. Su borrador se queda en este navegador.
function empujarBorrador(sid){
  if (!sid || sid.startsWith('nueva-')) return;
  const texto = borradores[sid] || '';
  if (borradorPuesto[sid] === texto) return;         // ya está guardado así
  borradorPuesto[sid] = texto;
  // `keepalive` para que el guardado llegue aunque te estés yendo de la página.
  fetch('/movil/borrador', {method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({sid, texto}), keepalive: true})
    .catch(() => { delete borradorPuesto[sid]; });   // que reintente en la próxima tecla
}

// Antes de cambiar de conversación o de irte de la pantalla: lo que estaba esperando el
// respiro se manda ya. Si no, cerrar la pestaña dentro de esos 700 ms perdía lo tipeado.
function soltarBorrador(){
  clearTimeout(borradorTimer);
  if (activa) empujarBorrador(activa);
}
// Conversaciones sacadas de la bandeja.
// ⭐⭐ LA VERDAD LA TIENE EL SERVIDOR (`s.archivada`, de sesiones_archivadas.json) y nada
// más. Esto de acá es SOLO lo que todavía no confirmó: `{sid: true|false}`, para que la
// fila desaparezca (o vuelva) en el acto y para no perder el cambio si el panel no
// contesta. En cuanto el servidor dice que sí, la entrada se borra y manda él.
// ⚠⚠ NO volver a la versión anterior, que era un Set de ids guardado en el navegador y
// OR-eado con el flag del servidor (`archivadas.has(id) || s.archivada`). Ese Set solo
// crecía y se vaciaba en el navegador donde tocabas: devolver una charla desde el celular
// la sacaba del servidor pero la compu seguía teniéndola en SU copia, así que ahí quedaba
// archivada PARA SIEMPRE y no había ningún botón que la rescatara. Es el mismo defecto que
// tenían los íconos de carpeta antes de `aspecto_carpetas.json` (2026-08-25): identidad
// guardada por navegador = cada pantalla con su propia verdad.
let archPend = JSON.parse(localStorage.getItem('sesArchPend') || '{}');
// La copia vieja se descarta a propósito: sus ids son justamente los que quedaron
// pegados. Lo que de verdad archivaste ya está en el servidor, que es quien contesta.
localStorage.removeItem('sesArchivadas');
const guardarArchPend = () => localStorage.setItem('sesArchPend', JSON.stringify(archPend));
// ¿Está archivada? Manda el pendiente si hay uno; si no, lo que dice el servidor.
const esArchivada = s => (s.id in archPend) ? archPend[s.id] : !!s.archivada;
let viendoArchivadas = false;
// Entraste con la dirección de una conversación que ya no existe (un favorito viejo de
// algo borrado). Se avisa en la bandeja: sin esto, el favorito te dejaba mirando la
// lista de siempre sin ninguna pista de por qué no pasó nada.
let perdida = '';
// ⭐ Las pestañas se agrupan por proyecto y se ve desplegado UNO SOLO a la vez (pedido de
// Martín, 2026-08-17). Uno solo es lo que mantiene la barra corta, que es el problema que
// vino a resolver: con ocho charlas abiertas de cuatro proyectos no entraba ninguna
// entera. Acá vive cuál está desplegado; se acuerda entre visitas, como las pestañas.
let grupoAbierto = localStorage.getItem('sesGrupo') || '';
const SINCARPETA = 'Sin carpeta';

// --- ⭐ Las tarjetitas se pintan y se renombran a mano --------------------------------
// Pedido de Martín (2026-08-18): "me gustaría poder cambiar las tarjetitas, tanto la de
// sesión como la de proyecto". Botón derecho encima de cualquiera de las dos.
// ⚠ Los tonos son APAGADOS a propósito y ninguno es el verde, el amarillo ni el rojo del
// semáforo: la tarjeta es tuya, pero el estado tiene que seguir leyéndose. Igual el color
// elegido le gana al fondo del semáforo (va en el estilo del elemento), así que el estado
// queda contado por el PUNTITO, que no se pinta nunca.
const TONOS = {
  azul:     ['var(--c16273f,#16273f)', 'var(--c38618f,#38618f)', 'var(--ca8cdf5,#a8cdf5)'],
  violeta:  ['var(--c241d3a,#241d3a)', 'var(--c4d3d7a,#4d3d7a)', 'var(--cc4b5fd,#c4b5fd)'],
  rosa:     ['var(--c331b28,#331b28)', 'var(--c6b3b53,#6b3b53)', 'var(--cf9a8d4,#f9a8d4)'],
  turquesa: ['var(--c10312c,#10312c)', 'var(--c2a6b5e,#2a6b5e)', 'var(--c5eead4,#5eead4)'],
  arena:    ['var(--c2b2418,#2b2418)', 'var(--c5c4c30,#5c4c30)', 'var(--ce2cdb0,#e2cdb0)'],
  gris:     ['var(--c20252e,#20252e)', 'var(--c3f4756,#3f4756)', 'var(--cc3ccd8,#c3ccd8)'],
};
// De una tarjeta a su llave: la conversación por su id, el proyecto con `g:` adelante
// (un proyecto y una charla podrían llamarse igual y son dos cosas distintas).
const claveGrupo = n => 'g:' + n;
let tonos = {};
try { tonos = JSON.parse(localStorage.getItem('sesTonos') || '{}') || {}; } catch(e){}
// Un proyecto puede llamarse como vos quieras acá adentro: el de la carpeta sigue siendo
// el de siempre, esto es solo el rótulo de la pastilla.
let apodos = {};
try { apodos = JSON.parse(localStorage.getItem('sesApodos') || '{}') || {}; } catch(e){}
// ⭐ La FORMA de las tarjetas (pedido de Martín, 2026-08-18: "la forma de las tarjetas me
// refería"). Va por TIPO —todas las de proyecto, o todas las de conversación—, no una por
// una: el color es para distinguir UNA tarjeta de otra, la forma es cómo se ven las de esa
// clase. Se elige desde el mismo menú del botón derecho.
const FORMAS = {redonda: 'Redondeada', cuadrada: 'Cuadrada', pildora: 'Píldora',
                pestana: 'Pestaña', hoja: 'Hoja', arco: 'Arco', cortada: 'Cortada',
                flecha: 'Flecha', cinta: 'Cinta'};
let formas = {tab: 'redonda', grupo: 'redonda'};
try { formas = Object.assign(formas,
        JSON.parse(localStorage.getItem('sesFormas') || '{}')); } catch(e){}

function aplicarFormas(){
  const t = $('#tabs');
  if (!t) return;
  t.dataset.ftab = formas.tab || 'redonda';
  t.dataset.fgrupo = formas.grupo || 'redonda';
  // La forma cambia el ancho de las tarjetas (el relleno de los costados), así que la
  // caja que abraza al grupo hay que volver a medirla.
  acomodarAbrazo();
}

const guardarTarjetas = () => {
  localStorage.setItem('sesTonos', JSON.stringify(tonos));
  localStorage.setItem('sesApodos', JSON.stringify(apodos));
  localStorage.setItem('sesFormas', JSON.stringify(formas));
};
// ⭐ Y cualquier otro color con la rueda (pedido de Martín, 2026-08-18: "me gustaría poder
// agregar también colores personalizados"). Se guarda el '#rrggbb' elegido y de ahí salen
// los tres tonos que usa una tarjeta: fondo apenas teñido, borde medio y texto vivo.
// ⚠ Si elegís un color OSCURO, el texto se aclara: si no, letra negra sobre fondo negro.
const canal = (h, i) => parseInt(h.substr(i, 2), 16);
function mezclar(a, b, p){
  const c = i => Math.round(canal(a, i) * p + canal(b, i) * (1 - p));
  return 'rgb(' + [c(1), c(3), c(5)].join(',') + ')';
}
const esHex = c => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
function tresTonos(v){
  if (!esHex(v)) return TONOS[v] || null;
  const luz = (canal(v, 1) * 299 + canal(v, 3) * 587 + canal(v, 5) * 114) / 1000;
  return [mezclar(v, '#0b0d12', .18), mezclar(v, '#0b0d12', .45),
          luz < 110 ? mezclar(v, '#ffffff', .45) : v];
}
// El estilo de una tarjeta pintada, listo para meter en el HTML.
function pinta(clave){
  const t = tresTonos(tonos[clave]);
  return t ? ' style="background:' + t[0] + ';border-color:' + t[1] + ';color:' + t[2] + '"' : '';
}
const nombreGrupo = n => apodos[n] || n;
aplicarFormas();     // la forma elegida vale desde el primer pintado

async function archivar(sid, si){
  archPend[sid] = si; guardarArchPend();
  firma = ''; pintar();                       // que desaparezca ya, sin esperar al server
  let ok = false;
  try {
    const r = await fetch('/movil/archivar', {method:'POST', headers:{'Content-Type':'application/json'},
                                              body: JSON.stringify({sid, archivar: si})});
    ok = r.ok && (await r.json()).ok !== false;
  } catch (e) { /* el pendiente queda puesto y la pantalla lo sigue respetando */ }
  await cargar();                             // ahora la lista ya trae el flag cambiado
  // ⚠ El pendiente se suelta DESPUÉS de recargar, nunca antes: soltarlo con los datos
  // viejos todavía en memoria hace que la fila pegue un salto de vuelta por un instante.
  if (ok && archPend[sid] === si){ delete archPend[sid]; guardarArchPend(); }
}

// ⭐ El rojo se verifica SOLO: se guarda también CUÁNDO falló, y si la sesión escribió
// algo después de ese momento es que contestó igual — el corte fue de la página (pasa
// cada vez que reiniciamos el panel), no de la conversación. Ahí la marca se borra sola
// y queda como "te contestó y no lo viste" (2026-08-17).
// Las marcas viejas, guardadas como texto pelado, valen como "falló en el año cero":
// la primera respuesta que se les vea las limpia.
const falloQue = v => (v && typeof v === 'object') ? v.que : String(v || 'falló');
const falloTs  = v => (v && typeof v === 'object') ? (v.ts || 0) : 0;

function marcarFalla(sid, motivo){
  falladas[sid] = {que: String(motivo || 'falló').slice(0, 200), ts: Date.now() / 1000};
  guardar(); pintarTabs();
}
// Hasta qué momento leíste cada sesión: si el archivo se tocó después Y el último
// que habló fue Claude, es que te contestó y no lo viste. Así se marcan también las
// sesiones que corren en OTRA ventana, no solo las que mandaste desde acá.
let visto = JSON.parse(localStorage.getItem('sesVisto') || '{}');

const guardar = () => {
  localStorage.setItem('sesTabs', JSON.stringify(abiertas));
  localStorage.setItem('sesPendientes', JSON.stringify(pendientes));
  localStorage.setItem('sesVisto', JSON.stringify(visto));
  localStorage.setItem('sesFalladas', JSON.stringify(falladas));
  localStorage.setItem('sesGrupo', grupoAbierto);
};

async function cargar(){
  const selloAlPedir = selloAhora();   // con qué idea de las carpetas salió este pedido
  try { datos = await (await fetch('/movil/sesiones')).json(); } catch(e){ return; }
  if (!datos.proyectos.length) return;
  // Guardada para el próximo arranque: es lo que se dibuja mientras el servidor contesta.
  try { localStorage.setItem('sesDatos', JSON.stringify(datos)); } catch(e){}
  // ⚠ "Todas" no es un proyecto de la lista: sin esta guarda, el refresco de cada 20 s
  // te sacaba solo de esa vista y te devolvía a una carpeta cualquiera.
  if (proy !== TODAS && !datos.proyectos.some(p => p.proyecto === proy))
    proy = (datos.proyectos.find(p => p.vivo) || datos.proyectos[0]).proyecto;
  // El orden y las escondidas vienen con la lista, y se adoptan solo si esta respuesta
  // sigue siendo de fiar (ver `adoptarCarpetas`).
  adoptarCarpetas(datos, selloAlPedir);
  // ⭐ El cerebro de cada pestaña se refresca de la lista: una pestaña guardada de antes
  // de esta función (o abierta por dirección) no sabía si su charla era de Codex.
  for (const t of abiertas){
    if (t.sid.startsWith('nueva-')) continue;
    for (const p of datos.proyectos){
      const s = p.sesiones.find(x => x.id === t.sid);
      if (s){ t.cerebro = s.cerebro || ''; break; }
    }
  }
  verificarFalladas();
  await traerBorradores();
  // El título de la pestaña del navegador sigue al nombre de la charla, que Claude le
  // va cambiando mientras conversan. Sin empujar: es la MISMA dirección, solo se
  // refresca el nombre (empujando, cada 20 s quedaría una entrada nueva en el historial).
  fijarDireccion({empujar: false});
  pintarCarpetas(); pintarTabs(); pintar();
}

// ⭐ Los borradores del servidor: lo que empezaste a escribir desde el celular aparece
// acá, y al revés. Se piden junto con la lista (cada 20 s) y son un JSON chiquito.
// ⚠⚠ El de la conversación que estás MIRANDO no se pisa nunca: ese lo estás escribiendo
// vos ahora mismo y una respuesta que llegó tarde te borraría lo recién tipeado. Lo mismo
// con las charlas sin estrenar, que el servidor ni conoce.
async function traerBorradores(){
  let b;
  try { b = await (await fetch('/movil/borradores')).json(); } catch(e){ return; }
  if (!b || typeof b !== 'object') return;
  const nuevos = {};
  for (const [sid, v] of Object.entries(b))
    if (v && (v.texto || '').trim()) nuevos[sid] = v.texto;
  for (const [sid, t] of Object.entries(borradores))
    if (sid.startsWith('nueva-') || sid === activa) nuevos[sid] = t;
  if (JSON.stringify(nuevos) === JSON.stringify(borradores)) return;
  borradores = nuevos;
  guardarBorradores();
  firma = '';                     // que la bandeja repinte con las chapas nuevas
  // Acabás de entrar y el borrador lo habías escrito en el celular: se devuelve a la caja.
  // ⚠ Solo si la caja está VACÍA — si hay algo tipeado es tuyo y de ahora, y no se pisa.
  const c = $('#texto');
  if (activa && c && !c.value.trim() && (borradores[activa] || '').trim())
    ponerBorradorEnCaja(activa);
}

// ¿Alguna de las rojas contestó después de haber fallado? Entonces no se rompió nada:
// se cortó la conexión y la sesión siguió trabajando igual.
function verificarFalladas(){
  let limpie = false;
  for (const sid of Object.keys(falladas)){
    const s = datos.proyectos.flatMap(p => p.sesiones).find(x => x.id === sid);
    if (!s || s.ultimo !== 'claude') continue;
    if ((s.ts || 0) > falloTs(falladas[sid]) + 2){
      delete falladas[sid];
      if (activa !== sid) pendientes[sid] = true;   // te contestó: andá a leerla
      limpie = true;
    }
  }
  if (limpie){ firma = ''; guardar(); }
}

// De qué proyecto es una pestaña. Se busca por la carpeta del disco (`cwd`), que es
// lo único que la pestaña se guarda; si esa carpeta todavía no está en la lista, se
// cae a buscar la sesión adentro de cada proyecto.
// ⚠ La ruta se compara APLANADA (minúsculas, barras iguales, sin la del final): el
// mismo proyecto viene escrito distinto según de dónde salga — el que está vivo lo
// dice Claude Code y el guardado se lee del .jsonl, y ahí aparecen cosas como
// "c:\Espacio…" contra "C:/Espacio…". Comparando tal cual, la pestaña de un proyecto
// se quedaba sin dueño justo cuando abrís o cerrás su ventana.
const mismaRuta = (a, b) => {
  const plano = s => (s||'').toLowerCase().replace(/\//g,'\\').replace(/\\+$/,'');
  return !!a && plano(a) === plano(b);
};

function proyectoDe(t){
  if (!t) return '';
  const p = datos.proyectos.find(x => mismaRuta(x.cwd, t.cwd))
         || datos.proyectos.find(x => x.sesiones.some(s => s.id === t.sid));
  return p ? p.proyecto : '';
}

// --- ⭐ El orden de las carpetas y cuáles están escondidas -----------------------
// Pedido de Martín (2026-08-18): "quiero poder mover las carpetas y sacarlas de acá".
// ⚠⚠ Sacar NO borra: ni la carpeta del disco, ni sus conversaciones, ni la entrada de
// `carpetas_sesiones.json`. Es la misma idea que archivar una charla, con proyectos.
// Vive en el SERVIDOR (`/carpetas/orden`, `/carpetas/ocultar`) y viaja adentro de
// `/movil/sesiones`, así el primer pintado —que sale de lo guardado en el navegador—
// ya usa el orden bueno y la lista no salta un segundo después.
let ordenCarp = (datos.carpetas && datos.carpetas.orden) || [];
let ocultasCarp = new Set((datos.carpetas && datos.carpetas.ocultas) || []);
let viendoOcultas = false;
let arrastrandoCarp = false;    // igual que en las pestañas: no repintar en el medio

// El orden elegido manda; lo que no esté en la lista (un proyecto que apareció
// después) va al final, en el orden que venga. Así una carpeta nueva no obliga a
// reescribir nada y tampoco se cuela arriba de todo sin que la hayas puesto ahí.
function ordenarCarpetas(ps){
  const pos = new Map(ordenCarp.map((n, i) => [n, i]));
  return ps.slice().sort((a, b) => {
    const ia = pos.has(a.proyecto) ? pos.get(a.proyecto) : Infinity;
    const ib = pos.has(b.proyecto) ? pos.get(b.proyecto) : Infinity;
    return ia === ib ? 0 : ia - ib;
  });
}

// ⚠⚠ La lista se refresca sola cada 20 s, así que puede haber un pedido en el aire
// cuando soltás una carpeta, y ese vuelve con el orden VIEJO: sin este sello la pantalla
// te devolvía la carpeta a donde estaba, un rato después y sin motivo visible. Salió a la
// luz armando lo mismo en el celular (2026-08-19), donde el refresco es cada 3 s y por eso
// pasaba seguido. Una respuesta solo vale si salió en un momento TRANQUILO: nada cambiado
// desde entonces y ningún cambio nuestro viajando.
let selloCarp = 0, escribiendoCarp = 0;
function selloAhora(){ return escribiendoCarp ? -1 : selloCarp; }

function adoptarCarpetas(d, sello){
  if (arrastrandoCarp || escribiendoCarp || !d || !d.carpetas) return;
  if (sello !== undefined && sello !== selloCarp) return;
  ordenCarp = d.carpetas.orden || [];
  ocultasCarp = new Set(d.carpetas.ocultas || []);
  // La identidad de cada carpeta viene por el mismo camino y con el mismo cuidado: una
  // respuesta que salió antes de tu cambio traería el ícono viejo (ver `anotarCarpetas`).
  adoptarAspectoCarp(d.carpetas.aspecto, d.carpetas.iconosPropios, d.carpetas.defecto);
}

// Todo cambio nuestro pasa por acá: sube el sello y queda anotado como "viajando" hasta
// que el servidor conteste.
function anotarCarpetas(url, cuerpo){
  selloCarp++;
  escribiendoCarp++;
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify(cuerpo)})
    .catch(()=>{}).finally(() => { escribiendoCarp--; });
}

function guardarOrdenCarpetas(){
  anotarCarpetas('/carpetas/orden', {orden: ordenCarp});
}

// Sacar una carpeta (o devolverla). La animación corre ANTES de repintar: si no, el
// renglón desaparece de un saque y no se ve qué se fue.
async function ocultarCarpeta(nombre, ocultar){
  const fila = document.querySelector('.carpeta[data-proy="' + CSS.escape(nombre) + '"]');
  if (ocultar && fila){
    fila.classList.add('se-va');
    await new Promise(r => setTimeout(r, 300));
  }
  ocultar ? ocultasCarp.add(nombre) : ocultasCarp.delete(nombre);
  if (!ocultar) marcarVuelve = nombre;
  // ⚠ El aviso al servidor va ANTES de repintar: repintar puede salir a pedir la lista de
  // nuevo, y si el cambio todavía no salió, la respuesta vuelve con lo de antes.
  anotarCarpetas('/carpetas/ocultar', {proyecto: nombre, ocultar});
  // Si estabas parado en la que sacaste, la bandeja vuelve a Todas: quedarse mirando
  // una carpeta que ya no está en la lista no tiene con qué volver.
  if (ocultar && proy === nombre) irProyecto(TODAS);
  else pintarCarpetas();
}

let marcarVuelve = '';      // la que acaba de volver, para animarle la entrada UNA vez

function pintarCarpetas(){
  // ⚠ En medio de un arrastre no se repinta: rearmar el HTML le saca al navegador el
  // renglón que estás moviendo (misma lección que las pestañas de arriba).
  if (arrastrandoCarp) return;
  const filtro = ($('#buscar').value || '').toLowerCase().trim();
  let lista = filtro ? datos.proyectos.filter(p => p.proyecto.toLowerCase().includes(filtro)
                                                 || (p.cwd||'').toLowerCase().includes(filtro))
                       : datos.proyectos;
  lista = ordenarCarpetas(lista);
  const escondidas = lista.filter(p => ocultasCarp.has(p.proyecto));
  // Buscando por nombre se muestran TODAS, escondidas incluidas: si escribís el
  // nombre de una que sacaste y no aparece, parece que se borró de verdad.
  const visibles = filtro ? lista : lista.filter(p => !ocultasCarp.has(p.proyecto));
  // Los números NO cuentan las archivadas: si no, la cabecera decía 68 y en la lista
  // había 67, que es de esas diferencias que te hacen desconfiar de todo lo demás.
  const enBandeja = s => !esArchivada(s) && !s.tapada;
  const cuantas = datos.proyectos.reduce((n, x) => n + x.sesiones.filter(enBandeja).length, 0);
  const fila = p => {
    const clave = claveGrupo(p.proyecto);        // ⭐ la MISMA llave que su pastilla
    const ico = iconos[p.proyecto];
    return '<div class="carpeta ' + (p.proyecto===proy?'sel':'') +
        (tonos[clave]?' pintada':'') + (p.proyecto===marcarVuelve?' vuelve':'') +
        '" data-proy="' + esc(p.proyecto) + '"' + pinta(clave) +
        ' title="' + esc(nombreGrupo(p.proyecto)) + ' · botón derecho para cambiarla' +
        (navegEfectivo(p.proyecto) ? ' · tiene navegador' : '') + '">' +
      '<span>' + (ico ? esc(ico) : (p.vivo?'📂':'📁')) + '</span>' +
      '<span class="nom">' + esc(nombreGrupo(p.proyecto)) + '</span>' +
      // ⭐ Marca chica de "esta carpeta maneja un navegador". Va apagada y NO en rojo:
      // el rojo es solo para lo que está mal (regla de Martín), y esto es un estado
      // normal. Se distingue del puntito de "tiene algo vivo" porque es un dibujito.
      // ⚠ Mira el navegador EFECTIVO: casi ninguna carpeta declara el suyo, lo heredan
      // del de base, y una marca que solo mirara lo declarado no aparecería nunca.
      (navegEfectivo(p.proyecto)
        ? '<span class="naveg" title="Sus conversaciones manejan un navegador">🌐</span>'
        : '') +
      // Con ícono propio, "tiene algo vivo" lo cuenta el puntito: el 📂 ya no está.
      (ico && p.vivo ? '<span class="vive" title="Tiene una conversación viva"></span>' : '') +
      '<span class="num">' + p.sesiones.filter(enBandeja).length + '</span>' +

      '<span>✉</span><span class="nom">Todas</span><span class="num">' + cuantas + '</span></div>' +
    visibles.map(fila).join('') +
    // El pie con las escondidas. Solo si hay alguna: si no, es un cartel que no hace
    // nada. Es el ÚNICO camino de vuelta, así que no puede depender de acordarse.
    (escondidas.length && !filtro
      ? '<div class="carpeta guardadas" id="verOcultas">' +
          '<span>' + (viendoOcultas ? '▾' : '▸') + '</span>' +
          '<span class="nom">Escondidas</span>' +
          '<span class="num">' + escondidas.length + '</span></div>' +
        (viendoOcultas ? escondidas.map(p =>
          '<div class="carpeta devolver" data-volver="' + esc(p.proyecto) + '">' +
            '<span class="nom">' + esc(p.proyecto) + '</span>' +
            '<span class="vol">↩ devolver</span></div>').join('') : '')
      : '');
  marcarVuelve = '';
  document.querySelectorAll('.carpeta[data-proy]').forEach(c => {
    c.onclick = e => {
      if (e.target.dataset.sacar) return;        // la ✕ tiene lo suyo
      // ⚠ Si el clic viene de terminar un arrastre, NO entra al proyecto: soltar la
      // carpeta donde la moviste no puede además cambiarte de carpeta.
      if (movioCarpeta){ movioCarpeta = false; return; }
      irProyecto(c.dataset.proy);
    };
    c.oncontextmenu = e => abrirMenuCarpeta(e, c);
  });
  document.querySelectorAll('[data-sacar]').forEach(x =>
    x.onclick = e => { e.stopPropagation(); ocultarCarpeta(x.dataset.sacar, true); });
  document.querySelectorAll('[data-volver]').forEach(x =>
    x.onclick = () => ocultarCarpeta(x.dataset.volver, false));
  const ver = $('#verOcultas');
  if (ver) ver.onclick = () => { viendoOcultas = !viendoOcultas; pintarCarpetas(); };
  engancharArrastreCarpetas();
  if (!visibles.length && !escondidas.length)
    $('#carpetas').innerHTML = '<div style="color:var(--c616977,#616977);padding:8px 18px;font-size:12.5px">' +
      'Ninguna carpeta con ese nombre. Podés agregarla abajo.</div>';
  // Hay ~20 proyectos y la barra tiene scroll propio: marcar la carpeta no alcanza
  // si quedó abajo de todo. Se la acerca SOLO cuando cambió la marcada — el
  // repintado de cada 20 s te pelearía el scroll mientras mirás la lista.
  if (proy !== carpetaVista){
    carpetaVista = proy;
    const el = $('.carpeta.sel');
    if (el) el.scrollIntoView({block:'nearest'});
  }
}

// --- ⭐⭐ Arrastrar una carpeta para moverla de lugar ------------------------------
// ⚠⚠ Se agarra la FILA ENTERA (pedido de Martín, 2026-08-18, segunda vuelta: "no me
// gusta tener que agarrar el costado, tendría que poder seleccionar la carpeta entera y
// así moverla"). La primera versión tenía un ⠿ al costado y se sacó.
//
// El problema real: esa misma fila ya era el clic que ENTRA al proyecto. Se resuelve con
// un UMBRAL DE MOVIMIENTO, no partiendo la fila en dos zonas: el `mousedown` no arrastra
// nada, solo anota dónde empezó; recién cuando el puntero se corre más de UMBRAL_MOVER
// píxeles esto pasa a ser un arrastre. Soltar sin llegar al umbral es un clic de los de
// siempre. Así el gesto lento (entrar) y el gesto largo (mover) conviven en el mismo
// lugar sin que uno le robe el otro.
//
// La animación es FLIP: se anota dónde estaba cada renglón, se mueve el nodo, se mide
// dónde quedó, se lo manda de vuelta al lugar viejo con un `transform` y se lo suelta
// en el cuadro siguiente. El navegador anima el camino y el reordenado se entiende.
const UMBRAL_MOVER = 5;      // píxeles. Menos que esto es el pulso de la mano, no un arrastre
let movioCarpeta = false;    // el clic que sigue a un arrastre no tiene que entrar al proyecto

function engancharArrastreCarpetas(){
  const cont = $('#carpetas');
  if (!cont) return;
  cont.querySelectorAll('.carpeta[data-proy]').forEach(fila => {
    fila.onmousedown = e => {
      if (e.button !== 0) return;                          // el derecho abre el menú
      if (e.target.dataset.sacar) return;                  // la ✕ tiene lo suyo
      if (fila.dataset.proy === TODAS) return;             // la bandeja no se mueve
      esperarArrastreCarpeta(e, fila, cont);
    };
  });
}

// Todavía no es un arrastre: se queda mirando si el puntero se mueve de verdad.
function esperarArrastreCarpeta(ev, fila, cont){
  const x0 = ev.clientX, y0 = ev.clientY;
  const mirar = e => {
    if (Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) < UMBRAL_MOVER) return;
    soltarEspera();
    arrancarArrastreCarpeta(e, fila, cont);
  };
  const soltarEspera = () => {
    document.removeEventListener('mousemove', mirar);
    document.removeEventListener('mouseup', soltarEspera);
  };
  document.addEventListener('mousemove', mirar);
  document.addEventListener('mouseup', soltarEspera);
}

function arrancarArrastreCarpeta(ev, fila, cont){
  arrastrandoCarp = true;
  movioCarpeta = true;
  fila.classList.add('deslizando');
  const movibles = () => [...cont.querySelectorAll('.carpeta[data-proy]')]
    .filter(f => f.dataset.proy !== TODAS);

  // FLIP: dónde está cada renglón AHORA.
  const fotos = () => new Map(movibles().map(f => [f, f.getBoundingClientRect().top]));

  const acomodar = antes => {
    movibles().forEach(f => {
      if (f === fila) return;
      const y0 = antes.get(f);
      if (y0 == null) return;
      const dy = y0 - f.getBoundingClientRect().top;
      if (!dy) return;
      f.classList.remove('acomodando');
      f.style.transform = 'translateY(' + dy + 'px)';
      requestAnimationFrame(() => {
        f.classList.add('acomodando');
        f.style.transform = '';
      });
    });
  };

  const mover = e => {
    const otras = movibles().filter(f => f !== fila);
    // Sobre cuál está el puntero: se compara contra la MITAD de cada renglón, así
    // cae arriba o abajo según de qué lado entraste.
    let destino = null, antes = false;
    for (const f of otras){
      const r = f.getBoundingClientRect();
      if (e.clientY >= r.top && e.clientY <= r.bottom){
        destino = f; antes = e.clientY < r.top + r.height / 2; break;
      }
    }
    if (!destino) return;
    const ref = antes ? destino : destino.nextElementSibling;
    if (ref === fila || (!antes && destino === fila)) return;
    const foto = fotos();
    cont.insertBefore(fila, ref);
    acomodar(foto);
  };

  const soltar = () => {
    document.removeEventListener('mousemove', mover);
    document.removeEventListener('mouseup', soltar);
    fila.classList.remove('deslizando');
    movibles().forEach(f => { f.classList.remove('acomodando'); f.style.transform = ''; });
    // El orden nuevo, leído del DOM. Se guardan TODAS las que se ven (escondidas
    // incluidas, que conservan su lugar para cuando vuelvan).
    const vistas = movibles().map(f => f.dataset.proy);
    const resto = ordenCarp.filter(n => !vistas.includes(n));
    ordenCarp = vistas.concat(resto);
    arrastrandoCarp = false;
    guardarOrdenCarpetas();
    pintarCarpetas();
  };
  document.addEventListener('mousemove', mover);
  document.addEventListener('mouseup', soltar);
}

// ⭐⭐ Y todo eso, ADEMÁS, en el servidor (2026-08-25). Pedido de Martín: *"que no importa

// leería un servidor vacío y le borraría los íconos de la pantalla. Cambiar el nombre de
// la llave hace que los navegadores que ya se marcaron mal vuelvan a sembrar.
let aspectoCarpListo = !!localStorage.getItem('sesAspectoSembrado2');
// Qué navegador usa cada carpeta: {carpeta: {navegador, sitios}}. Lo llena el servidor.
let navegCarp = {};
// El navegador de base que heredan las carpetas que no declaran el suyo.
let navegDefecto = {};
// Con qué navegador termina trabajando una carpeta: el suyo, o el de base si no dijo
// nada. "ninguno" es el apagado explícito, y no hereda. Misma cuenta que hace el
// lanzador en `navegador_de()`: si las dos no coinciden, la pantalla miente.
function navegEfectivo(carpeta){
  const puesto = (navegCarp[carpeta] || {}).navegador || '';
  if (puesto === 'ninguno') return '';
  return puesto || navegDefecto.navegador || '';
}
// Los perfiles de Chrome del disco, para el selector. Se piden UNA vez y se guardan: es
// una lista que no cambia mientras mirás un menú.

function adoptarAspectoCarp(ap, propios, defecto){
  if (!ap) return;
  // Antes de sembrar, el servidor puede estar vacío: ahí solo SUMA, nunca borra, o el
  // primer refresco le limpiaría a Martín los íconos que todavía no subieron.
  if (aspectoCarpListo){
    for (const n of Object.keys(iconos)) if (!(ap[n] || {}).icono) delete iconos[n];
    for (const k of Object.keys(tonos))
      if (k.startsWith('g:') && !(ap[k.slice(2)] || {}).color) delete tonos[k];
    for (const n of Object.keys(apodos)) if (!(ap[n] || {}).apodo) delete apodos[n];
  }
  // ⭐ El navegador del proyecto (2026-08-28) vive en el MISMO lugar que el ícono y el
  // color porque es lo mismo: una propiedad de la carpeta, no de esta pantalla. Acá NO
  // se espeja en el localStorage — a diferencia de los íconos, esto no se dibuja en el
  // primer cuadro, y un perfil de Chrome guardado en el navegador sería un dato de
  // permisos viviendo donde nadie lo controla.
  navegCarp = {};
  navegDefecto = defecto || {};
  for (const [n, a] of Object.entries(ap)){
    if (a.icono) iconos[n] = a.icono;
    if (a.color) tonos[claveGrupo(n)] = a.color;
    if (a.apodo) apodos[n] = a.apodo;
    if (a.navegador || a.sitios)
      navegCarp[n] = {navegador: a.navegador || '', sitios: a.sitios || ''};
  }
  if (Array.isArray(propios) && aspectoCarpListo) iconosPropios = propios;
  guardarIconos(); guardarTarjetas(); guardarIconosPropios();
}

// ⭐⭐ El sembrado: lo que ESTE navegador ya tenía sube una sola vez. Martín lo pidió con
// todas las letras — *"porfa no pierdas lo que ya tengo porque tardé mucho en ponerlos"*—,
// así que el servidor no pisa nada, guarda una copia con fecha en `logs/` y lo que no
// coincide queda anotado como choque para que él decida.
async function sembrarAspectoCarp(){
  if (localStorage.getItem('sesAspectoSembrado2')) return;
  const mio = {};
  const poner = (n, campo, v) => { if (v) (mio[n] = mio[n] || {})[campo] = v; };
  for (const [n, v] of Object.entries(iconos)) poner(n, 'icono', v);
  for (const [k, v] of Object.entries(tonos)) if (k.startsWith('g:')) poner(k.slice(2), 'color', v);
  for (const [n, v] of Object.entries(apodos)) poner(n, 'apodo', v);
  // ⚠⚠ Solo se da por sembrado si el servidor DIJO que sí. Un panel sin reiniciar todavía
  // no tiene este endpoint y contesta 404 — que para `fetch` es una respuesta válida, no
  // un error. Marcarlo ahí significaba no volver a intentarlo nunca y perder los íconos.
  try {
    const r = await fetch('/carpetas/aspecto/sembrar', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({origen:'compu', carpetas: mio, iconosPropios})});
    if (!r.ok) return;
    if (!((await r.json().catch(() => ({}))).ok)) return;
  } catch(e){ return; }        // sin panel no se marca: se reintenta el próximo arranque
  localStorage.setItem('sesAspectoSembrado2', '1');
  aspectoCarpListo = true;
}
sembrarAspectoCarp();

// ⚠ Un ícono es UN signo: si pegás "hola" o cinco emojis de una, se queda con el primero
// (un renglón entero adentro del cuadradito de 22 px descuadra toda la lista). Se corta
// con `Intl.Segmenter` y no con `[0]` porque un emoji suele ser varios códigos —
// banderas, familias, emojis con color de piel— y cortarlo al medio deja un garabato.
const primerSigno = t => {
  const s = (t || '').trim();
  if (!s) return '';
  try { return [...new Intl.Segmenter().segment(s)][0].segment; }
  catch(e){ return [...s][0] || ''; }
};

// Buscar sin tildes y sin mayúsculas: escribe "corazon" y encuentra "corazón", escribe
// "MATE" y encuentra "mate".
const sinTildes = s => (s || '').toLowerCase().normalize('NFD')
                                .replace(/[̀-ͯ]/g, '');

function abrirMenuCarpeta(e, el){
  e.preventDefault();
  e.stopPropagation();
  const nombre = el.dataset.proy || '';
  if (!nombre || nombre === TODAS) return;      // la bandeja no es un proyecto
  const clave = claveGrupo(nombre);
  const m = $('#menuTarjeta');
  m.innerHTML =
    '<div class="rub">Carpeta</div>' +
    '<div class="tonos">' +
      Object.keys(TONOS).map(k =>
        '<div class="tono' + (tonos[clave] === k ? ' sel' : '') + '" data-tono="' + k +
        '" title="' + k + '" style="background:' + TONOS[k][0] +
        ';box-shadow:inset 0 0 0 2px ' + TONOS[k][2] + '"></div>').join('') +
      '<div class="tono nada' + (tonos[clave] ? '' : ' sel') +
        '" data-tono="" title="Sin color">✕</div>' +
      '<span class="ruedaCaja' + (esHex(tonos[clave]) ? ' sel' : '') + '" title="Cualquier ' +
        'otro color"><input type="color" class="rueda" id="carpRueda" value="' +
        (esHex(tonos[clave]) ? tonos[clave] : '#8ecbff') + '"></span>' +
    '</div><div class="sep"></div>' +
    '<div class="rub">Ícono</div>' +
    '<div class="tonos iconos"></div><div class="sep"></div>' +
    '<div class="rub">Navegador del proyecto</div>' +
    '<select class="buscaIco" id="carpNaveg"><option>cargando…</option></select>' +
    '<input class="buscaIco" id="carpSitios" style="margin-top:6px" ' +
      'placeholder="sitios permitidos (vacío = todos)" value="' +
      esc((navegCarp[nombre] || {}).sitios || '').replace(/"/g, '&quot;') + '">' +
    '<div class="nada-hay" id="carpNavegAviso"></div>' +
    // ⭐ El navegador de BASE, el que heredan todas las carpetas que no declaran el suyo.
    // Va acá y no en una pantalla aparte porque es la misma decisión mirada de lejos, y
    // porque acá es donde uno se da cuenta de que la quiere cambiar.
    '<div class="rub">Y para todos los proyectos</div>' +
    '<select class="buscaIco" id="carpNavegBase"><option>cargando…</option></select>' +
    '<div class="sep"></div>' +
    '<div class="op" data-hace="nombre">✎ Cambiarle el nombre</div>' +
    '<div class="op" data-hace="sacar">✕ Sacarla de la lista</div>';

  // ⚠ El color se ve EN EL ACTO y el menú se queda abierto: probar tres tonos son tres
  // clics y no doce (misma decisión que el menú de las tarjetitas).
  const marcar = t => {
    m.querySelectorAll('.tonos:not(.iconos) .tono').forEach(o => o.classList.toggle('sel', o === t));
    m.querySelector('.ruedaCaja').classList.toggle('sel', t === null);
  };
  m.querySelectorAll('.tonos:not(.iconos) .tono').forEach(t => t.onclick = () => {
    const v = t.dataset.tono;
    if (v) tonos[clave] = v; else delete tonos[clave];
    guardarTarjetas(); subirCarp(nombre, 'color', v); pintarCarpetas(); pintarTabs(); marcar(t);
  });
  // Igual que la rueda del 🎨: en vivo mientras la movés, guardada al soltar.
  const rueda = m.querySelector('#carpRueda');
  rueda.oninput  = () => { tonos[clave] = rueda.value; pintarCarpetas(); pintarTabs();
                           marcar(null); };
  rueda.onchange = () => { tonos[clave] = rueda.value; guardarTarjetas();
                           subirCarp(nombre, 'color', rueda.value);
                           pintarCarpetas(); pintarTabs(); marcar(null); };
  // ⭐ La fila de íconos se dibuja aparte de todo el resto del menú porque CRECE: al
  // agregar uno tuyo hay que rehacerla, y rearmar el menú entero le cerraría al navegador
  // el selector de color que quizás está abierto (misma razón por la que el color se
  // repinta a mano). Solo se rehace esta fila.
  const filaIco = m.querySelector('.tonos.iconos');
  // ⚠ `esc()` no escapa las comillas y acá el ícono lo escribe él: si pega una `"`, sin
  // el `&quot;` el atributo se corta al medio y el menú sale roto.
  const casilla = (k, propio) =>
    '<div class="tono ico' + (propio ? ' propio' : '') + (iconos[nombre] === k ? ' sel' : '') +
    '" data-ico="' + esc(k).replace(/"/g, '&quot;') + '"' +
    (propio ? ' title="Tuyo · botón derecho para sacarlo del juego"' : '') +
    '>' + esc(k) + '</div>';
  const pintarIconos = () => {
    const puesto = iconos[nombre];
    // ⚠ El que la carpeta YA usa siempre aparece en la fila, aunque lo hayas sacado del
    // juego o venga de otra máquina: si no, el menú diría "ninguno" mientras la carpeta
    // luce uno, que es la clase de contradicción que te hace desconfiar de la pantalla.
    const suelto = puesto && !ICONOS_CARPETA.includes(puesto)
                          && !iconosPropios.includes(puesto) ? [puesto] : [];
    filaIco.innerHTML =
      ICONOS_CARPETA.map(k => casilla(k, false)).join('') +
      iconosPropios.concat(suelto).map(k => casilla(k, true)).join('') +
      '<div class="tono nada' + (puesto ? '' : ' sel') +
        '" data-ico="" title="El de siempre (📂 si tiene algo vivo)">✕</div>' +
      '<div class="tono mas" title="Buscar o agregar un ícono">＋</div>';
    filaIco.querySelectorAll('[data-ico]').forEach(i => i.onclick = () => {
      const v = i.dataset.ico;
      if (v) iconos[nombre] = v; else delete iconos[nombre];
      guardarIconos(); subirCarp(nombre, 'icono', v); pintarCarpetas();
      filaIco.querySelectorAll('[data-ico]').forEach(o => o.classList.toggle('sel', o === i));
    });
    // Sacar uno tuyo del juego NO despinta las carpetas que lo usan: el ícono se guarda
    // por su valor, no por su lugar en la lista. Sacar una opción no puede cambiarte tres
    // carpetas de golpe.
    filaIco.querySelectorAll('.propio').forEach(i => i.oncontextmenu = ev => {
      ev.preventDefault(); ev.stopPropagation();
      iconosPropios = iconosPropios.filter(x => x !== i.dataset.ico);
      guardarIconosPropios(); subirIconosPropios(); pintarIconos();
    });
    filaIco.querySelector('.mas').onclick = abrirBuscaIconos;
  };

  // ⭐⭐ El buscador de íconos, adentro del menú (2026-08-18, Martín sobre el `prompt()`
  // que había antes: *"se ve muy feo esto"*). Escribís "fuego" y aparece el 🔥; pegás
  // cualquier emoji y te lo ofrece igual, aunque no esté en el catálogo. El `prompt()`
  // del navegador, además de feo, obligaba a saber el atajo de los emojis de Windows
  // para poder usarlo: el buscador convierte "agregar un ícono" en elegir de una grilla.
  const elegirIcono = v => {
    if (!v) return;
    if (!ICONOS_CARPETA.includes(v) && !iconosPropios.includes(v)){
      iconosPropios.push(v);
      guardarIconosPropios(); subirIconosPropios();
    }
    // Se le pone a esta carpeta solo: lo buscaste estando parado acá, hacerte elegirlo
    // de nuevo en la fila sería un clic al pedo.
    iconos[nombre] = v;
    guardarIconos(); subirCarp(nombre, 'icono', v); pintarCarpetas(); pintarIconos(); ubicar();
  };

  function abrirBuscaIconos(){
    filaIco.innerHTML =
      // ⚠ El menú mide 252 px: un placeholder largo se corta al medio y queda peor que
      // uno corto. "fuego, plata…" ya enseña que se busca por palabra.
      '<input class="buscaIco" placeholder="Buscá: fuego, plata… o pegá uno">' +
      '<div class="galeria"></div>' +
      '<div class="volver">← volver a los de siempre</div>';
    const inp = filaIco.querySelector('.buscaIco');
    const gal = filaIco.querySelector('.galeria');
    const pintarGaleria = () => {
      const txt = inp.value.trim();
      const q = sinTildes(txt);
      // Si lo que pegó NO es texto sino un signo (un emoji, un símbolo, una letra suelta),
      // va primero y marcado: pegar algo y que no pase nada es un callejón sin salida.
      const suyo = txt && !/^[a-z0-9 ]+$/.test(q) ? primerSigno(txt) : '';
      const hallados = q ? CATALOGO_ICONOS.filter(([e, p]) => p.includes(q))
                         : CATALOGO_ICONOS;
      gal.innerHTML =
        (suyo ? '<div class="tono ico pegado" data-ico="' +
                esc(suyo).replace(/"/g, '&quot;') + '" title="El tuyo">' +
                esc(suyo) + '</div>' : '') +
        hallados.map(([e]) => casilla(e, false)).join('') +
        (!suyo && !hallados.length
          ? '<div class="nada-hay">Nada con “' + esc(txt) + '”. ' +
            'Probá otra palabra, o pegá acá el emoji que quieras.</div>' : '');
      gal.querySelectorAll('[data-ico]').forEach(i =>
        i.onclick = () => elegirIcono(i.dataset.ico));
    };
    inp.oninput = () => { pintarGaleria(); ubicar(); };
    inp.onkeydown = ev => {
      // ⚠ Lo que tipeás no puede salirse de acá: la pantalla tiene atajos de una tecla.
      ev.stopPropagation();
      if (ev.key === 'Enter'){
        ev.preventDefault();
        const p = gal.querySelector('[data-ico]');
        if (p) elegirIcono(p.dataset.ico);
      } else if (ev.key === 'Escape'){
        ev.preventDefault();
        pintarIconos(); ubicar();
      }
    };
    filaIco.querySelector('.volver').onclick = () => { pintarIconos(); ubicar(); };
    pintarGaleria();
    ubicar();
    inp.focus();
  }

  // El menú cambia de alto al abrir y cerrar el buscador, así que la posición se
  // recalcula: si no, abrirlo abajo de todo lo mandaba fuera de la pantalla.
  const px = e.clientX, py = e.clientY;
  const ubicar = () => {
    const an = m.offsetWidth, al = m.offsetHeight;
    m.style.left = Math.round(Math.max(8, Math.min(px, innerWidth - an - 8))) + 'px';
    m.style.top = Math.round(Math.max(8, Math.min(py, innerHeight - al - 8))) + 'px';
  };
  pintarIconos();

  // ⭐⭐ El navegador del proyecto (2026-08-28). La carpeta declara CON QUÉ perfil de
  // Chrome trabajan sus conversaciones, y ese campo es el interruptor: sin perfil, esa
  // carpeta no puede abrir páginas. No hay perilla por conversación a propósito — es
  // como lo hace Codex, que nunca te hace prender nada.
  const sel = m.querySelector('#carpNaveg');
  const campoSitios = m.querySelector('#carpSitios');
  const aviso = m.querySelector('#carpNavegAviso');
  // ⚠ Los dos cortan el teclado: esta pantalla tiene atajos de UNA tecla y se disparan
  // mientras escribís (misma razón que el buscador de íconos).
  sel.onkeydown = campoSitios.onkeydown = e => e.stopPropagation();
  const contar = () => {
    // ⚠ "Todavía no conectó su extensión" no es un detalle: sin eso la sesión no sabe
    // cuál de los navegadores conectados es el suyo, y hay más de uno prendido siempre.
    // Se mira el navegador EFECTIVO (el heredado, si esta carpeta no declara el suyo).
    const efectivo = sel.value === 'ninguno' ? ''
                   : (sel.value || navegDefecto.navegador || '');
    const pe = (perfilesChrome || []).find(x => x.ruta === efectivo);
    aviso.textContent = !efectivo
      ? 'Sin navegador: las conversaciones de esta carpeta no abren páginas.'
      : (pe && !pe.conectado
          ? 'Todavía no conectó su extensión de Claude: abrí ese Chrome y activala.'
          : (pe && pe.personal
              ? 'Ojo: es tu Chrome de siempre, con todas tus cuentas abiertas adentro.'
              : 'Abre solo, y trabaja con lo que esté logueado en ese perfil.'));
    ubicar();
  };
  // ⚠ El guardado NO usa `anotarCarpetas`: ese se come los errores con un `catch` vacío,
  // y acá el servidor PUEDE decir que no (un perfil que ya no existe, o un panel viejo
  // que contesta 404 porque todavía no conoce el campo). Un permiso que se guarda a
  // medias y no avisa es peor que uno que falla fuerte.
  const guardarNaveg = async (campo, valor) => {
    selloCarp++; escribiendoCarp++;
    let ok = false, error = '';
    try {
      const r = await fetch('/carpetas/aspecto', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({carpeta: nombre, [campo]: valor || ''})});
      const j = r.ok ? await r.json().catch(()=>({})) : {};
      ok = !!(r.ok && j.ok);
      error = j.error || (r.status === 404 ? '¿el panel viejo? reinicialo' : 'no se pudo');
    } catch(e){ error = 'no llegué al panel'; }
    escribiendoCarp--;
    if (ok){
      const a = navegCarp[nombre] || {navegador:'', sitios:''};
      a[campo] = valor || '';
      if (a.navegador || a.sitios) navegCarp[nombre] = a; else delete navegCarp[nombre];
      pintarCarpetas();
    } else {
      aviso.textContent = 'No se guardó: ' + error;
      ubicar();
    }
    return ok;
  };
  // El navegador de base: se guarda aparte, en `defecto`, y afecta a TODAS las carpetas.
  const base = m.querySelector('#carpNavegBase');
  base.onkeydown = e => e.stopPropagation();
  const pintarBase = () => {
    base.innerHTML = '<option value="">Ninguno: cada carpeta el suyo</option>' +
      (perfilesChrome || []).map(p => '<option value="' +
        esc(p.ruta).replace(/"/g,'&quot;') + '"' +
        (p.ruta === (navegDefecto.navegador || '') ? ' selected' : '') + '>' +
        esc(p.nombre) + (p.personal ? ' (todas tus cuentas)' : '') +
        '</option>').join('');
  };
  base.onchange = async () => {
    const antes = navegDefecto.navegador || '';
    navegDefecto = Object.assign({}, navegDefecto, {navegador: base.value});
    if (!(await guardarNaveg('defecto', {navegador: base.value}))){
      navegDefecto.navegador = antes;         // no se guardó: no mentir en pantalla
      pintarBase();
    }
    pintarSelNaveg();
    contar();
  };
  const pintarSelNaveg = () => {
    const puesto = (navegCarp[nombre] || {}).navegador || '';
    const nomDe = r => (perfilesChrome.find(p => p.ruta === r) || {}).nombre || r;
    // ⭐ Tres estados y no dos: heredar el de base (valor vacío), apagarlo solo acá
    // ("ninguno"), o poner otro perfil. Vacío ya significaba "no dije nada", así que
    // el apagado necesita su propia palabra.
    sel.innerHTML =
      '<option value="">' + (navegDefecto.navegador
        ? 'El de siempre (' + esc(nomDe(navegDefecto.navegador)) + ')'
        : 'Sin navegador') + '</option>' +
      (navegDefecto.navegador
        ? '<option value="ninguno"' + (puesto === 'ninguno' ? ' selected' : '') +
          '>Ninguno, solo para esta carpeta</option>' : '') +
      perfilesChrome.map(p => '<option value="' + esc(p.ruta).replace(/"/g,'&quot;') +
        '"' + (p.ruta === puesto ? ' selected' : '') + '>' + esc(p.nombre) +
        (p.personal ? ' (todas tus cuentas)' : '') + '</option>').join('') +
      // ⚠ El que está puesto SIEMPRE aparece, aunque el disco ya no lo tenga: si no, el
      // menú diría "sin navegador" mientras la carpeta tiene uno configurado. Misma
      // regla que el ícono que la carpeta usa y no está en el juego.
      (puesto && !perfilesChrome.some(p => p.ruta === puesto)
        ? '<option value="' + esc(puesto).replace(/"/g,'&quot;') + '" selected>' +
          esc(puesto) + ' (no lo encuentro)</option>' : '');
  };
  (async () => {
    if (!perfilesChrome){
      try {
        const r = await fetch('/carpetas/navegadores');
        perfilesChrome = r.ok ? ((await r.json()).perfiles || []) : [];
      } catch(e){ perfilesChrome = []; }
    }
    pintarSelNaveg(); pintarBase(); contar();
  })();
  sel.onchange = async () => { if (await guardarNaveg('navegador', sel.value)) contar(); };
  // Los sitios se guardan al salir del campo o con Enter, no en cada tecla.
  campoSitios.onchange = () => guardarNaveg('sitios', campoSitios.value.trim());

  m.querySelector('[data-hace="nombre"]').onclick = () => {
    cerrarMenuTarjeta();
    // ⚠ La carpeta del disco NO se toca: esto es el rótulo, y el mismo que usa la
    // pastilla del proyecto arriba.
    const n = prompt('¿Cómo querés que se llame esta carpeta en la lista?\n' +
                     '(la carpeta del disco no se toca)', nombreGrupo(nombre));
    if (n === null) return;
    const v = n.trim();
    if (v && v !== nombre) apodos[nombre] = v; else delete apodos[nombre];
    guardarTarjetas(); subirCarp(nombre, 'apodo', apodos[nombre]);
    pintarCarpetas(); pintarTabs();
  };
  m.querySelector('[data-hace="sacar"]').onclick = () => {
    cerrarMenuTarjeta();
    ocultarCarpeta(nombre, true);
  };

  m.classList.add('abierto');
  ubicar();
}

$('#buscar').addEventListener('input', pintarCarpetas);

// Sumar una carpeta que todavía no tiene conversaciones: se escribe la ruta, el
// servidor comprueba que exista (y la crea si le decís que sí) y queda en la lista
// para arrancar una sesión ahí (pedido de Martín, 2026-08-17).
$('#sumar').onclick = async () => {
  const ruta = prompt('Pegá la ruta completa de la carpeta (por ejemplo C:\\Trabajo\\MiProyecto)');
  if (!ruta) return;
  let r;
  try {
    r = await (await fetch('/movil/carpeta', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ruta})})).json();
  } catch(e){ return alert('No pude: ' + e); }
  if (!r.ok && r.puede_crear){
    if (!confirm('Esa carpeta no existe. ¿La creo?')) return;
    try {
      r = await (await fetch('/movil/carpeta', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ruta, crear: true})})).json();
    } catch(e){ return alert('No pude: ' + e); }
  }
  if (!r.ok) return alert(r.error || 'No pude agregarla');
  await cargar();
  irProyecto(r.nombre);
};

function irProyecto(n){
  proy = n; activa = null; firma=''; recienAbierta = true;
  fijarDireccion();              // volviste a la bandeja: la dirección se limpia
  guardar(); pintarCarpetas(); pintarTabs(); pintar();
  cargar();   // ⭐ al volver a la bandeja, con datos frescos: si venís de mandar un
              // mensaje, la conversación ya aparece arriba y en verde (2026-08-17).
}

// Caer al final del todo, de verdad. ⚠ No alcanza con un `scrollTop`: las imágenes de
// las burbujas todavía no cargaron, ocupan alto cero, y cuando llegan empujan la
// conversación hacia abajo — quedabas a mitad de camino justo en las charlas con
// capturas, que acá son casi todas. Por eso se vuelve a bajar cuando cada una termina
// de cargar (mismo arreglo que ya tenía la pantalla del celular).
function alFinal(c){
  c.scrollTop = c.scrollHeight;
  c.querySelectorAll('img').forEach(i => {
    if (!i.complete)
      i.addEventListener('load', () => { c.scrollTop = c.scrollHeight; }, {once:true});
  });
}

// De qué grupo es una pestaña. Una charla recién abierta todavía no tiene carpeta
// (adentro se elige el proyecto), así que esas se juntan aparte en vez de quedar sueltas.
const grupoDe = t => proyectoDe(t) || SINCARPETA;

// Los grupos, en el orden en que aparece la PRIMERA pestaña de cada uno. Así arrastrar
// una pestaña sigue moviendo su grupo de lugar y el orden no salta solo.
function gruposDeTabs(){
  const orden = [], por = {};
  abiertas.forEach((t, i) => {
    const g = grupoDe(t);
    if (!por[g]){ por[g] = {nombre: g, tabs: []}; orden.push(por[g]); }
    por[g].tabs.push({t, i});
  });
  return orden;
}

function pintarTabs(){
  // ⚠ En medio de un arrastre NO se repinta: rearmar el HTML le saca al navegador el
  // elemento que estás moviendo y el arrastre se corta solo. El refresco de cada 8 s
  // cae justo acá (2026-08-17).
  if (arrastrando) return;
  const viva = sid => datos.proyectos.some(p => p.sesiones.some(s => s.id===sid && s.viva));
  const grupos = gruposDeTabs();
  // ⭐ El grupo de la charla que estás LEYENDO va siempre desplegado: si no, la
  // conversación quedaría en pantalla sin ninguna pestaña que la muestre.
  const act = abiertas.find(x => x.sid === activa);
  if (act) grupoAbierto = grupoDe(act);
  // ⚠ La caja que abraza al grupo va PRIMERA y no al final: está fuera del flujo (es
  // absoluta), así que no ocupa lugar, pero al final rompía el "el ＋ es el último de la
  // fila" — que sí es una regla de la pantalla. Adelante no molesta a nadie: el arrastre
  // recorre los grupos hacia ADELANTE con `nextElementSibling`.
  $('#tabs').innerHTML = '<div id="abrazo"></div>' + grupos.map(g => {
    const desplegado = g.nombre === grupoAbierto;
    // Plegado, la pastilla resume lo que pasa adentro con el mismo semáforo de siempre:
    // rojo si algo falló, verde si alguna te contestó, amarillo si alguna trabaja.
    const espera = g.tabs.some(({t}) => pendientes[t.sid] && activa !== t.sid);
    const fallo = g.tabs.some(({t}) => falladas[t.sid]);
    const trabajando = g.tabs.some(({t}) => enVuelo[t.sid] || viva(t.sid));
    const señal = fallo ? 'fallada' : espera ? 'espera' : trabajando ? 'trabajando' : '';
    const pastilla =
      '<div class="grupo ' + (desplegado ? 'abierto ' : '') + señal +
        '" draggable="true" data-grupo="' + esc(g.nombre) + '"' + pinta(claveGrupo(g.nombre)) +
        ' title="' + esc(nombreGrupo(g.nombre)) + ' · ' + g.tabs.length +
          (g.tabs.length === 1 ? ' conversación abierta' : ' conversaciones abiertas') +
          ' · botón derecho para cambiarla">' +
        (señal ? '<span class="bola"></span>' : '') +
        // Plegado, el grupo también avisa que adentro quedó algo a medio escribir: si no,
        // el borrador desaparece justo cuando la pastilla te esconde la charla.
        (!desplegado && g.tabs.some(({t}) => hayBorrador(t.sid))
          ? '<span class="plu">✎</span>' : '') +
        '<span class="flecha">' + (desplegado ? '▾' : '▸') + '</span>' +
        esc(nombreGrupo(g.nombre)) + '<span class="cuantas">' + g.tabs.length + '</span>' +
        '<span class="x" data-cerrargrupo="' + esc(g.nombre) + '"' +
          ' title="Cerrar las de este proyecto">✕</span></div>';
    if (!desplegado) return pastilla;
    return pastilla + g.tabs.map(({t, i}) => {
      // El mismo semáforo de la lista: verde ya te contestó y no fuiste a leerla, rojo
      // lo último que mandaste falló. Es para saber de un vistazo cuál te reclama algo
      // cuando tenés varias abiertas.
      const esp = pendientes[t.sid] && activa !== t.sid;
      const fal = !!falladas[t.sid];
      return '<div class="tab ' + (activa===t.sid?'sel':'') +
        (fal ? ' fallada' : esp ? ' espera' : '') + (recienTab===t.sid ? ' recien' : '') +
        '" draggable="true"' + pinta(t.sid) +
        ' data-i="' + i + '" data-sid="' + esc(t.sid) + '"' +
        ' title="' + esc(t.nombre) + ' · botón derecho para cambiarla">' +
        (enVuelo[t.sid] ? '<span class="viva late">●</span>'
          : (fal || esp) ? '<span class="bola"></span>'
          : (viva(t.sid)?'<span class="viva">●</span>':'')) +
        // La misma señal en chiquito: en la pestaña la chapa entera no entra.
        (hayBorrador(t.sid) ? '<span class="plu">✎</span>' : '') +
        esc(t.nombre) +
        (t.cerebro === 'codex' ? '<span class="cer">Codex</span>' : '') +
        '<span class="x" data-cerrar="' + i + '">✕</span></div>';
    }).join('');
  }).join('') +
    // El ＋ va SIEMPRE, aunque no haya ninguna pestaña abierta: es el atajo para
    // arrancar una charla sin tener que ir hasta la carpeta y buscar la fila de
    // "Empezar una conversación" (pedido de Martín, 2026-08-17).
    '<div class="tab mas" id="tabMas" title="Empezar una conversación">＋</div>';
  // ⚠ Solo las pestañas de verdad llevan el clic de ir/cerrar: el ＋ no tiene
  // `data-i`, y con el selector `.tab` pelado caía en abiertas[NaN] y reventaba.
  document.querySelectorAll('#tabs .tab[data-i]').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.cerrar !== undefined) { cerrar(+e.target.dataset.cerrar); return; }
      irTab(abiertas[+el.dataset.i].sid);
    };
    engancharArrastre(el);
  });
  document.querySelectorAll('#tabs .grupo').forEach(el => {
    el.onclick = e => {
      const g = e.target.dataset.cerrargrupo;
      if (g !== undefined) { cerrarGrupo(g); return; }
      plegarGrupo(el.dataset.grupo);
    };
    engancharArrastre(el);
  });
  $('#tabMas').onclick = nuevaCharla;
  acomodarAbrazo();
  // ⚠ Abrir o cerrar una pestaña cambia lo que ocupa la fila SIN cambiar su tamaño, así
  // que el ResizeObserver del menú no se entera: hay que avisarle a mano.
  if (window.menuAcomodar) menuAcomodar();
}

// ⭐ La caja que abraza al grupo desplegado: se mide de la pastilla a su última charla.
// Se llama después de cada pintado y después de cada movimiento del arrastre — es lo
// único que hay que acordarse de hacer, y a cambio el DOM de las pestañas queda plano.
// ⚠ Se usan `offsetLeft`/`offsetWidth` y no `getBoundingClientRect`: son coordenadas
// DENTRO de `#tabs`, que es lo que corresponde para algo posicionado ahí adentro, y así
// la caja no se descoloca cuando la fila está corrida con la rueda.
function acomodarAbrazo(){
  const caja = document.getElementById('abrazo');
  if (!caja) return;
  const pastilla = document.querySelector('#tabs .grupo.abierto');
  // Sin grupo desplegado no hay nada que abrazar: plegado ya es una pastilla sola.
  if (!pastilla){ caja.style.display = 'none'; return; }
  const bloque = bloqueDelGrupo(pastilla);
  const ultima = bloque[bloque.length - 1];
  const izq = pastilla.offsetLeft;
  const der = ultima.offsetLeft + ultima.offsetWidth;
  // ⚠ La caja acompaña deslizando cuando el grupo cambia de lugar, pero SOLO si ya
  // estaba a la vista: recién aparecida, la transición la haría venir volando desde el
  // borde izquierdo de la fila.
  const yaEstaba = caja.style.display === 'block';
  caja.style.transition = yaEstaba
    ? 'left .19s cubic-bezier(.2,.8,.3,1),width .19s cubic-bezier(.2,.8,.3,1)' : 'none';
  caja.style.display = 'block';
  caja.style.left = (izq - 6) + 'px';
  caja.style.width = (der - izq + 12) + 'px';
  // Si al proyecto le pintaste un color, la caja lo toma: el grupo entero se lee de una.
  const tono = TONOS[tonos[claveGrupo(pastilla.dataset.grupo)]];
  caja.style.borderColor = tono ? tono[1] : '';
}

// --- ⭐ El menú de una tarjetita: color y nombre --------------------------------------
// Pedido de Martín (2026-08-18): "me gustaría poder cambiar las tarjetitas, tanto la de
// sesión como la de proyecto". Botón derecho encima de cualquiera de las dos.
// ⚠ El color se elige y se ve EN EL ACTO, sin cerrar el menú: probar tres tonos son tres
// clics y no doce. Por eso el menú se repinta a mano en vez de rearmarse — el elemento
// que tocaste ya no existe después de `pintarTabs()`.
function abrirMenuTarjeta(e, el){
  e.preventDefault();
  e.stopPropagation();
  const esGrupo = el.classList.contains('grupo');
  const nombre = el.dataset.grupo || '';
  const sid = el.dataset.sid || '';
  const idx = el.dataset.i;
  const clave = esGrupo ? claveGrupo(nombre) : sid;
  const m = $('#menuTarjeta');
  m.innerHTML =
    '<div class="rub">' + (esGrupo ? 'Proyecto' : 'Conversación') + '</div>' +
    '<div class="tonos">' +
      Object.keys(TONOS).map(k =>
        '<div class="tono' + (tonos[clave] === k ? ' sel' : '') + '" data-tono="' + k +
        '" title="' + k + '" style="background:' + TONOS[k][0] +
        ';box-shadow:inset 0 0 0 2px ' + TONOS[k][2] + '"></div>').join('') +
      '<div class="tono nada' + (tonos[clave] ? '' : ' sel') +
        '" data-tono="" title="Sin color">✕</div>' +
      // La rueda: cualquier otro color, no solo los seis de la fila.
      '<span class="ruedaCaja' + (esHex(tonos[clave]) ? ' sel' : '') + '" title="Cualquier ' +
        'otro color"><input type="color" class="rueda" id="tonoRueda" value="' +
        (esHex(tonos[clave]) ? tonos[clave] : '#8ecbff') + '"></span>' +
    '</div><div class="sep"></div>' +
    // ⚠ La forma NO es de esta tarjeta sola: vale para todas las de su clase. El rótulo lo
    // dice, si no uno la elige creyendo que pinta una sola y se le mueven todas.
    '<div class="rub">Forma de ' +
      (esGrupo ? 'todos los proyectos' : 'todas las conversaciones') + '</div>' +
    '<div class="formas">' +
      Object.keys(FORMAS).map(k =>
        '<div class="forma' + (formas[esGrupo ? 'grupo' : 'tab'] === k ? ' sel' : '') +
        '" data-forma="' + k + '">' + FORMAS[k] + '</div>').join('') +
    '</div><div class="sep"></div>' +
    '<div class="op" data-hace="nombre">✎ Cambiarle el nombre</div>' +
    '<div class="op" data-hace="cerrar">✕ ' +
      (esGrupo ? 'Cerrar las de este proyecto' : 'Cerrar esta conversación') + '</div>';

  const marcar = el => {
    m.querySelectorAll('.tono').forEach(o => o.classList.toggle('sel', o === el));
    m.querySelector('.ruedaCaja').classList.toggle('sel', el === null);
  };
  m.querySelectorAll('.tono').forEach(t => t.onclick = () => {
    const v = t.dataset.tono;
    if (v) tonos[clave] = v; else delete tonos[clave];
    guardarTarjetas(); pintarTabs(); marcar(t);
    // La pastilla y la carpeta son el MISMO proyecto: el color elegido acá también sube.
    if (esGrupo) subirCarp(nombre, 'color', v);
  });
  // ⚠ Igual que la rueda del 🎨: mientras la arrastrás se aplica en vivo pero NO se
  // guarda (serían cien escrituras por un color); se guarda al soltar. Y no se redibuja
  // el menú en el medio, o el navegador cierra su propio selector.
  const rueda = m.querySelector('#tonoRueda');
  rueda.oninput  = () => { tonos[clave] = rueda.value; pintarTabs(); marcar(null); };
  rueda.onchange = () => { tonos[clave] = rueda.value; guardarTarjetas(); pintarTabs();
                           marcar(null);
                           if (esGrupo) subirCarp(nombre, 'color', rueda.value); };
  // Igual que el color: se ve en el acto y el menú se queda abierto, para poder probar
  // las cuatro formas sin volver a abrirlo cuatro veces.
  m.querySelectorAll('.forma').forEach(f => f.onclick = () => {
    formas[esGrupo ? 'grupo' : 'tab'] = f.dataset.forma;
    guardarTarjetas(); aplicarFormas();
    m.querySelectorAll('.forma').forEach(o => o.classList.toggle('sel', o === f));
  });
  m.querySelector('[data-hace="nombre"]').onclick = () => {
    cerrarMenuTarjeta();
    if (esGrupo){
      // El nombre de la CARPETA no se toca: esto es el rótulo de la pastilla, y solo acá.
      const n = prompt('¿Cómo querés que se llame este proyecto en la barra?',
                       nombreGrupo(nombre));
      if (n === null) return;
      const v = n.trim();
      if (v && v !== nombre) apodos[nombre] = v; else delete apodos[nombre];
      guardarTarjetas(); subirCarp(nombre, 'apodo', apodos[nombre]); pintarTabs();
    } else {
      const t = abiertas.find(x => x.sid === sid);
      renombrar(sid, t ? t.nombre : '');
    }
  };
  m.querySelector('[data-hace="cerrar"]').onclick = () => {
    cerrarMenuTarjeta();
    if (esGrupo) cerrarGrupo(nombre); else cerrar(+idx);
  };

  m.classList.add('abierto');
  // Al puntero, sin salirse de la pantalla por la derecha ni por abajo.
  const an = m.offsetWidth, al = m.offsetHeight;
  m.style.left = Math.round(Math.max(8, Math.min(e.clientX, innerWidth - an - 8))) + 'px';
  m.style.top = Math.round(Math.max(8, Math.min(e.clientY, innerHeight - al - 8))) + 'px';
}

function cerrarMenuTarjeta(){ $('#menuTarjeta').classList.remove('abierto'); }

$('#tabs').addEventListener('contextmenu', e => {
  const el = e.target.closest('.tab[data-i], .grupo');
  if (!el) return;                    // el ＋ y el aire no tienen menú: sale el del navegador
  abrirMenuTarjeta(e, el);
});
$('#menuTarjeta').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', cerrarMenuTarjeta);
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMenuTarjeta(); });
// Cambia el ancho de la ventana y las pestañas se reacomodan sin repintarse: la caja
// tiene que volver a medirse o queda abrazando el aire.
addEventListener('resize', acomodarAbrazo);

// Tocar la pastilla: si está plegada la despliega, y si estaba desplegada la pliega.
// ⭐ Se ve UNO SOLO a la vez, que es lo que mantiene la barra corta.
function plegarGrupo(nombre){
  if (grupoAbierto === nombre){
    grupoAbierto = '';
    // ⭐ Si estabas leyendo una charla de ese proyecto, plegar también la cierra en
    // pantalla y te deja en la bandeja: si no, quedaría la conversación abierta sin
    // ninguna pestaña que la muestre, que es justo lo que no se entiende.
    const t = abiertas.find(x => x.sid === activa);
    if (t && grupoDe(t) === nombre){ activa = null; recienAbierta = true; }
  } else grupoAbierto = nombre;
  firma=''; guardar(); pintarCarpetas(); pintarTabs(); pintar();
}

// La ✕ de la pastilla cierra TODAS las charlas de ese proyecto de una. No borra nada:
// las conversaciones siguen enteras en la lista, esto es solo sacarlas de la barra.
function cerrarGrupo(nombre){
  abiertas = abiertas.filter(t => grupoDe(t) !== nombre);
  if (grupoAbierto === nombre) grupoAbierto = '';
  // Igual que cerrar una pestaña suelta: terminaste con eso, lo que se quiere ver
  // después es la bandeja con todo.
  activa = null; proy = TODAS; recienAbierta = true;
  firma=''; guardar(); pintarCarpetas(); pintarTabs(); pintar();
  cargar();
}

// --- Mover las pestañas arrastrándolas, como en el navegador -------------------
// Pedido de Martín (2026-08-17). ⭐ La clave es que MIENTRAS arrastrás no se rearma el
// HTML: se mueve el NODO de lugar con `insertBefore`, y recién al soltar se reordena
// `abiertas` leyendo el orden que quedó en pantalla. Si en vez de eso se repintara en
// cada `dragover` —que es lo primero que uno escribe—, el navegador perdería el
// elemento que tiene agarrado y el arrastre se cortaría al primer movimiento.
let arrastrando = false;

// ⭐ Las pestañas que se corren para hacerle lugar a la que llevás DESLIZAN, no saltan.
// El truco es el de siempre para reordenar sin que nada parpadee (se lo llama FLIP): se
// anota dónde estaba cada una, se hace el cambio de verdad, y a las que quedaron en otro
// lado se las manda de vuelta a su lugar viejo con un `transform` y se las suelta con
// transición — el navegador dibuja el viaje. Sin esto el reordenamiento era un tirón
// seco, que es lo que Martín describió como "muy áspero" (2026-08-17).
function deslizando(cambio){
  // Las pastillas de proyecto entran en el mismo baile: también se corren de lugar.
  const tabs = [...document.querySelectorAll('#tabs .tab, #tabs .grupo')];
  const antes = tabs.map(t => t.getBoundingClientRect().left);
  cambio();
  acomodarAbrazo();          // la caja del grupo viaja con él
  tabs.forEach((t, i) => {
    const dx = antes[i] - t.getBoundingClientRect().left;
    if (!dx) return;
    t.style.transition = 'none';
    t.style.transform = 'translateX(' + dx + 'px)';
  });
  // En el cuadro siguiente se sueltan: si se hiciera en el mismo, el navegador junta
  // los dos estados y no hay animación ninguna.
  requestAnimationFrame(() => tabs.forEach(t => {
    if (!t.style.transform) return;
    t.style.transition = 'transform .19s cubic-bezier(.2,.8,.3,1)';
    t.style.transform = '';
  }));
}

// ⭐⭐ Dónde iría la pestaña si soltaras el mouse EN ESTE PUNTO: la primera cuya mitad
// quedó a la derecha del puntero (y si ninguna, al final, antes del ＋). Lo que importa
// es que el destino sale SOLO de la posición del mouse: es una función de dónde estás,
// no del historial de eventos.
function destinoPara(x){
  const otras = [...document.querySelectorAll('#tabs .tab[data-i]')]
    .filter(t => !t.classList.contains('moviendo'));
  for (const t of otras){
    const r = t.getBoundingClientRect();
    if (x < r.left + r.width / 2) return t;
  }
  // ⚠ Al final, pero al final DE SU GRUPO, no de la barra: con las pestañas agrupadas,
  // soltar contra el ＋ metía el nodo después de las pastillas de los otros proyectos y
  // se veía saltar fuera de su grupo (el orden real se arregla al soltar, pero la
  // pestaña que llevás en la mano tiene que verse donde va a quedar).
  return otras.length ? otras[otras.length - 1].nextElementSibling : $('#tabMas');
}

// Lo mismo, pero para las PASTILLAS de proyecto: el destino son las otras pastillas, no
// las pestañas. Al final de todo va contra el ＋, que sí es el fin de la barra.
function destinoGrupoPara(x){
  const otros = [...document.querySelectorAll('#tabs .grupo')]
    .filter(g => !g.classList.contains('moviendo'));
  for (const g of otros){
    const r = g.getBoundingClientRect();
    if (x < r.left + r.width / 2) return g;
  }
  return $('#tabMas');
}

// ⭐ Una pastilla no viaja sola: se lleva las pestañas que tenga desplegadas. En el DOM
// son sus hermanas de al lado, hasta la pastilla siguiente. Moviendo solo la pastilla, el
// grupo abierto se partía en dos y sus charlas quedaban colgando del proyecto de al lado.
function bloqueDelGrupo(pastilla){
  const nodos = [pastilla];
  let s = pastilla.nextElementSibling;
  while (s && s.classList.contains('tab') && s.dataset.i !== undefined){
    nodos.push(s);
    s = s.nextElementSibling;
  }
  return nodos;
}

// ⚠⚠ El `dragover` va en la BARRA, no en cada pestaña. La primera versión reordenaba
// "cuando el evento caía sobre otra pestaña", y como `dragover` se dispara decenas de
// veces por segundo, al acercarte al borde de la vecina se armaba un ida y vuelta a
// toda velocidad — Martín lo vio enseguida: "entra en un bucle muy rápido y queda feo".
// La cura no es frenar el bucle con un temporizador, es que **no haya nada que rebotar**:
// el destino depende solo de dónde está el mouse, y si la pestaña ya está en ese lugar
// no se toca el DOM. Cruzada la mitad de la vecina, el destino cambia una sola vez y se
// queda ahí (2026-08-17).
$('#tabs').addEventListener('dragover', e => {
  const movida = $('#tabs .tab.moviendo') || $('#tabs .grupo.moviendo');
  if (!movida) return;
  e.preventDefault();                        // sin esto el navegador no deja soltar
  const grupo = movida.classList.contains('grupo');
  const destino = grupo ? destinoGrupoPara(e.clientX) : destinoPara(e.clientX);
  if (!destino || destino === movida) return;
  // "Ya está ahí": para un grupo se mira lo que sigue al ÚLTIMO nodo del bloque, no a la
  // pastilla — si no, con el grupo desplegado el destino era siempre su propia pestaña y
  // el bloque se quedaba pegado en el lugar sin moverse nunca.
  const bloque = grupo ? bloqueDelGrupo(movida) : [movida];
  if (bloque[bloque.length - 1].nextElementSibling === destino) return;
  if (bloque.includes(destino)) return;
  deslizando(() => bloque.forEach(n => $('#tabs').insertBefore(n, destino)));
});

function engancharArrastre(el){
  el.ondragstart = e => {
    arrastrando = true;
    el.classList.add('moviendo');
